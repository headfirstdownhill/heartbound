  { key: 'shield', texture: 'bubble_shield', weight: 30, label: 'SHIELDED' },
  { key: 'ally', texture: 'bubble_ally', weight: 30 },
  { key: 'nuke', texture: 'bubble_nuke', weight: 8, label: 'WIPED OUT' },
];

function rollPowerUp() {
  const total = POWERUPS.reduce((sum, p) => sum + p.weight, 0);
  let roll = Math.random() * total;
  for (const p of POWERUPS) {
    roll -= p.weight;
    if (roll <= 0) return p;
  }
  return POWERUPS[0];
}

/* ---- js/systems/RoomBuilder.js ---- */

const THEMES = {
  garden: {
    floor: ['tile_grass', 'tile_grass2', 'tile_grass3', 'tile_grass4'],
    wall: ['tile_hedge', 'tile_hedge2'],
    decor: 'flower',
    // Hedges are foliage, so their contact shadow is soft and green-black.
    shadow: 0x16240f,
  },
  dungeon: {
    floor: ['tile_floor', 'tile_floor2', 'tile_floor3', 'tile_floor4'],
    wall: ['tile_wall', 'tile_wall2'],
    shadow: 0x0d0916,
    torches: true,
  },
};

function tileToWorld(col, row) {
  return { x: ROOM_X + col * TILE + TILE / 2, y: ROOM_Y + row * TILE + TILE / 2 };
}

// Stamps the whole room into one RenderTexture (hundreds of individual tile
// GameObjects is a real cost on low-end phones) and returns the static wall
// bodies plus every marker the scene needs to populate itself.
function buildRoom(scene, level) {
  const theme = THEMES[level.theme] ?? THEMES.dungeon;
  const grid = level.grid;
  const rows = grid.length;
  const cols = grid[0].length;
  const isWall = (r, c) => grid[r]?.[c] === '#';

  const rt = scene.add.renderTexture(ROOM_X, ROOM_Y, cols * TILE, rows * TILE).setOrigin(0, 0);
  rt.setDepth(-100);

  const walls = scene.physics.add.staticGroup();
  const spawns = { enemies: [], player: null, door: null, sword: null, boy: null, boss: null };
  const torches = [];

  // Contact shadows, drawn over the floor but under everything that stands on
  // it. Three stacked bands rather than one, so the wall's shadow falls off
  // instead of ending in a hard line.
  const shade = scene.add.graphics().setDepth(-99);

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const ch = grid[row][col];
      const px = col * TILE;
      const py = row * TILE;
      const roll = hash2(col, row);

      if (ch === '#') {
        rt.draw(theme.wall[Math.floor(roll * theme.wall.length) % theme.wall.length], px, py);
        const body = walls.create(ROOM_X + px + TILE / 2, ROOM_Y + py + TILE / 2, null);
        body.setVisible(false);
        body.body.setSize(TILE, TILE);
        body.refreshBody();

        // A torch every few tiles, on wall faces that the player can actually
        // see — a light source buried inside a block of wall is wasted.
        if (theme.torches && !isWall(row + 1, col) && row + 1 < rows && roll > 0.72) {
          torches.push({ x: ROOM_X + px + TILE / 2, y: ROOM_Y + py + TILE / 2 + 4 });
        }
        continue;
      }

      // Deterministic floor variation, no per-frame randomness.
      const variant = theme.floor[(col * 7 + row * 3 + Math.floor(roll * 4)) % theme.floor.length];
      rt.draw(variant, px, py);
      if (theme.decor && roll < 0.14) {
        rt.draw(theme.decor, px + 4 + roll * 100, py + 6 + hash2(row, col) * 18);
      }

      if (isWall(row - 1, col)) {
        const sx = ROOM_X + px;
        const sy = ROOM_Y + py;
        [0.34, 0.2, 0.1].forEach((a, i) => {
          shade.fillStyle(theme.shadow, a);
          shade.fillRect(sx, sy + i * 4, TILE, 4);
        });
      }

      const world = tileToWorld(col, row);
      if (ch === 'P') spawns.player = world;
      else if (ch === 'D') spawns.door = world;
      else if (ch === 'S') spawns.sword = world;
      else if (ch === 'Y') spawns.boy = world;
      else if (ch === 'B') spawns.boss = world;
      else if (TIER_BY_CHAR[ch]) spawns.enemies.push({ tier: TIER_BY_CHAR[ch], ...world });
    }
  }

  return { walls, spawns, torches, theme: level.theme, width: cols * TILE, height: rows * TILE };
}

/* ---- js/systems/CutsceneDirector.js ---- */

// A flat, ordered list of beats. Nesting tween callbacks by hand for a scene
// this long turns unreadable fast; this keeps the intro readable as a script.
class CutsceneDirector {
  constructor(scene) {
    this.scene = scene;
    this.queue = [];
    this.index = 0;
    this.stopped = false;
  }

  // `config` may be a function returning the config. Pass one whenever the
  // targets do not exist yet at script-build time (anything spawned mid-scene) —
  // an object literal captures the targets array as it is right now.
  tween(config) {
    this.queue.push({ type: 'tween', config });
    return this;
  }

  // Fire a tween but move straight on to the next beat, so things can overlap.
  tweenAsync(config) {
    this.queue.push({ type: 'tweenAsync', config });
    return this;
  }

  wait(ms) {
    this.queue.push({ type: 'wait', ms });
    return this;
  }

  call(fn) {
    this.queue.push({ type: 'call', fn });
    return this;
  }

  play(onComplete) {
    this.onComplete = onComplete;
    this.next();
  }

  stop() {
    this.stopped = true;
  }

  next() {
    if (this.stopped) return;
    if (this.index >= this.queue.length) {
      this.onComplete?.();
      return;
    }
    const step = this.queue[this.index++];
    const resolve = (c) => (typeof c === 'function' ? c() : c);
    switch (step.type) {
      case 'wait':
        this.scene.time.delayedCall(step.ms, () => this.next());
        break;
      case 'call':
        step.fn();
        this.next();
        break;
      case 'tween': {
        const config = resolve(step.config);
        // A tween with no targets fires onComplete immediately and would silently
        // skip the beat, so treat it as a plain wait instead.
        if (!config.targets || config.targets.length === 0) {
          this.scene.time.delayedCall(config.duration ?? 0, () => this.next());
          break;
        }
        this.scene.tweens.add({ ...config, onComplete: () => this.next() });
        break;
      }
      case 'tweenAsync':
        this.scene.tweens.add(resolve(step.config));
        this.next();
        break;
      default:
        this.next();
    }
  }
}

/* ---- js/entities/Player.js ---- */

// Where the swing lands, relative to the player, per facing.
const REACH = 26;
const HIT_W = 34;
const HIT_H = 30;
// How far she has to walk between puffs of dust. Tuned by eye against her
// walk cycle so a footfall and a puff land together.
const STEP_DISTANCE = 26;

class Player {
  constructor(scene, x, y, input) {
    this.scene = scene;
    this.input = input;
    this.facing = 'down';
    this.attackUntil = 0;
    this.nextAttackAt = 0;
    this.invulnUntil = 0;
    // Separate from invulnUntil so the shield power-up cannot be cut short by
    // an ordinary hit, and so it can be shown differently.
    this.shieldUntil = 0;
    this.frozen = false;
    this.alive = true;
    this.hitThisSwing = new Set();

    this.sprite = scene.physics.add.sprite(x, y, 'girl_idle_down');
    this.sprite.setDepth(y);
    this.sprite.body.setSize(18, 12).setOffset(7, 19);
    this.sprite.setCollideWorldBounds(false);
    this.sprite.owner = this;

    // Sword rides alongside her rather than being drawn into every frame.
    this.sword = scene.add.image(x, y, 'sword').setDepth(y + 1).setVisible(GameState.hasSword);
    this.sword.setScale(0.85);

    this.slash = scene.add.image(x, y, 'slash').setDepth(y + 2).setVisible(false);

    // She is the one thing on screen that is always moving, so she is the one
    // that most needs grounding.
    scene.fx?.attachShadow(this.sprite, { scaleX: 0.32, scaleY: 0.3, offsetY: 12 });
    this.stepAccum = 0;
    this.lastX = x;
    this.lastY = y;
  }

  get x() {
    return this.sprite.x;
  }

  get y() {
    return this.sprite.y;
  }

  equipSword() {
    GameState.hasSword = true;
    this.sword.setVisible(true);
    this.scene.fx?.star(this.x, this.y - 10, { tint: 0xfff2c4, scale: 0.85 });
    this.scene.fx?.sparkleTrail(this.x, this.y - 10, 0xfff2c4, 14);
  }

  freeze() {
    this.frozen = true;
    this.sprite.body.setVelocity(0, 0);
    this.playAnim('idle');
  }

  unfreeze() {
    this.frozen = false;
  }

  playAnim(kind) {
    const dir = this.facing === 'left' || this.facing === 'right' ? 'side' : this.facing;
    const key = `girl_${kind}_${dir}`;
    this.sprite.setFlipX(this.facing === 'left');
    if (this.sprite.anims.currentAnim?.key !== key) this.sprite.play(key);
  }

  update(time) {
    if (!this.alive) return;
    const body = this.sprite.body;

    if (this.frozen) {
      body.setVelocity(0, 0);
    } else {
      const v = this.input.getMoveVector();
      const attacking = time < this.attackUntil;
      // Swinging slows her rather than rooting her — mobile input feels dead if
      // the character stops responding mid-tap.
      const speed = attacking ? PLAYER_SPEED * 0.45 : PLAYER_SPEED;
      body.setVelocity(v.x * speed, v.y * speed);

      if ((v.x !== 0 || v.y !== 0) && !attacking) {
        this.facing =
          Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'right' : 'left') : v.y > 0 ? 'down' : 'up';
      }
      this.playAnim(v.x !== 0 || v.y !== 0 ? 'walk' : 'idle');

      if (this.input.isAttackPressed() && time >= this.nextAttackAt) this.startAttack(time);
    }

    this.sprite.setDepth(this.sprite.y);
    this.positionSword(time);
    this.trackFootsteps();

    // Flicker through invulnerability so being hit is legible.
    if (time < this.invulnUntil) {
      this.sprite.setAlpha(Math.floor(time / 70) % 2 ? 0.35 : 1);
    } else if (this.sprite.alpha !== 1) {
      this.sprite.setAlpha(1);
    }
  }

  // Distance-based rather than on a timer, so the puffs stay in step with her
  // feet whether she is walking full speed or dragging through a swing.
  trackFootsteps() {
    const moved = Phaser.Math.Distance.Between(this.lastX, this.lastY, this.sprite.x, this.sprite.y);
    this.lastX = this.sprite.x;
    this.lastY = this.sprite.y;
    if (moved < 0.4) {
      this.stepAccum = 0;
      return;
    }
    this.stepAccum += moved;
    if (this.stepAccum < STEP_DISTANCE) return;
    this.stepAccum = 0;
    this.scene.fx?.dust(this.sprite.x, this.sprite.y + 12, 2, this.scene.stepDustTint ?? 0xbfae94);
  }

  positionSword(time) {
    if (!GameState.hasSword) {
      this.sword.setVisible(false);
      return;
    }
    const swinging = time < this.attackUntil;
    const offsets = {
      down: { x: 13, y: 8, a: 160 },
      up: { x: -13, y: 0, a: -30 },
      left: { x: -15, y: 5, a: -75 },
      right: { x: 15, y: 5, a: 75 },
    };
    const o = offsets[this.facing];
    const t = swinging ? 1 - (this.attackUntil - time) / ATTACK_ACTIVE_MS : 0;
    const swing = swinging ? Math.sin(t * Math.PI) * 55 : 0;
    this.sword
      .setVisible(true)
      .setPosition(this.sprite.x + o.x, this.sprite.y + o.y)
      .setAngle(o.a + (this.facing === 'left' ? -swing : swing))
      // Behind her when she has her back to us, in front otherwise.
      .setDepth(this.sprite.y + (this.facing === 'up' ? -1 : 1));
  }

  startAttack(time) {
    this.attackUntil = time + ATTACK_ACTIVE_MS;
    this.nextAttackAt = time + ATTACK_COOLDOWN_MS;
    this.hitThisSwing.clear();

    const box = this.getHitbox();
    this.slash
      .setVisible(true)
      .setPosition(box.centerX, box.centerY)
      .setAngle({ down: 180, up: 0, left: -90, right: 90 }[this.facing])
      .setAlpha(0.9)
      .setScale(1)
      .setDepth(this.sprite.y + 2);
    this.scene.tweens.add({
      targets: this.slash,
      alpha: 0,
      scale: 1.35,
      duration: ATTACK_ACTIVE_MS,
      onComplete: () => this.slash.setVisible(false),
    });

    // A bare fist gets a duller, lower whoosh and no steel-coloured crescent,
    // so picking the sword up is audible as well as visible.
    const armed = GameState.hasSword;
    this.scene.fx?.slashArc(box.centerX, box.centerY, this.facing, armed ? 0xdfe5ef : 0xf6cba0);
    audio.play('swing', { pitch: armed ? 1 : 0.72 });
  }

  getHitbox() {
    const dx = { left: -REACH, right: REACH, up: 0, down: 0 }[this.facing];
    const dy = { up: -REACH, down: REACH, left: 4, right: 4 }[this.facing];
    const vertical = this.facing === 'up' || this.facing === 'down';
    const w = vertical ? HIT_W : HIT_H;
    const h = vertical ? HIT_H : HIT_W;
    return new Phaser.Geom.Rectangle(
      this.sprite.x + dx - w / 2,
      this.sprite.y + dy - h / 2,
      w,
      h,
    );
  }

  isSwinging(time) {
    return time < this.attackUntil;
  }

  get damage() {
    return GameState.hasSword ? SWORD_DAMAGE : FIST_DAMAGE;
  }

  isShielded(time) {
    return time < this.shieldUntil;
  }

  takeDamage(amount, fromX, fromY, time) {
    if (!this.alive || time < this.invulnUntil) return false;
    // Shielded still knocks her back and still flashes, it just costs nothing.
    if (this.isShielded(time)) {
      const away = Math.atan2(this.sprite.y - fromY, this.sprite.x - fromX);
      this.sprite.body.setVelocity(Math.cos(away) * 200, Math.sin(away) * 200);
      this.invulnUntil = time + 220;
      this.scene.fx?.ring(this.x, this.y, { tint: 0x9fd8ff, to: 0.7, duration: 300, flat: false });
      audio.play('shielded');
      return false;
    }
    this.invulnUntil = time + PLAYER_IFRAME_MS;
    GameState.playerHp = Math.max(0, GameState.playerHp - amount);
    this.scene.game.events.emit(EV_HEALTH_CHANGED, GameState.playerHp);

    const angle = Math.atan2(this.sprite.y - fromY, this.sprite.x - fromX);
    this.sprite.body.setVelocity(Math.cos(angle) * 240, Math.sin(angle) * 240);
    this.scene.cameras.main.shake(120, 0.008);

    const fx = this.scene.fx;
    fx?.ring(this.x, this.y, { tint: 0xff4d6d, to: 0.85, duration: 340 });
    fx?.gooBurst(this.x, this.y - 4, 0xff4d6d, 9);
    // A red wash rather than a camera flash: the flash whites out the whole
    // frame, and this reads as being hurt instead of as a lightning strike.
    fx?.tint([1, 0.18, 0.3], 0.4, 260);
    audio.play('hurt');
    return GameState.playerHp <= 0;
  }

  reviveAt(x, y) {
    GameState.playerHp = PLAYER_MAX_HP;
    this.sprite.setPosition(x, y);
    this.sprite.body.setVelocity(0, 0);
    this.invulnUntil = this.scene.time.now + PLAYER_IFRAME_MS * 1.5;
    this.scene.game.events.emit(EV_HEALTH_CHANGED, GameState.playerHp);
  }

  destroy() {
    this.sprite.destroy();
    this.sword.destroy();
    this.slash.destroy();
  }
}

/* ---- js/entities/Blob.js ---- */

const CONTACT_COOLDOWN_MS = 900;

// Particles are tinted from the same table the sprites are, so a red blob
// throws red goo without anybody having to keep two lists of colours in sync.
function tierTint(tier) {
  const hex = BLOB_TINTS[tier]?.g ?? '#7ed957';
  return parseInt(hex.slice(1), 16);
}

// How high a tier's pitch sits. Little green ones squeak, the big red ones
// growl, and the bosses are below all of them.
const TIER_PITCH = { easy: 1.25, medium: 1.05, hard: 0.85, boss: 0.62, final: 0.5, ally: 1.3 };

class Blob {
  // `stats` overrides the tier defaults, which is how the Jory run makes the
  // same three tiers hit harder without needing new sprites or new tiers.
  // `prefix` names the texture set; the bosses do not follow `blob_<tier>_*`.
  constructor(scene, x, y, tier = 'easy', stats = null, prefix = null) {
    this.scene = scene;
    this.tier = tier;
    this.prefix = prefix ?? `blob_${tier}`;
    this.stats = stats ?? BLOB_STATS[tier];
    this.hp = this.stats.hp;
    this.state = 'wander';
    this.dying = false;
    this.nextWanderAt = 0;
    this.wanderDir = { x: 0, y: 0 };
    this.hitUntil = 0;
    this.nextContactAt = 0;

    this.sprite = scene.physics.add.sprite(x, y, `${this.prefix}_idle`);
    this.sprite.setDepth(y);
    // Without this they wander out through the doorway gap and become unreachable,
    // which would leave the room permanently unclearable.
    this.sprite.setCollideWorldBounds(true);
    // Sprite size varies by tier (bigger pixel scale for the red ones), so the
    // body is placed relative to the actual frame rather than hard-coded.
    const w = this.stats.hitW ?? 20;
    const h = this.stats.hitH ?? 14;
    this.sprite.body
      .setSize(w, h)
      .setOffset((this.sprite.width - w) / 2, this.sprite.height - h - 2);
    this.nextWeaveAt = 0;
    this.weaveSign = 1;
    this.sprite.owner = this;
    this.sprite.play(`${this.prefix}_idle`);

    this.tint = tierTint(tier);
    this.pitch = TIER_PITCH[tier] ?? 1;
    // Offset per blob, so a room full of them does not pulse in unison.
    this.wobblePhase = Math.random() * Math.PI * 2;
    scene.fx?.attachShadow(this.sprite, {
      scaleX: (w / 20) * 0.4,
      scaleY: (w / 20) * 0.32,
      offsetY: h * 0.45,
      alpha: 0.4,
    });

    // They glow faintly in their own colour. Mostly this is because slime that
    // glows looks better than slime that does not, but it is also what keeps a
    // blob findable in an unlit corner of a dungeon without having to raise the
    // light on the whole room and lose the atmosphere.
    this.glow = scene.add
      .image(x, y, 'fx_glow')
      .setTint(this.tint)
      .setAlpha(0.3)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y - 2)
      .setScale((w / 20) * 0.62);
    this.glowScale = (w / 20) * 0.62;
  }

  // Follows the sprite and breathes with the wobble, so the light looks like it
  // is coming off the body rather than sitting behind it.
  updateGlow(time) {
    if (!this.glow) return;
    const pulse = 1 + Math.sin(time * 0.004 + this.wobblePhase) * 0.12;
    this.glow
      .setPosition(this.sprite.x, this.sprite.y + 2)
      .setDepth(this.sprite.y - 2)
      .setScale(this.glowScale * pulse)
      .setAlpha(0.3 * this.sprite.alpha);
  }

  get x() {
    return this.sprite.x;
  }

  get y() {
    return this.sprite.y;
  }

  update(time, player) {
    if (this.dying) return;
    const body = this.sprite.body;

    if (time < this.hitUntil) {
      body.setDrag(600);
      return;
    }
    body.setDrag(0);

    const dist = Phaser.Math.Distance.Between(this.x, this.y, player.x, player.y);

    if (dist < this.stats.aggro) {
      if (this.state !== 'chase') {
        this.state = 'chase';
        this.sprite.play(`${this.prefix}_chase`);
      }
      const angle = Math.atan2(player.y - this.y, player.x - this.x);
      let vx = Math.cos(angle) * this.stats.speed;
      let vy = Math.sin(angle) * this.stats.speed;
      // Weave across the approach so they don't walk into the swing in a
      // straight line. Bigger `dodge` values make a tier harder to connect with.
      const dodge = this.stats.dodge ?? 0;
      if (dodge > 0) {
        if (time > this.nextWeaveAt) {
          this.nextWeaveAt = time + Phaser.Math.Between(280, 620);
          this.weaveSign *= -1;
        }
        vx += -Math.sin(angle) * this.stats.speed * dodge * this.weaveSign;
        vy += Math.cos(angle) * this.stats.speed * dodge * this.weaveSign;
      }
      body.setVelocity(vx, vy);
    } else {
      if (this.state !== 'wander') {
        this.state = 'wander';
        this.sprite.play(`${this.prefix}_idle`);
      }
      if (time > this.nextWanderAt) {
        this.nextWanderAt = time + Phaser.Math.Between(900, 2200);
        const a = Math.random() * Math.PI * 2;
        this.wanderDir = Math.random() < 0.3 ? { x: 0, y: 0 } : { x: Math.cos(a), y: Math.sin(a) };
      }
      const slow = this.stats.speed * 0.4;
      body.setVelocity(this.wanderDir.x * slow, this.wanderDir.y * slow);
    }

    this.sprite.setDepth(this.sprite.y);
    this.wobble(time, body);
    this.updateGlow(time);
  }

  // They are made of jelly, so they should move like it: squashed wide at the
  // bottom of the hop, stretched tall at the top, faster while chasing.
  // Skipped while something else is tweening the sprite, or this would fight
  // the pop-in the arena spawns blobs with.
  wobble(time, body) {
    if (this.scene.tweens.isTweening(this.sprite)) return;
    const moving = Math.abs(body.velocity.x) + Math.abs(body.velocity.y) > 12;
    const rate = moving ? 0.014 : 0.005;
    const depth = moving ? 0.09 : 0.035;
    const s = Math.sin(time * rate + this.wobblePhase) * depth;
    this.sprite.setScale(1 - s, 1 + s);
  }

  canTouch(time) {
    return !this.dying && time >= this.nextContactAt;
  }

  registerTouch(time) {
    this.nextContactAt = time + CONTACT_COOLDOWN_MS;
  }

  takeDamage(amount, fromX, fromY, time) {
    if (this.dying) return;
    this.hp -= amount;
    this.showHit(amount, fromX, fromY);
    if (this.hp <= 0) {
      this.die();
      return;
    }
    this.hitUntil = time + 180;
    this.sprite.setScale(1);
    this.sprite.play(`${this.prefix}_hit`);
    this.sprite.once('animationcomplete', () => {
      if (!this.dying) this.sprite.play(`${this.prefix}_chase`);
    });
    const angle = Math.atan2(this.y - fromY, this.x - fromX);
    this.sprite.body.setVelocity(Math.cos(angle) * 300, Math.sin(angle) * 300);
  }

  // Sparks fly back along the line of the blow and goo comes off the far side,
  // so a hit reads as a direction and not just as a flash.
  showHit(amount, fromX, fromY) {
    const fx = this.scene.fx;
    const angle = Math.atan2(this.y - fromY, this.x - fromX);
    const px = this.x - Math.cos(angle) * 8;
    const py = this.y - Math.sin(angle) * 8;
    fx?.hitSpark(px, py, 0xfff2c4, 6);
    fx?.gooBurst(this.x, this.y - 4, this.tint, 5);
    fx?.damageNumber(this.x, this.y - 10, amount, 0xfff2c4);
    fx?.punch(0.004, 90, 0.008);
    audio.play('squelch', { pitch: this.pitch });
  }

  die() {
    this.dying = true;
    this.sprite.body.setVelocity(0, 0);
    this.sprite.body.enable = false;
    this.sprite.setScale(1);
    this.sprite.play(`${this.prefix}_death`);
    if (this.glow) {
      this.scene.tweens.add({
        targets: this.glow,
        alpha: 0,
        scale: this.glowScale * 2.4,
        duration: 320,
        onComplete: () => this.glow?.destroy(),
      });
      this.glow = null;
    }

    const fx = this.scene.fx;
    fx?.gooBurst(this.x, this.y - 4, this.tint, 18);
    fx?.ring(this.x, this.y, { tint: this.tint, to: 0.75, duration: 380 });
    fx?.burst(this.x, this.y - 4, { tint: this.tint, scale: 0.9, duration: 260 });
    fx?.splat(this.x, this.y, this.tint);
    audio.play('blobDie', { pitch: this.pitch });

    this.scene.game.events.emit(EV_BLOB_DIED, this);
    this.sprite.once('animationcomplete', () => this.sprite.destroy());
  }

  destroy() {
    this.glow?.destroy();
    this.sprite.destroy();
  }
}

/* ---- js/entities/BossBlob.js ---- */

const WINDUP_MS = 850;
const LUNGE_MS = 420;
const STUN_MS = 900;
const IDLE_BETWEEN_MS = 1300;
const MINION_INTERVAL_MS = 7000;

// Phase 1 is a readable charge: telegraph, lunge, then a stun window that is the
// player's invitation to hit back. Phase 2 keeps that and adds adds.
class BossBlob extends Blob {
  constructor(scene, x, y) {
    // The boss's textures are `boss_*`, not `blob_boss_*`; without the prefix
    // the base constructor asks for a texture that was never built.
    super(scene, x, y, 'boss', null, 'boss');
    this.stats = BLOB_STATS.boss;
    this.hp = this.stats.hp;
    this.maxHp = this.stats.hp;
    this.phase = 1;
    this.mode = 'idle';
    this.modeUntil = 0;
    this.nextMinionAt = 0;
    this.lungeVec = { x: 0, y: 0 };
    this.onSpawnMinion = null;

    this.sprite.setTexture('boss_idle');
    this.sprite.body.setSize(58, 40).setOffset(7, 16);
    this.sprite.play('boss_idle');

    // Both bosses drive their own update(), so the base class's body glow would
    // never be moved off the spawn point. They carry a telegraph aura instead,
    // which does the same job better, so drop the inherited one.
    this.glow?.destroy();
    this.glow = null;

    // The stolen heart rides on top of it until the thing dies.
    this.heart = scene.add.image(x, y - 40, 'heart').setDepth(y + 5);
    scene.tweens.add({
      targets: this.heart,
      y: this.heart.y - 6,
      duration: 700,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });

    // A red glow under it that only comes up during the telegraph. It is the
    // same information the windup animation already carries, said a second way,
    // because that windup is the one thing in the game the player must not miss.
    this.aura = scene.add
      .image(x, y, 'fx_glow')
      .setTint(0xff2a5c)
      .setAlpha(0)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y - 2)
      .setScale(1.5);

    // The heart it stole beats visibly, so it stays the thing you are looking at.
    this.heartGlow = scene.add
      .image(x, y - 40, 'fx_glow')
      .setTint(0xff4d6d)
      .setAlpha(0.55)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y + 4)
      .setScale(0.6);
    scene.tweens.add({
      targets: this.heartGlow,
      scale: 0.95,
      alpha: 0.85,
      duration: 700,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
  }

  update(time, player) {
    if (this.dying) return;
    const body = this.sprite.body;
    this.heart?.setPosition(this.sprite.x, this.sprite.y - 42).setDepth(this.sprite.y + 5);
    this.heartGlow?.setPosition(this.sprite.x, this.sprite.y - 42).setDepth(this.sprite.y + 4);
    this.aura?.setPosition(this.sprite.x, this.sprite.y + 6).setDepth(this.sprite.y - 2);

    if (this.phase === 1 && this.hp <= this.maxHp * 0.5) {
      this.phase = 2;
      this.nextMinionAt = time + 1200;
      this.scene.cameras.main.flash(220, 120, 20, 60);
      this.scene.fx?.ring(this.x, this.y, { tint: 0xff2a5c, to: 2.4, duration: 620, alpha: 1 });
      this.scene.fx?.smoke(this.x, this.y, 12, 0x6e1f42);
      this.scene.fx?.punch(0.014, 320, 0.02);
      audio.duck(0.3, 900);
      audio.play('roar');
    }

    if (this.phase === 2 && time > this.nextMinionAt && this.mode === 'idle') {
      this.nextMinionAt = time + MINION_INTERVAL_MS;
      this.onSpawnMinion?.(this);
    }

    if (time < this.modeUntil) {
      if (this.mode === 'lunge') {
        body.setVelocity(this.lungeVec.x, this.lungeVec.y);
      } else if (this.mode === 'stun') {
        body.setVelocity(0, 0);
      } else if (this.mode === 'windup') {
        body.setVelocity(0, 0);
      } else {
        // Idle drift toward the player so it never fully disengages.
        const a = Math.atan2(player.y - this.y, player.x - this.x);
        body.setVelocity(Math.cos(a) * this.stats.speed * 0.5, Math.sin(a) * this.stats.speed * 0.5);
      }
      this.sprite.setDepth(this.sprite.y);
      return;
    }

    this.advanceMode(time, player);
    this.sprite.setDepth(this.sprite.y);
  }

  advanceMode(time, player) {
    if (this.mode === 'idle') {
      this.mode = 'windup';
      this.modeUntil = time + WINDUP_MS;
      this.sprite.play('boss_windup');
      this.squash = this.scene.tweens.add({
        targets: this.sprite,
        scaleX: 1.12,
        scaleY: 0.88,
        duration: WINDUP_MS,
        ease: 'Quad.in',
      });
      // The aura swells for exactly as long as the windup lasts, so it reads as
      // a fuse burning down rather than as decoration.
      this.scene.tweens.add({
        targets: this.aura,
        alpha: 0.75,
        scale: 2.3,
        duration: WINDUP_MS,
        ease: 'Quad.in',
      });
      audio.play('bossTell');
    } else if (this.mode === 'windup') {
      this.mode = 'lunge';
      this.modeUntil = time + LUNGE_MS;
      this.squash?.remove();
      this.sprite.setScale(1);
      this.sprite.play('boss_idle');
      const a = Math.atan2(player.y - this.y, player.x - this.x);
      const speed = this.phase === 2 ? 400 : 330;
      this.lungeVec = { x: Math.cos(a) * speed, y: Math.sin(a) * speed };
      this.scene.tweens.add({ targets: this.aura, alpha: 0, scale: 1.5, duration: 220 });
      this.scene.fx?.dust(this.x, this.y + 14, 8, 0x6e1f42);
      audio.play('bossLunge');
    } else if (this.mode === 'lunge') {
      this.mode = 'stun';
      this.modeUntil = time + STUN_MS;
      this.scene.cameras.main.shake(180, 0.012);
      this.scene.fx?.ring(this.x, this.y + 10, { tint: 0xff8fb0, to: 1.5, duration: 420 });
      this.scene.fx?.dust(this.x, this.y + 14, 10, 0x8a6a4a);
      audio.play('thud');
    } else {
      this.mode = 'idle';
      this.modeUntil = time + (this.phase === 2 ? IDLE_BETWEEN_MS * 0.7 : IDLE_BETWEEN_MS);
    }
  }

  takeDamage(amount, fromX, fromY, time) {
    if (this.dying) return;
    // Hitting it mid-charge should not stop the charge; that is the whole tell.
    const bonus = this.mode === 'stun' ? 1.5 : 1;
    const dealt = amount * bonus;
    this.hp -= dealt;

    const fx = this.scene.fx;
    const angle = Math.atan2(this.y - fromY, this.x - fromX);
    fx?.hitSpark(this.x - Math.cos(angle) * 18, this.y - Math.sin(angle) * 18, 0xfff2c4, 9);
    fx?.gooBurst(this.x, this.y, this.tint, 7);
    // Landing a hit in the stun window is worth half again as much, so it is
    // called out: a bigger, brighter number than an ordinary one.
    fx?.damageNumber(this.x, this.y - 24, dealt, bonus > 1 ? 0xffd34d : 0xfff2c4, bonus > 1);
    fx?.punch(bonus > 1 ? 0.008 : 0.004, 110, 0.012);
    audio.play('squelch', { pitch: this.pitch });

    if (this.hp <= 0) {
      this.die();
      return;
    }
    this.sprite.setTintFill(0xffffff);
    this.scene.time.delayedCall(70, () => !this.dying && this.sprite.clearTint());
  }

  die() {
    this.dying = true;
    this.sprite.body.setVelocity(0, 0);
    this.sprite.body.enable = false;
    this.sprite.clearTint();
    this.sprite.setScale(1);
    // The carried heart is handed off to the level, which spawns the pickup in
    // this exact spot. Leaving it alive strands a second heart on the floor.
    this.heart?.destroy();
    this.heart = null;
    this.heartGlow?.destroy();
    this.heartGlow = null;
    this.aura?.destroy();
    this.aura = null;
    this.sprite.play('boss_death');
    this.glow?.destroy();
    this.glow = null;
    this.scene.cameras.main.shake(600, 0.02);

    // A staggered chain rather than one burst: a boss coming apart should take
    // long enough that you notice it happening.
    const fx = this.scene.fx;
    fx?.tint([1, 0.5, 0.7], 0.55, 420);
    for (let i = 0; i < 5; i++) {
      this.scene.time.delayedCall(i * 110, () => {
        const ox = Phaser.Math.Between(-26, 26);
        const oy = Phaser.Math.Between(-20, 14);
        fx?.burst(this.x + ox, this.y + oy, { tint: 0xff8fb0, scale: 1.3, duration: 300 });
        fx?.gooBurst(this.x + ox, this.y + oy, this.tint, 10);
        fx?.ring(this.x + ox, this.y + oy, { tint: 0xff4d6d, to: 1, duration: 420 });
      });
    }
    audio.duck(0.25, 1400);
    audio.play('roar');
    this.scene.time.delayedCall(260, () => audio.play('nuke'));

    this.scene.game.events.emit(EV_BLOB_DIED, this);
    this.sprite.once('animationcomplete', () => this.sprite.destroy());
  }

  destroy() {
    this.heart?.destroy();
    this.heartGlow?.destroy();
    this.aura?.destroy();
    this.sprite.destroy();
  }
}

/* ---- js/entities/GhostCompanion.js ---- */

// Easy mode only. The boy's ghost trails the girl and takes swings at whatever
// is closest. It is deliberately a slow, occasional hitter: it should make a
// crowded room survivable, not clear the room for you.
//
// Names are GHOST_-prefixed because the single-file build drops every module
// into one shared scope — a bare ATTACK_COOLDOWN_MS collides with Constants.js.
const GHOST_FOLLOW_LAG = 0.055; // how quickly it closes on its resting spot
const GHOST_CHASE_LAG = 0.085; // faster once it has picked a target
const GHOST_REST_OFFSET = 34; // how far behind the girl it idles
const GHOST_SEEK_RANGE = 165; // how far it will look for something to hit
const GHOST_LEASH = 210; // never strays further than this from the girl
const GHOST_STANDOFF = 22; // hovers beside its target rather than inside it
const GHOST_ATTACK_RANGE = 34;
const GHOST_ATTACK_COOLDOWN_MS = 1300;
const GHOST_DAMAGE = 7;
const GHOST_BOB_PX = 4;

// Intangible on purpose — no physics body, no collisions, no health. It drifts
// through hedges and blobs ignore it entirely.
// `opts` exists so the Jory run's allied blobs can reuse this whole
// follow-and-strike behaviour with a different skin and a lifetime.
class GhostCompanion {
  constructor(scene, x, y, opts = {}) {
    const {
      texture = 'ghost_float',
      anim = 'ghost_float',
      tint = 0x9fd8ff,
      alpha = 0.62,
      damage = GHOST_DAMAGE,
      cooldown = GHOST_ATTACK_COOLDOWN_MS,
      range = GHOST_ATTACK_RANGE,
      restVec = { x: -GHOST_REST_OFFSET * 0.7, y: -GHOST_REST_OFFSET },
      lifetimeMs = 0,
    } = opts;

    this.scene = scene;
    this.nextAttackAt = 0;
    this.target = null;
    this.damage = damage;
    this.cooldown = cooldown;
    this.range = range;
    this.restVec = restVec;
    this.expiresAt = lifetimeMs ? scene.time.now + lifetimeMs : 0;

    // The drift is tracked here rather than on the sprite: the idle bob is
    // applied at draw time, and a tween owning sprite.y would overwrite every
    // move this class makes.
    this.px = x + restVec.x;
    this.py = y + restVec.y;

    this.sprite = scene.add.sprite(this.px, this.py, texture);
    this.sprite.setAlpha(alpha).setDepth(this.py);
    if (tint !== null) this.sprite.setTint(tint);
    if (anim && scene.anims.exists(anim)) this.sprite.play(anim);

    this.slash = scene.add.image(x, y, 'slash').setTint(tint ?? 0xffffff).setVisible(false);
    this.slash.setScale(0.8);
  }

  get expired() {
    return this.expiresAt > 0 && this.scene.time.now >= this.expiresAt;
  }

  get x() {
    return this.px;
  }

  get y() {
    return this.py;
  }

  update(time, player, blobs) {
    this.target = this.pickTarget(player, blobs);
    const goal = this.goalFor(player);
    const lag = this.target ? GHOST_CHASE_LAG : GHOST_FOLLOW_LAG;

    this.px += (goal.x - this.px) * lag;
    this.py += (goal.y - this.py) * lag;

    // Snap back if it somehow gets dragged past the leash.
    const stray = Phaser.Math.Distance.Between(this.px, this.py, player.x, player.y);
    if (stray > GHOST_LEASH) {
      const a = Math.atan2(this.py - player.y, this.px - player.x);
      this.px = player.x + Math.cos(a) * GHOST_LEASH;
      this.py = player.y + Math.sin(a) * GHOST_LEASH;
    }

    const face = this.target ? this.target.x : player.x;
    this.sprite.setFlipX(face < this.px);
    this.sprite.setPosition(this.px, this.py + Math.sin(time / 420) * GHOST_BOB_PX);
    this.sprite.setDepth(this.py);

    if (
      this.target &&
      time >= this.nextAttackAt &&
      Phaser.Math.Distance.Between(this.px, this.py, this.target.x, this.target.y) < this.range
    ) {
      this.attack(time);
    }
  }

  goalFor(player) {
    if (!this.target) {
      return { x: player.x + this.restVec.x, y: player.y + this.restVec.y };
    }
    // Hold station just off the blob so the two sprites do not sit on top of
    // each other while it works.
    const a = Math.atan2(this.py - this.target.y, this.px - this.target.x);
    return {
      x: this.target.x + Math.cos(a) * GHOST_STANDOFF,
      y: this.target.y + Math.sin(a) * GHOST_STANDOFF - 8,
    };
  }

  // Nearest living blob inside its own search radius, ignoring anything the
  // girl has already run far away from.
  pickTarget(player, blobs) {
    let best = null;
    let bestDist = GHOST_SEEK_RANGE;
    blobs.forEach((blob) => {
      if (blob.dying) return;
      if (Phaser.Math.Distance.Between(blob.x, blob.y, player.x, player.y) > GHOST_LEASH) return;
      const d = Phaser.Math.Distance.Between(blob.x, blob.y, this.px, this.py);
      if (d < bestDist) {
        bestDist = d;
        best = blob;
      }
    });
    return best;
  }

  attack(time) {
    this.nextAttackAt = time + this.cooldown;
    const blob = this.target;
    // Quieter and higher than her sword, so a companion landing a hit is never
    // mistaken for one of the player's own.
    audio.play('swing', { pitch: 1.6 });
    this.scene.fx?.hitSpark(blob.x, blob.y, this.hitTint ?? 0x9fd8ff, 4);

    this.slash
      .setVisible(true)
      .setPosition(blob.x, blob.y)
      .setAlpha(0.85)
      .setScale(0.8)
      .setDepth(blob.y + 2);
    this.scene.tweens.add({
      targets: this.slash,
      alpha: 0,
      scale: 1.2,
      duration: 220,
      onComplete: () => this.slash.setVisible(false),
    });

    blob.takeDamage(this.damage, this.px, this.py, time);
  }

  destroy() {
    this.sprite.destroy();
    this.slash.destroy();
  }
}

/* ---- js/entities/AlliedBlob.js ---- */

// The ally power-up's blobs. Same follow-and-strike behaviour as the ghost, so
// they are the ghost with a blob's skin, a spread-out resting spot and a clock
// on them.
//
// They used to be the green tier under a pale tint, which in a room full of
// green tier blobs was not a distinction anyone could make mid-fight. They now
// have their own blue art (BLOB_TINTS.ally) and carry no tint at all, so the
// rule is simply: blue is yours.
//
// 12 every 850ms each, so the four of them run at roughly 56 damage a second
// against the 25 three of them used to manage. That is a real presence in a
// crowd and still under the sword's 12 every 330ms — they help her win the
// room, they do not win it for her. Worth knowing when tuning: they will also
// pick the final boss as a target, and its 360hp is about seven seconds of a
// full set staying in contact with it.
const ALLY_DAMAGE = 12;
const ALLY_COOLDOWN_MS = 850;
// A shade longer than the ghost's 34: at 34 they spent the fight drifting into
// range and back out of it without ever landing the swing they were lined up for.
const ALLY_RANGE = 42;
const ALLY_RADIUS = 40;

class AlliedBlob extends GhostCompanion {
  constructor(scene, x, y, index = 0, total = 1) {
    // Fan them out around her so a full set does not stack into one blob. At
    // 60 degrees apart four of them span a half circle, which puts one off each
    // shoulder and one to either side rather than all four crowding the front.
    const angle = -Math.PI / 2 + ((index - (total - 1) / 2) * Math.PI) / 3;
    super(scene, x, y, {
      texture: 'blob_ally_idle',
      anim: 'blob_ally_idle',
      tint: null,
      alpha: 0.94,
      damage: ALLY_DAMAGE,
      cooldown: ALLY_COOLDOWN_MS,
      range: ALLY_RANGE,
      lifetimeMs: ALLY_MS,
      restVec: { x: Math.cos(angle) * ALLY_RADIUS, y: Math.sin(angle) * ALLY_RADIUS },
    });

    // The slash follows the tint, and a null tint leaves it white. Point it at
    // the ally blue so their hits read as theirs and not as one of hers.
    this.slash.setTint(0x9adcff);
    this.hitTint = 0x9adcff;

    // Blink out over the last two seconds so their leaving is not a surprise.
    scene.time.delayedCall(Math.max(0, ALLY_MS - 2000), () => {
      if (this.sprite.active) {
        scene.tweens.add({
          targets: this.sprite,
          alpha: 0.25,
          duration: 260,
          yoyo: true,
          repeat: -1,
        });
      }
    });
  }
}

/* ---- js/entities/FinalBoss.js ---- */

// The thing waiting at the end of wave five. It keeps the level 3 boss's
// readable rhythm — tell, commit, recover — but cycles three different
// commitments instead of one, and the gaps close as its health drops.
const FB_WINDUP_MS = 700;
const FB_LUNGE_MS = 460;
const FB_STUN_MS = 780;
const FB_IDLE_MS = 1150;
const FB_SLAM_WINDUP_MS = 780;
const FB_SLAM_RADIUS = 132;
const FB_SUMMON_COUNT = 4;

class FinalBoss extends Blob {
  constructor(scene, x, y) {
    super(scene, x, y, 'final', FINAL_BOSS_STATS, 'final');
    this.maxHp = FINAL_BOSS_STATS.hp;
    this.hp = this.maxHp;
    this.phase = 1;
    this.mode = 'idle';
    this.modeUntil = 0;
    this.lungeVec = { x: 0, y: 0 };
    this.attackIndex = 0;
    this.onSpawnMinion = null;
    this.onSlam = null;

    this.sprite.setTexture('final_idle');
    this.sprite.body.setSize(FINAL_BOSS_STATS.hitW, FINAL_BOSS_STATS.hitH).setOffset(7, 22);
    this.sprite.play('final_idle');

    // Both bosses drive their own update(), so the base class's body glow would
    // never be moved off the spawn point. They carry a telegraph aura instead,
    // which does the same job better, so drop the inherited one.
    this.glow?.destroy();
    this.glow = null;

    // The sprite is a near-black silhouette by design, so it needs its own light
    // to exist at all in a lit room — and that light is also the telegraph.
    this.aura = scene.add
      .image(x, y, 'fx_glow')
      .setTint(0x9c2050)
      .setAlpha(0.3)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y - 2)
      .setScale(1.7);
    // Two lit eyes, so the silhouette is looking at you.
    this.eyes = scene.add
      .image(x, y - 14, 'fx_glow')
      .setTint(0xff2a5c)
      .setAlpha(0.65)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y + 2)
      .setScale(0.45);
    scene.tweens.add({
      targets: this.eyes,
      alpha: 0.95,
      scale: 0.55,
      duration: 620,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
  }

  // Speeds up as it loses health rather than changing what it does, so the
  // fight gets harder without becoming unreadable.
  get pace() {
    return this.phase === 3 ? 0.62 : this.phase === 2 ? 0.8 : 1;
  }

  update(time, player) {
    if (this.dying) return;
    const body = this.sprite.body;

    this.aura?.setPosition(this.sprite.x, this.sprite.y + 4).setDepth(this.sprite.y - 2);
    this.eyes?.setPosition(this.sprite.x, this.sprite.y - 14).setDepth(this.sprite.y + 2);

    const ratio = this.hp / this.maxHp;
    const wanted = ratio <= 0.33 ? 3 : ratio <= 0.66 ? 2 : 1;
    if (wanted > this.phase) {
      this.phase = wanted;
      this.scene.cameras.main.flash(240, 150, 20, 80);
      this.scene.cameras.main.shake(260, 0.008);
      this.scene.fx?.ring(this.x, this.y, { tint: 0xff2a5c, to: 3, duration: 700, alpha: 1 });
      this.scene.fx?.smoke(this.x, this.y, 14, 0x33061a);
      // It burns hotter with every phase, so the light it throws grows too.
      this.aura?.setAlpha(0.3 + this.phase * 0.12);
      audio.duck(0.3, 900);
      audio.play('phase');
    }

    if (time < this.modeUntil) {
      if (this.mode === 'lunge') body.setVelocity(this.lungeVec.x, this.lungeVec.y);
      else if (this.mode === 'idle') {
        const a = Math.atan2(player.y - this.y, player.x - this.x);
        body.setVelocity(Math.cos(a) * this.stats.speed * 0.6, Math.sin(a) * this.stats.speed * 0.6);
      } else {
        body.setVelocity(0, 0);
      }
      this.sprite.setDepth(this.sprite.y);
      return;
    }

    this.advanceMode(time, player);
    this.sprite.setDepth(this.sprite.y);
  }

  advanceMode(time, player) {
    switch (this.mode) {
      case 'idle':
        this.beginAttack(time);
        break;

      case 'windup': {
        this.mode = 'lunge';
        this.modeUntil = time + FB_LUNGE_MS * this.pace;
        this.squash?.remove();
        this.sprite.setScale(1);
        this.sprite.play('final_idle');
        const a = Math.atan2(player.y - this.y, player.x - this.x);
        const speed = 330 + (this.phase - 1) * 70;
        this.lungeVec = { x: Math.cos(a) * speed, y: Math.sin(a) * speed };
        this.scene.fx?.dust(this.x, this.y + 16, 9, 0x33061a);
        audio.play('bossLunge');
        break;
      }

      case 'slamwind':
        this.mode = 'stun';
        this.modeUntil = time + FB_STUN_MS * this.pace;
        this.squash?.remove();
        this.sprite.setScale(1);
        this.sprite.play('final_idle');
        this.onSlam?.(this, FB_SLAM_RADIUS);
        audio.play('slam');
        break;

      case 'summon':
        this.mode = 'stun';
        this.modeUntil = time + FB_STUN_MS * this.pace;
        this.sprite.play('final_idle');
        this.onSpawnMinion?.(this, FB_SUMMON_COUNT + (this.phase - 1));
        audio.play('summon');
        break;

      case 'lunge':
        this.mode = 'stun';
        this.modeUntil = time + FB_STUN_MS * this.pace;
        this.scene.cameras.main.shake(200, 0.013);
        this.scene.fx?.ring(this.x, this.y + 10, { tint: 0xff2a5c, to: 1.6, duration: 440 });
        this.scene.fx?.dust(this.x, this.y + 16, 10, 0x8a6a4a);
        audio.play('thud');
        break;

      default:
        this.mode = 'idle';
        this.modeUntil = time + FB_IDLE_MS * this.pace;
    }
  }

  // Charge, ring slam, charge, summon — a fixed rotation, so the fight can be
  // learned. Summoning only starts once it is properly hurt.
  beginAttack(time) {
    const rotation = this.phase === 1 ? ['charge', 'slam'] : ['charge', 'slam', 'charge', 'summon'];
    const pick = rotation[this.attackIndex % rotation.length];
    this.attackIndex += 1;

    // Each of the three has its own colour, so which one is coming is readable
    // from the glow alone before the animation has finished playing.
    const telegraph = {
      slam: 0xff9a2a,
      summon: 0x9a5cff,
      charge: 0xff2a5c,
    }[pick];
    this.aura?.setTint(telegraph);
    this.scene.tweens.add({
      targets: this.aura,
      alpha: 0.85,
      scale: 2.6,
      duration: FB_SLAM_WINDUP_MS * this.pace,
      ease: 'Quad.in',
      yoyo: true,
    });
    audio.play('bossTell');

    if (pick === 'slam') {
      this.mode = 'slamwind';
      this.modeUntil = time + FB_SLAM_WINDUP_MS * this.pace;
      this.sprite.play('final_slam');
      this.squash = this.scene.tweens.add({
        targets: this.sprite,
        scaleX: 0.84,
        scaleY: 1.2,
        duration: FB_SLAM_WINDUP_MS * this.pace,
        ease: 'Quad.in',
      });
      return;
    }

    if (pick === 'summon') {
      this.mode = 'summon';
      this.modeUntil = time + FB_SLAM_WINDUP_MS * this.pace;
      this.sprite.play('final_windup');
      return;
    }

    this.mode = 'windup';
    this.modeUntil = time + FB_WINDUP_MS * this.pace;
    this.sprite.play('final_windup');
    this.squash = this.scene.tweens.add({
      targets: this.sprite,
      scaleX: 1.14,
      scaleY: 0.86,
      duration: FB_WINDUP_MS * this.pace,
      ease: 'Quad.in',
    });
  }

  takeDamage(amount, fromX, fromY, time) {
    if (this.dying) return;
    // Same deal as the level 3 boss: the recovery window is where the damage
    // is, and hitting it mid-charge does not interrupt the charge.
    const bonus = this.mode === 'stun' ? 1.5 : 1;
    const dealt = amount * bonus;
    this.hp -= dealt;

    const fx = this.scene.fx;
    const angle = Math.atan2(this.y - fromY, this.x - fromX);
    fx?.hitSpark(this.x - Math.cos(angle) * 20, this.y - Math.sin(angle) * 20, 0xffd34d, 10);
    fx?.gooBurst(this.x, this.y, 0x9c2050, 8);
    fx?.damageNumber(this.x, this.y - 28, dealt, bonus > 1 ? 0xffd34d : 0xfff2c4, bonus > 1);
    fx?.punch(bonus > 1 ? 0.009 : 0.004, 110, 0.012);
    audio.play('squelch', { pitch: this.pitch });

    if (this.hp <= 0) {
      this.die();
      return;
    }
    this.sprite.setTintFill(0xffffff);
    this.scene.time.delayedCall(70, () => !this.dying && this.sprite.clearTint());
  }

  die() {
    this.dying = true;
    this.sprite.body.setVelocity(0, 0);
    this.sprite.body.enable = false;
    this.sprite.clearTint();
    this.sprite.setScale(1);
    this.squash?.remove();
    this.sprite.play('final_death');
    this.glow?.destroy();
    this.glow = null;
    this.scene.cameras.main.shake(900, 0.022);

    // The light it was made of goes out first, then it comes apart. Eight
    // staggered bursts over a second, because this is the last enemy in the
    // game and it should take its time.
    const fx = this.scene.fx;
    this.scene.tweens.add({ targets: [this.aura, this.eyes], alpha: 0, scale: 0.2, duration: 500 });
    fx?.tint([1, 0.35, 0.55], 0.6, 700);
    for (let i = 0; i < 8; i++) {
      this.scene.time.delayedCall(i * 120, () => {
        const ox = Phaser.Math.Between(-34, 34);
        const oy = Phaser.Math.Between(-26, 18);
        fx?.burst(this.x + ox, this.y + oy, { tint: 0xff6a9a, scale: 1.5, duration: 320 });
        fx?.gooBurst(this.x + ox, this.y + oy, 0x9c2050, 12);
        fx?.ring(this.x + ox, this.y + oy, { tint: 0xff2a5c, to: 1.2, duration: 460 });
        fx?.star(this.x + ox, this.y + oy, { tint: 0xffd34d, scale: 0.7 });
      });
    }
    audio.duck(0.2, 1800);
    audio.play('roar');
    this.scene.time.delayedCall(300, () => audio.play('nuke'));

    this.scene.game.events.emit(EV_BLOB_DIED, this);
    this.sprite.once('animationcomplete', () => this.sprite.destroy());
  }

  destroy() {
    this.aura?.destroy();
    this.eyes?.destroy();
    this.sprite.destroy();
  }
}

/* ---- js/entities/PowerUp.js ---- */

// A bubble on the floor. It knows how to appear, hover, warn that it is about
// to go, and vanish; what it actually does is the level's business.
const WARN_AT_MS = 2000;
const PICKUP_RANGE = 30;

class PowerUp {
  constructor(scene, x, y, def) {
    this.scene = scene;
    this.def = def;
    this.taken = false;
    this.expiresAt = scene.time.now + POWERUP_LIFETIME_MS;

    this.sprite = scene.add.image(x, y, def.texture).setDepth(y).setScale(0);
    scene.tweens.add({ targets: this.sprite, scale: 1, duration: 280, ease: 'Back.out' });
    this.hover = scene.tweens.add({
      targets: this.sprite,
      y: y - 7,
      duration: 780,
      yoyo: true,
      repeat: -1,
      delay: 280,
      ease: 'Sine.inOut',
    });

    // A soft glow underneath so a bubble is findable against busy floor.
    this.glow = scene.add.image(x, y, def.texture).setDepth(y - 1).setAlpha(0.28).setScale(1.5);
    scene.tweens.add({
      targets: this.glow,
      scale: 2,
      alpha: 0,
      duration: 1100,
      repeat: -1,
    });

    // In a room this dark the bubble also has to be its own light source, or it
    // is invisible from more than a couple of tiles away.
    this.halo = scene.add
      .image(x, y, 'fx_glow')
      .setTint(0xffffff)
      .setAlpha(0.4)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y - 2)
      .setScale(0.85);
    scene.tweens.add({
      targets: this.halo,
      scale: 1.25,
      alpha: 0.65,
      duration: 820,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
    this.light = scene.fx?.addLight(this.sprite, { size: 200 });
    scene.fx?.ring(x, y, { tint: 0xffffff, to: 0.9, duration: 460 });
    scene.fx?.sparkleTrail(x, y, 0xffffff, 8);
    this.sparkleTimer = scene.time.addEvent({
      delay: 520,
      loop: true,
      callback: () => {
        if (!this.taken) scene.fx?.sparkleTrail(this.sprite.x, this.sprite.y, 0xffffff, 1);
      },
    });
  }

  get x() {
    return this.sprite.x;
  }

  get y() {
    return this.sprite.y;
  }

  update(time, player) {
    if (this.taken) return false;

    this.halo?.setPosition(this.sprite.x, this.sprite.y);

    // Flicker through the last couple of seconds.
    if (this.expiresAt - time < WARN_AT_MS) {
      this.sprite.setAlpha(Math.floor(time / 110) % 2 ? 0.35 : 1);
      this.halo?.setAlpha(this.sprite.alpha * 0.5);
    }

    if (Phaser.Math.Distance.Between(player.x, player.y, this.x, this.y) < PICKUP_RANGE) {
      this.taken = true;
      return true;
    }
    return false;
  }

  get lapsed() {
    return !this.taken && this.scene.time.now >= this.expiresAt;
  }

  collect() {
    this.hover?.remove();
    this.sparkleTimer?.remove();
    this.scene.tweens.add({
      targets: this.sprite,
      y: this.sprite.y - 26,
      alpha: 0,
      scale: 1.6,
      duration: 300,
      onComplete: () => this.destroy(),
    });
    this.scene.tweens.add({ targets: this.halo, alpha: 0, scale: 2.2, duration: 300 });
    this.glow.destroy();
  }

  destroy() {
    this.hover?.remove();
    this.sparkleTimer?.remove();
    // The lighting pass walks this list every frame, so a collected bubble that
    // left its light behind would keep a hole burning in an empty patch of floor.
    if (this.light && this.scene.fx) {
      const list = this.scene.fx.lights;
      const at = list.indexOf(this.light);
      if (at >= 0) list.splice(at, 1);
    }
    this.sprite.destroy();
    this.glow?.destroy();
    this.halo?.destroy();
  }
}

/* ---- js/scenes/BootScene.js ---- */

const BLOB_PX = { easy: 2, medium: 2, hard: 3, boss: 3, final: 3, ally: 2 };

class BootScene extends Phaser.Scene {
  constructor() {
    super('Boot');
  }

  create() {
    // Before anything reads it: the title screen decides whether to offer the
    // inventory off the back of this.
    GameState.loadUnlocks();

    this.buildCharacters();
    this.buildBlobs();
    this.buildProps();
    this.buildTiles();
    this.buildUI();
    // Glows, sparks, light masks and shadows. Canvas gradients rather than
    // pixel grids, so they live apart from the rest of the art.
    buildFxTextures(this);

    document.getElementById('boot-msg')?.remove();
    this.scene.start('Menu');
  }

  buildCharacters() {
    // Her sprites come from the chosen look; the customiser rebuilds them with
    // the same call whenever a selection changes.
    buildGirlTextures(this, GameState.look);

    makeSheet(this, 'boy_idle_down', BOY.down.idle);
    makeSheet(this, 'boy_walk_down', BOY.down.walk);
    makeAnim(this, 'boy_idle_down', 'boy_idle_down', BOY.down.idle.length, { frameRate: 2 });
    makeAnim(this, 'boy_walk_down', 'boy_walk_down', BOY.down.walk.length, { frameRate: 10 });
    makeTexture(this, 'boy_sit', BOY.sit);
    // Rotated flat in-engine when he collapses, rather than as a second texture.
    makeTexture(this, 'boy_limp', BOY.limp);
    makeTexture(this, 'boy_cheer', BOY.cheer);

    makeSheet(this, 'ghost_float', GHOST.float);
    makeAnim(this, 'ghost_float', 'ghost_float', GHOST.float.length, { frameRate: 3 });
  }

  buildBlobs() {
    Object.entries(BLOB_TINTS).forEach(([tier, overrides]) => {
      const pixelSize = BLOB_PX[tier];
      const opts = { overrides, pixelSize };
      if (tier === 'final') {
        makeSheet(this, 'final_idle', FINAL_IDLE, opts);
        makeSheet(this, 'final_windup', FINAL_WINDUP, opts);
        makeSheet(this, 'final_slam', FINAL_SLAM, opts);
        makeSheet(this, 'final_hit', FINAL_HIT, opts);
        makeSheet(this, 'final_death', FINAL_DEATH, opts);

        makeAnim(this, 'final_windup', 'final_windup', FINAL_WINDUP.length, { frameRate: 4 });
        makeAnim(this, 'final_slam', 'final_slam', FINAL_SLAM.length, { frameRate: 4 });
        makeAnim(this, 'final_hit', 'final_hit', FINAL_HIT.length, { frameRate: 8, repeat: 0 });
        makeAnim(this, 'final_death', 'final_death', FINAL_DEATH.length, {

      if (tier === 'boss') {
        makeSheet(this, 'boss_idle', BOSS_IDLE, opts);
        makeSheet(this, 'boss_windup', BOSS_WINDUP, opts);
        makeSheet(this, 'boss_hit', BOSS_HIT, opts);
        makeSheet(this, 'boss_death', BOSS_DEATH, opts);

      makeSheet(this, `blob_${tier}_hit`, BLOB_HIT, opts);
      makeSheet(this, `blob_${tier}_death`, BLOB_DEATH, opts);
      makeAnim(this, `blob_${tier}_idle`, `blob_${tier}_idle`, BLOB_IDLE.length, { frameRate: 3 });

      makeAnim(this, `blob_${tier}_hit`, `blob_${tier}_hit`, BLOB_HIT.length, { frameRate: 10, repeat: 0 });
      makeAnim(this, `blob_${tier}_death`, `blob_${tier}_death`, BLOB_DEATH.length, {

  buildProps() {

    // One shell, four colours of glass — the same override trick the blob tiers

    // The backdrop brings the weather and the grade with it.
    meadowBackdrop(this, 0.66);
    const cx = GAME_W / 2;

    // The title sits in its own pool of light, so the two words read as one

    this.tweens.add({ targets: titleGlow, alpha: 0.34, duration: 900, delay: 300 });
    this.tweens.add({
      targets: titleGlow,

      alpha: 0.5,
      duration: 2200,
      yoyo: true,
      repeat: -1,
      delay: 1200,
      ease: 'Sine.inOut',

    const line1 = new PixelText(this, cx, 200, 'HEART', { scale: 5, color: 0xff4d6d });
    const line2 = new PixelText(this, cx, 275, 'BOUND', { scale: 5, color: 0xff4d6d });
    [line1, line2].forEach((t, i) => {

    this.tweens.add({
      targets: heart,
      scale: 2.3,
      duration: 700,

      repeat: -1,
      ease: 'Sine.inOut',
    });

    // The heart beats and its light beats with it, half a step behind, which is

    const heartGlow = this.add
      .image(cx, 380, 'fx_glow')
      .setTint(0xff4d6d)
      .setAlpha(0.5)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(595)
      .setScale(1.1);

      targets: heartGlow,

      ease: 'Sine.inOut',

    const tag = new PixelText(this, cx, 455, 'GET HIS HEART BACK', { scale: 2, color: 0xffe08a });

    new MenuButton(this, cx, 578, 'PLAY', {
      scale: 4,
      minWidth: 240,
      onPick: () => this.start(),
    });

    // The meadow with nothing asked of you. Green so it reads as somewhere to
    // go rather than another thing to do.
    new MenuButton(this, cx, 664, 'GARDEN', {
      scale: 2,
      minWidth: 240,
      color: 0x7ed957,
      onPick: () => this.openGarden(),

    // Always here, from the very first launch. The book and the ring are the

    if (this.leaving) return;

    this.cameras.main.once('camerafadeoutcomplete', () =>
      this.scene.start('Book', { from: 'menu' }),
    );
  }
}

// One column for labels, one for controls, and a band behind each row — the
// first pass left labels floating over the row above and everything ran together.
const CZ_ROW_LABEL_X = 22;
const CZ_ROW_TOP = 292;
const CZ_ROW_STEP = 72;
// Controls sit right of the longest label ("OUTFIT COLOUR", which ends at
// x=176) — at the old centre its first swatch sat on top of the text.
const CZ_CONTROL_CX = 312;
// Sized so the longest row (nine outfit colours) still clears the labels.
const CZ_SWATCH = 24;
const CZ_SWATCH_GAP = 4;

function toInt(hex) {
  return parseInt(hex.replace('#', ''), 16);
}

// Pick-a-colour square. Selected reads as pressed-in with a gold rim.
class Swatch {
  constructor(scene, x, y, color, onPick) {
    this.scene = scene;
    this.cx = x;
    this.cy = y;
    this.color = color;
    this.selected = false;
    this.gfx = scene.add.graphics().setDepth(500);
    this.ring = scene.add.graphics().setDepth(499);
    scene.add
      .zone(x, y, CZ_SWATCH + 2, CZ_SWATCH + 2)
      .setDepth(500)
      .setInteractive({ useHandCursor: true })
      .on('pointerover', () => audio.play('uiHover'))
      .on('pointerup', () => {
        audio.play('uiClick');
        onPick();
      });
    this.redraw();
  }

  setSelected(on) {
    this.selected = on;
    this.redraw();
  }

  redraw() {
    this.ring.clear();
    if (this.selected) {
      this.ring.fillStyle(0xffe08a, 1);
      this.ring.fillRect(this.cx - CZ_SWATCH / 2 - 3, this.cy - CZ_SWATCH / 2 - 3, CZ_SWATCH + 6, CZ_SWATCH + 6);
    }
    drawChunkyPanel(this.gfx, this.cx, this.cy, CZ_SWATCH, CZ_SWATCH, this.color, {
      pressed: this.selected,
      edge: 3,
      notch: 3,
      bevel: 3,
    });
  }
}

// Her look, picked before the run. Always a girl — this is a gift for one.
class CustomizeScene extends Phaser.Scene {
  constructor() {
    super('Customize');
  }

  create() {
    this.leaving = false;
    meadowBackdrop(this, 0.78);
    const cx = GAME_W / 2;

    const title = new PixelText(this, cx, 40, 'MAKE HER YOURS!', { scale: 3, color: 0xff8fc0 });
    title.setDepth(600);

    this.buildPreview(cx);

    this.rows = [];
    let y = CZ_ROW_TOP;
    const next = () => {
      const at = y;
      y += CZ_ROW_STEP;
      return at;
    };
    this.presetRow(next(), 'HAIR', HAIR_STYLES, 'hair');
    this.swatchRow(next(), 'HAIR COLOUR', HAIR_COLORS, 'hairColor', (c) => toInt(c.h));
    this.swatchRow(next(), 'SKIN', SKIN_TONES, 'skin', (c) => toInt(c.s));
    this.swatchRow(next(), 'EYES', EYE_COLORS, 'eyes', (c) => toInt(c.e));
    this.presetRow(next(), 'OUTFIT', OUTFITS, 'outfit');
    this.swatchRow(next(), 'OUTFIT COLOUR', OUTFIT_COLORS, 'outfitColor', (c) => toInt(c.d));

    new MenuButton(this, cx - 96, 754, 'BACK', {
      scale: 2,
      padX: 18,
      minWidth: 160,
      onPick: () => this.scene.start('Menu'),
    });
    new MenuButton(this, cx + 96, 754, 'CONFIRM', {
      scale: 2,
      padX: 18,
      color: 0x7ed957,
      minWidth: 160,
      onPick: () => this.confirm(),
    });

    this.refresh();
    this.cameras.main.fadeIn(320, 0, 0, 0);
  }

  // She stands on a lit disc and walks on the spot, so every change is visible
  // on the sprite that actually goes into the game.
  buildPreview(cx) {
    const panel = this.add.graphics().setDepth(400);
    drawChunkyPanel(panel, cx, 158, 196, 158, 0x1b1622, {});
    this.add.ellipse(cx, 214, 96, 22, 0x8f6bb0, 0.45).setDepth(401);

    // Scale 4 rather than 5: at 5 a 32px sprite nearly filled the panel edge
    // to edge with no air around her.
    this.preview = this.add.sprite(cx, 152, 'girl_walk_down').setDepth(402).setScale(4);
    this.preview.play('girl_walk_down');

    this.tweens.add({
      targets: this.preview,
      y: 148,
      duration: 900,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
  }

  // Shared row furniture: a banded background and a left-hand label, so every
  // row lines up on the same two columns.
  rowChrome(y, label) {
    const text = new PixelText(this, CZ_ROW_LABEL_X, y, label, {
      scale: 1,
      color: 0xffe08a,
      align: 'left',
    });
    text.setDepth(600);
  }

  // A named preset with arrows either side.
  presetRow(y, label, list, key) {
    this.rowChrome(y, label);

    const value = new PixelText(this, CZ_CONTROL_CX, y, '', { scale: 2, color: 0xffffff });
    value.setDepth(600);

    const step = (dir) => {
      const look = GameState.look;
      look[key] = (look[key] + dir + list.length) % list.length;
      this.refresh();
    };
    const arrow = { scale: 2, padX: 10, padY: 6 };
    new MenuButton(this, CZ_CONTROL_CX - 128, y, '<', { ...arrow, onPick: () => step(-1) });
    new MenuButton(this, CZ_CONTROL_CX + 128, y, '>', { ...arrow, onPick: () => step(1) });

    this.rows.push({ kind: 'preset', key, list, value });
  }

  // A run of colour squares, centred on the same column as the presets.
  swatchRow(y, label, list, key, colorOf) {
    this.rowChrome(y, label);

    const span = list.length * CZ_SWATCH + (list.length - 1) * CZ_SWATCH_GAP;
    const startX = CZ_CONTROL_CX - span / 2 + CZ_SWATCH / 2;

    const swatches = list.map((entry, i) =>
      new Swatch(this, startX + i * (CZ_SWATCH + CZ_SWATCH_GAP), y, colorOf(entry), () => {
        GameState.look[key] = i;
        this.refresh();
      }),
    );

    this.rows.push({ kind: 'swatch', key, swatches });
  }

  // Rebuild her textures, then re-point the preview at them: replacing a
  // texture leaves any sprite already using it holding a stale frame.
  refresh() {
    buildGirlTextures(this, GameState.look);

    this.preview.anims.stop();
    this.preview.setTexture('girl_walk_down', 0);
    this.preview.play('girl_walk_down');

    this.rows.forEach((row) => {
      const chosen = GameState.look[row.key];
      if (row.kind === 'preset') row.value.setText(row.list[chosen].name);
      else row.swatches.forEach((s, i) => s.setSelected(i === chosen));
    });
  }

  confirm() {
    if (this.leaving) return;
    this.leaving = true;
    audio.play('uiConfirm');
    this.cameras.main.fadeOut(280, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Name'));
  }
}

const MAX_NAME = 8;
// Laid out like the keyboard she already knows rather than A to Z: nobody hunts
// for a letter alphabetically, they reach for where it lives on a phone. Rows
// are centred rather than staggered, which is what on-screen keyboards do.
const ROWS = ['1234567890', 'QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
const KEY_STEP = 44;
const ROW_Y = 384;
const ROW_STEP = 52;

// An on-screen keypad rather than a DOM input: the game is a fullscreen canvas
// with its own font, and a browser text box floating over it looks pasted on.
// The physical keyboard still works for desktop players.
class NameScene extends Phaser.Scene {
  constructor() {
    super('Name');
  }

  create() {
    this.leaving = false;
    meadowBackdrop(this, 0.72);
    const cx = GAME_W / 2;
    this.name = GameState.playerName ?? '';

    const title = new PixelText(this, cx, 130, 'WHAT IS YOUR NAME', { scale: 2, color: 0xffe08a });
    title.setDepth(600);

    this.nameText = new PixelText(this, cx, 225, this.name, { scale: 4, color: 0xffffff });
    this.nameText.setDepth(600);

    this.placeholder = new PixelText(this, cx, 225, 'ENTER A NAME', { scale: 2, color: 0x6a6480 });
    this.placeholder.setDepth(600);

    this.caret = this.add.rectangle(cx, 250, 22, 4, 0xff4d6d).setDepth(601);
    this.tweens.add({ targets: this.caret, alpha: 0.15, duration: 480, yoyo: true, repeat: -1 });

    this.buildKeypad();

    this.okButton = new MenuButton(this, 388, 636, 'OK', {
      scale: 2,
      padX: 18,
      onPick: () => this.confirm(),
    });
    new MenuButton(this, 268, 636, 'DEL', { scale: 2, padX: 18, onPick: () => this.backspace() });
    new MenuButton(this, 116, 636, 'SPACE', { scale: 2, padX: 18, onPick: () => this.push(' ') });

    new MenuButton(this, cx, 726, 'BACK', {
      scale: 2,
      padX: 18,
      onPick: () => this.scene.start('Customize'),
    });

    this.input.keyboard.on('keydown', (e) => this.onKey(e));

    this.refresh();
    this.cameras.main.fadeIn(320, 0, 0, 0);
  }

  buildKeypad() {
    ROWS.forEach((row, r) => {
      const startX = GAME_W / 2 - ((row.length - 1) * KEY_STEP) / 2;
      row.split('').forEach((ch, i) => {
        new KeyCap(this, startX + i * KEY_STEP, ROW_Y + r * ROW_STEP, ch, (c) => this.push(c));
      });
    });
  }

  onKey(e) {
    if (e.key === 'Backspace') {
      this.backspace();
      return;
    }
    if (e.key === 'Enter') {
      this.confirm();
      return;
    }
    if (e.key === ' ') {
      this.push(' ');
      return;
    }
    if (/^[a-z0-9]$/i.test(e.key)) this.push(e.key.toUpperCase());
  }

  push(ch) {
    if (this.name.length >= MAX_NAME) return;
    audio.play('key');
    // A leading space would read as an empty name on the ending screens.
    if (ch === ' ' && this.name.length === 0) return;
    this.name += ch;
    this.refresh();
  }

  backspace() {
    if (!this.name.length) return;
    audio.play('uiBack');
    this.name = this.name.slice(0, -1);
    this.refresh();
  }

  refresh() {
    const trimmed = this.name.trim();
    this.nameText.setText(this.name);
    this.placeholder.setAlpha(this.name.length ? 0 : 1);
    this.caret.setPosition(GAME_W / 2 + this.nameText.width / 2 + 12, 250);
    this.caret.setVisible(this.name.length < MAX_NAME);
    this.okButton.setEnabled(trimmed.length > 0);
  }

  confirm() {
    const trimmed = this.name.trim();
    if (!trimmed.length || this.leaving) return;
    this.leaving = true;
    audio.play('uiConfirm');
    GameState.playerName = trimmed;
    this.cameras.main.fadeOut(280, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Difficulty'));
  }
}
