// Hard is the game as it has always played. Easy adds the boy's ghost and
// changes nothing else, so the two modes stay directly comparable.
class DifficultyScene extends Phaser.Scene {
  constructor() {
    super('Difficulty');
  }

  create() {
    this.leaving = false;
    meadowBackdrop(this, 0.72);
    const cx = GAME_W / 2;

    // Greeting and heart are separate runs of text so the "<3" can be pink
    // while the rest stays gold; PixelText tints a whole string at once.
    const greet = new PixelText(this, 0, 118, `GOOD LUCK ${GameState.playerName} `, {
      scale: 2,
      color: 0xffe08a,
    });
    const heart = new PixelText(this, 0, 118, '<3', { scale: 2, color: 0xff4d6d });
    const span = greet.width + heart.width;
    greet.setPosition(cx - span / 2 + greet.width / 2, 118).setDepth(600);
    heart.setPosition(cx - span / 2 + greet.width + heart.width / 2, 118).setDepth(600);

    const title = new PixelText(this, cx, 188, 'CHOOSE YOUR RUN', { scale: 3, color: 0xffffff });
    title.setDepth(600);

    // Tharuk is the boy — a fixed character name, not the player's.
    this.buildOption(cx, 300, 'EASY', 0x7ed957, ["THARUK'S GHOST FIGHTS", 'ALONGSIDE YOU'], 'easy');
    this.buildOption(cx, 470, 'HARD', 0xff4d6d, ['NO GHOST.'], 'hard');
    // Deliberately unexplained, and deliberately the loudest thing on screen.
    new MenuButton(this, cx, 645, 'I LOVE YOU JORY!', {
      scale: 2,
      color: 0xe0559a,
      // Padding kept tight so the extra character does not push the button
      // out to the screen edges.
      padX: 20,
      minWidth: 396,
      padY: 24,
      grand: true,
      onPick: () => this.pick('jory'),
    });

    this.cameras.main.fadeIn(320, 0, 0, 0);
  }

  buildOption(x, y, label, color, lines, value, scale = 4, minWidth = 300) {
    new MenuButton(this, x, y, label, {
      scale,
      color,
      minWidth,
      onPick: () => this.pick(value),
    });
    lines.forEach((line, i) => {
      const t = new PixelText(this, x, y + 56 + i * 20, line, { scale: 1, color: 0x9a94b0 });
      t.setDepth(600);
    });
  }

  pick(value) {
    if (this.leaving) return;
    this.leaving = true;
    audio.play('uiConfirm');
    // Her run gets its own send-off, and the music turns over to the meadow
    // before the screen has finished fading.
    if (value === 'jory') {
      this.fx.star(GAME_W / 2, 400, { tint: 0xff8fb0, scale: 1.6 });
      this.fx.sparkleTrail(GAME_W / 2, 400, 0xff8fb0, 24);
      audio.play('heartGet');
    }
    GameState.difficulty = value;
    // The Jory run tells a different story, so it has its own opening.
    const next = value === 'jory' ? 'JoryIntro' : 'Intro';
    this.cameras.main.fadeOut(320, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start(next));
  }
}

/* ---- js/scenes/IntroScene.js ---- */

const ZOOM = 1.5;
const FOCUS_X = 240;
const FOCUS_Y = 420;
// What the zoomed camera can actually see, so blobs can start off-screen.
const VIEW_W = GAME_W / ZOOM;
const VIEW_H = GAME_H / ZOOM;
const VIEW = {
  left: FOCUS_X - VIEW_W / 2,
  right: FOCUS_X + VIEW_W / 2,
  top: FOCUS_Y - VIEW_H / 2,
  bottom: FOCUS_Y + VIEW_H / 2,
};

// The opening is told entirely in sprites, tweens and camera work: picnic,
// swarm, theft, collapse, chase, fade. No narration.
class IntroScene extends Phaser.Scene {
  constructor() {
    super('Intro');
  }

  create() {
    this.done = false;
    this.cameras.main.setZoom(ZOOM).centerOn(FOCUS_X, FOCUS_Y);
    installFx(this);
    this.buildMeadow();

    this.blanket = this.add.image(FOCUS_X, FOCUS_Y + 12, 'blanket').setDepth(1).setScale(0.95);
    this.basket = this.add.image(FOCUS_X + 62, FOCUS_Y + 24, 'basket').setDepth(FOCUS_Y + 24);

    this.boy = this.add.image(FOCUS_X - 34, FOCUS_Y, 'boy_sit').setDepth(FOCUS_Y);
    this.girl = this.add.image(FOCUS_X + 34, FOCUS_Y, 'girl_sit').setDepth(FOCUS_Y);

    this.heart = this.add
      .image(this.boy.x, this.boy.y - 2, 'heart')
      .setDepth(FOCUS_Y + 30)
      .setVisible(false);

    this.shock = this.add
      .image(this.girl.x + 18, this.girl.y - 32, 'shock')
      .setDepth(FOCUS_Y + 40)
      .setVisible(false);

    this.blobs = [];

    this.skipHint = new PixelText(this, FOCUS_X, VIEW.bottom - 26, 'TAP TO SKIP', {
      scale: 1,
      color: 0xffffff,
    });
    this.skipHint.setAlpha(0.55).setDepth(2000);

    this.input.once('pointerdown', () => this.finish());
    this.input.keyboard.once('keydown-SPACE', () => this.finish());
    this.input.keyboard.once('keydown-ENTER', () => this.finish());

    // Starts as the same warm meadow the title screen is, and is dragged
    // toward the dungeon grade over the course of the theft.
    this.fx.ambient('meadow', {
      x: VIEW.left,
      y: VIEW.top,
      width: VIEW.right - VIEW.left,
      height: VIEW.bottom - VIEW.top,
    });
    this.fx.godRays(VIEW.left, VIEW.top, VIEW.right - VIEW.left, VIEW.bottom - VIEW.top, {
      count: 3,
      alpha: 0.06,
    });
    applyPostFX(this, 'meadow');
    // Silent by design — a custom track goes here.
    audio.stopMusic(600);

    this.cameras.main.fadeIn(700, 0, 0, 0);
    this.runScript();
  }

  buildMeadow() {
    const rt = this.add.renderTexture(0, 0, GAME_W, GAME_H).setOrigin(0, 0).setDepth(-100);
    for (let y = 0; y < GAME_H; y += TILE) {
      for (let x = 0; x < GAME_W; x += TILE) {
        rt.draw((x / TILE + y / TILE) % 2 ? 'tile_grass' : 'tile_grass2', x, y);
        const roll = hash2(x, y);
        if (roll < 0.16) rt.draw('flower', x + 3 + roll * 110, y + 4 + hash2(y, x) * 20);
      }
    }
    // A hedge line across the top, with a gap the blobs escape through.
    for (let x = -20; x < GAME_W + 20; x += 26) {
      const gap = x > 120 && x < 190;
      if (gap) continue;
      this.add.image(x, VIEW.top + 26, 'bush').setDepth(VIEW.top + 26);
      this.add.image(x + 13, VIEW.top + 4, 'bush').setDepth(VIEW.top + 4);
    }
    [
      [VIEW.left + 30, FOCUS_Y + 150],
      [VIEW.right - 34, FOCUS_Y + 110],
      [VIEW.left + 46, FOCUS_Y - 110],
      [VIEW.right - 26, FOCUS_Y - 140],
    ].forEach(([x, y]) => this.add.image(x, y, 'bush').setDepth(y));
  }

  spawnBlobs() {
    // `recoil` is where each one backs off to after the theft — chosen so the
    // floating heart, the fallen boy and the girl all stay unobstructed.
    const plan = [
      {
        from: { x: VIEW.left - 40, y: FOCUS_Y - 60 },
        to: { x: this.boy.x - 24, y: this.boy.y - 4 },
        recoil: { x: this.boy.x - 74, y: this.boy.y + 12 },
        tier: 'easy',
      },
      {
        from: { x: VIEW.right + 40, y: FOCUS_Y - 90 },
        to: { x: this.boy.x + 18, y: this.boy.y - 12 },
        recoil: { x: this.boy.x - 40, y: this.boy.y + 60 },
        tier: 'medium',
      },
      {
        from: { x: VIEW.left - 50, y: VIEW.bottom + 30 },
        to: { x: this.boy.x - 4, y: this.boy.y + 14 },
        recoil: { x: this.boy.x + 20, y: this.boy.y + 64 },
        tier: 'easy',
      },
      {
        from: { x: VIEW.right + 50, y: VIEW.bottom + 40 },
        to: { x: this.boy.x + 6, y: this.boy.y - 24 },
        recoil: { x: this.boy.x - 80, y: this.boy.y - 40 },
        tier: 'hard',
      },
    ];
    this.blobs = plan.map((p) => {
      const s = this.add.image(p.from.x, p.from.y, `blob_${p.tier}_idle`);
      s.setDepth(this.boy.depth + 20);
      s.target = p.to;
      s.recoil = p.recoil;
      return s;
    });
  }

  runScript() {
    const director = new CutsceneDirector(this);
    this.director = director;

    director
      // A quiet beat first, so the interruption lands.
      .wait(900)
      .tweenAsync({
        targets: this.girl,
        y: this.girl.y - 3,
        duration: 700,
        yoyo: true,
        repeat: 2,
        ease: 'Sine.inOut',
      })
      .wait(800)
      .call(() => this.spawnBlobs())
      .call(() => {
        this.cameras.main.shake(400, 0.004);
        audio.play('roar');
        gradePostFX(this, 'boss', 1400);
      })
      // Swarm in from every side and pile onto him.
      .tween(() => ({
        targets: this.blobs,
        x: (t, k, v, i) => this.blobs[i].target.x,
        y: (t, k, v, i) => this.blobs[i].target.y,
        duration: 900,
        ease: 'Quad.in',
      }))
      .call(() => {
        this.blobs.forEach((b, i) => {
          this.tweens.add({
            targets: b,
            y: b.y - 9,
            duration: 150,
            yoyo: true,
            repeat: 3,
            delay: i * 55,
            ease: 'Quad.out',
          });
          // One wet impact per blob, staggered with the pile-on, so the swarm
          // sounds like four things landing rather than one event.
          this.time.delayedCall(i * 55, () => {
            audio.play('squelch', { pitch: 0.9 + i * 0.12 });
            this.fx.gooBurst(b.x, b.y, 0x7ed957, 6);
            this.fx.dust(b.x, b.y + 8, 4, 0x9ec46a);
          });
        });
        this.cameras.main.shake(700, 0.009);
      })
      .wait(900)
      // The heart is torn out.
      .call(() => {
        this.heart.setVisible(true).setPosition(this.boy.x, this.boy.y - 2).setScale(0.6);
        this.cameras.main.flash(200, 255, 120, 150);
        this.fx.ring(this.boy.x, this.boy.y - 2, { tint: 0xff4d6d, to: 2.4, duration: 700, alpha: 1 });
        this.fx.gooBurst(this.boy.x, this.boy.y - 2, 0xff4d6d, 16);
        this.fx.punch(0.016, 300, 0.03);
        audio.duck(0.3, 900);
        audio.play('steal');
      })
      .tween({ targets: this.heart, y: this.heart.y - 52, scale: 1.1, duration: 520, ease: 'Back.out' })
      // Scatter off him first, otherwise the pile hides the collapse entirely.
      .tween(() => ({
        targets: this.blobs,
        x: (t, k, v, i) => this.blobs[i].recoil.x,
        y: (t, k, v, i) => this.blobs[i].recoil.y,
        duration: 320,
        ease: 'Quad.out',
      }))
      .call(() => {
        // He goes limp and falls flat where he sat.
        this.boy.setTexture('boy_limp');
        this.fx.dust(this.boy.x, this.boy.y + 16, 8, 0x9ec46a);
        audio.play('thud');
        this.tweens.add({
          targets: this.boy,
          angle: -90,
          x: this.boy.x - 10,
          y: this.boy.y + 16,
          duration: 420,
          ease: 'Quad.in',
        });
      })
      .wait(520)
      .call(() => {
        this.shock.setVisible(true).setScale(0.4);
        audio.play('hurt');
        this.tweens.add({ targets: this.shock, scale: 1, duration: 240, ease: 'Back.out' });
        this.tweens.add({ targets: this.girl, y: this.girl.y - 10, duration: 160, yoyo: true, repeat: 1 });
      })
      // Hold on him lying there before she moves.
      .wait(900)
      .call(() => {
        this.girl.setTexture('girl_idle_up');
        this.shock.setVisible(false);
      })
      // They bolt for the gap in the hedge, heart in tow.
      .tweenAsync(() => ({
        targets: [...this.blobs, this.heart],
        x: 155,
        y: VIEW.top - 40,
        duration: 1000,
        ease: 'Quad.in',
      }))
      .wait(280)
      .tween({ targets: this.girl, x: 165, y: VIEW.top + 30, duration: 900, ease: 'Quad.in' })
      .call(() => this.cameras.main.fadeOut(700, 0, 0, 0))
      .wait(850)
      .call(() => this.finish());

    director.play();
  }

  finish() {
    if (this.done) return;
    this.done = true;
    this.director?.stop();
    GameState.reset();
    GameState.seenIntro = true;
    runTimer.start();
    this.scene.start('Level1');
    this.scene.launch('HUD');
  }
}

/* ---- js/scenes/JoryIntroScene.js ---- */

const JI_ZOOM = 1.25;
const JI_FX = 240;
const JI_FY = 430;
const JI_VW = GAME_W / JI_ZOOM;
const JI_VH = GAME_H / JI_ZOOM;
const JI_VIEW = {
  left: JI_FX - JI_VW / 2,
  right: JI_FX + JI_VW / 2,
  top: JI_FY - JI_VH / 2,
  bottom: JI_FY + JI_VH / 2,
};

// 300ms lean in, 320ms held together, 300ms back — the heart lands on the end
// of it. Shared by the story and the garden.
const KISS_MS = 920;

// Narrow on purpose: a wide bubble covers half the meadow. Long speeches are
// split into consecutive bubbles rather than one tall one.
const WRAP = 20;
const GATE_X = 240;

// The "I love you Jory" opening. Nothing is stolen here — they talk, he gives
// her a key, and she walks out through the gate under her own steam.
//
// The meadow, the pond, the cats and the kiss are all built here but none of
// them know about the script, so GardenScene subclasses this and swaps the
// story out for a timer. The three hooks it overrides are `setupMode`,
// `buildOverlay` and `begin`.
class JoryIntroScene extends Phaser.Scene {
  constructor(key = 'JoryIntro') {
    super(key);
  }

  create() {
    this.done = false;
    this.bubble = null;
    this.setupMode();
    this.cameras.main.setZoom(JI_ZOOM).centerOn(JI_FX, JI_FY);

    installFx(this);
    this.buildMeadow();
    this.buildPond();

    this.blanket = this.add.image(JI_FX, JI_FY + 16, 'blanket').setDepth(1).setScale(1.1);

    this.boy = this.add.image(JI_FX - 34, JI_FY, 'boy_sit').setDepth(JI_FY);
    this.girl = this.add.image(JI_FX + 34, JI_FY, 'girl_sit').setDepth(JI_FY);

    this.buildSpread();

    this.buildCats();

    this.key = this.add
      .image(this.boy.x, this.boy.y - 4, 'key')
      .setDepth(JI_FY + 30)
      .setVisible(false);

    this.smiley = this.add
      .image(this.boy.x + 4, this.boy.y - 34, 'smiley')
      .setDepth(JI_FY + 40)
      .setVisible(false);

    this.kiss = this.add
      .image(JI_FX, JI_FY - 26, 'heart')
      .setDepth(JI_FY + 40)
      .setVisible(false)
      .setScale(0.5);

    this.buildOverlay();

    // Petals over the roses, fireflies in the grass, sun through the hedge.
    // Nothing in this scene is a threat, so all of the motion is weather.
    this.fx.ambient('meadow', {
      x: JI_VIEW.left,
      y: JI_VIEW.top,
      width: JI_VIEW.right - JI_VIEW.left,
      height: JI_VIEW.bottom - JI_VIEW.top,
    });
    this.fx.ambient('petals', {
      x: JI_VIEW.left,
      y: JI_VIEW.top,
      width: JI_VIEW.right - JI_VIEW.left,
      height: JI_VIEW.bottom - JI_VIEW.top,
    });
    this.fx.godRays(JI_VIEW.left, JI_VIEW.top, JI_VIEW.right - JI_VIEW.left, JI_VIEW.bottom - JI_VIEW.top, {
      count: 4,
      alpha: 0.075,
    });
    applyPostFX(this, 'meadow');
    // Her song, not a generated one — this is the story, not a level.
    audio.music('flowers');

    this.cameras.main.fadeIn(700, 0, 0, 0);
    this.begin();
  }

  // ---- the three things the garden does differently -----------------------

  // This scene defines the mode, so it sets it rather than trusting whoever
  // started it — the HUD keys its whole layout off this.
  setupMode() {
    GameState.difficulty = 'jory';
  }

  buildOverlay() {
    this.skipHint = new PixelText(this, JI_FX, JI_VIEW.bottom - 24, 'TAP TO SKIP', {
      scale: 1,
      color: 0xffffff,
    });
    this.skipHint.setAlpha(0.55).setDepth(2000);

    this.input.once('pointerdown', () => this.finish());
    this.input.keyboard.once('keydown-SPACE', () => this.finish());
    this.input.keyboard.once('keydown-ENTER', () => this.finish());
  }

  begin() {
    this.runScript();
  }

  // A field of roses rather than the wild flowers of the other opening — red
  // and white mixed, scattered deterministically so it never re-rolls.
  buildMeadow() {
    const rt = this.add.renderTexture(0, 0, GAME_W, GAME_H).setOrigin(0, 0).setDepth(-100);
    for (let y = 0; y < GAME_H; y += TILE) {
      for (let x = 0; x < GAME_W; x += TILE) {
        rt.draw((x / TILE + y / TILE) % 2 ? 'tile_grass' : 'tile_grass2', x, y);
        const roll = hash2(x, y);
        if (roll < 0.24) {
          const white = hash2(y + 11, x + 7) < 0.45;
          rt.draw(white ? 'rose_white' : 'rose_red', x + 2 + roll * 60, y + 3 + hash2(y, x) * 18);
        }
      }
    }

    // One unbroken run of hedge either side of the gate, rather than a line of
    // separate clumps.
    const hedgeY = JI_VIEW.top + 14;
    this.add.image(-20, hedgeY, 'hedge_left').setOrigin(0, 0.5).setDepth(hedgeY);
    this.add.image(GATE_X + 30, hedgeY, 'hedge_right').setOrigin(0, 0.5).setDepth(hedgeY);
    this.gate = this.add.image(GATE_X, JI_VIEW.top + 18, 'door_locked').setDepth(JI_VIEW.top + 18);
    // No scattered bushes out in the field — on open grass they read as stray
    // green blobs rather than shrubs. The roses carry the meadow on their own.
  }

  // Food laid out on the front half of the mat, below where the two of them
  // are sitting. Everything sorts on its own y so it layers with them.
  buildSpread() {
    const spread = [
      { key: 'rose_jar', x: JI_FX + 2, y: JI_FY + 16 },
      { key: 'picnic_basket', x: JI_FX - 44, y: JI_FY + 30 },
      { key: 'cake', x: JI_FX - 10, y: JI_FY + 38 },
      { key: 'sandwich', x: JI_FX + 20, y: JI_FY + 40 },
      { key: 'cup', x: JI_FX + 44, y: JI_FY + 32 },
      { key: 'cup', x: JI_FX - 28, y: JI_FY + 50 },
    ];

    this.spread = spread.map(({ key, x, y }) => this.add.image(x, y, key).setDepth(y));

    // The cake gets a slow bob so the eye lands on it.
    const cake = this.spread[2];
    this.tweens.add({
      targets: cake,
      y: cake.y - 2,
      duration: 1700,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
  }

  // Pond down in the corner with otters turning circles in it.
  buildPond() {
    const px = JI_VIEW.left + 76;
    const py = JI_FY + 186;

    // Otters sort on their live y, which swings above and below the pond's
    // centre as they swim. Water and pads therefore need depths below the
    // lowest y an otter can reach, or an otter at the top of its arc sorts
    // behind a pad and appears to swim through it.
    const WATER_DEPTH = py - 80;
    const PAD_DEPTH = py - 60;

    this.add.image(px, py, 'pond').setDepth(WATER_DEPTH);

    // Pads sit on the water, under the otters, and drift a little.
    [
      [px - 44, py - 16, 'lilypad_bloom'],
      [px + 40, py + 14, 'lilypad'],
      [px + 4, py - 30, 'lilypad'],
      [px - 18, py + 30, 'lilypad_bloom'],
    ].forEach(([x, y, key], i) => {
      const pad = this.add.image(x, y, key).setDepth(PAD_DEPTH);
      this.tweens.add({
        targets: pad,
        x: x + 5,
        y: y + 3,
        duration: 2600 + i * 500,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.inOut',
      });
    });

    // Reeds around the rim, in front of and behind the water.
    [
      [px - 74, py - 22],
      [px - 58, py + 30],
      [px + 70, py - 16],
      [px + 52, py + 30],
      [px - 6, py - 46],
      [px + 22, py + 44],
    ].forEach(([x, y], i) => {
      const reed = this.add.image(x, y, 'reeds').setDepth(y + 8);
      // A slow lean, out of phase, so the bank looks like it has a breeze on it.
      this.tweens.add({
        targets: reed,
        angle: i % 2 ? 4 : -4,
        duration: 1800 + i * 260,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.inOut',
      });
    });

    this.otters = [0, 1, 2].map((i) => {
      const otter = this.add.sprite(px, py, 'otter').setDepth(py);
      otter.play('otter');
      otter.setScale(0.8);
      // Each swims its own slow ellipse inside the water.
      const rx = 52 - i * 13;
      const ry = 22 - i * 5;
      const phase = (i / 3) * Math.PI * 2;
      otter.swim = { px, py, rx, ry, phase: phase + i * 0.7, speed: 0.0009 + i * 0.00016 };
      return otter;
    });
  }

  // Three cats mooching about: white, toasted and black.
  buildCats() {
    const spots = [
      { key: 'cat_white', x: JI_FX + 96, y: JI_FY + 74, range: 54 },
      { key: 'cat_toast', x: JI_FX - 104, y: JI_FY + 40, range: 46 },
      { key: 'cat_black', x: JI_FX + 40, y: JI_FY - 82, range: 62 },
    ];
    this.cats = spots.map((spot, i) => {
      const cat = this.add.sprite(spot.x, spot.y, spot.key).setDepth(spot.y);
      cat.play(spot.key);
      // Pace back and forth, flipping to face the way they are going.
      this.tweens.add({
        targets: cat,
        x: spot.x + spot.range,
        duration: 3200 + i * 700,
        yoyo: true,
        repeat: -1,
        delay: i * 900,
        ease: 'Sine.inOut',
        onYoyo: () => cat.setFlipX(true),
        onRepeat: () => cat.setFlipX(false),
      });
      this.tweens.add({
        targets: cat,
        y: spot.y + 14,
        duration: 2100 + i * 500,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.inOut',
      });
      return cat;
    });
  }

  update(time) {
    this.otters?.forEach((o) => {
      const s = o.swim;
      const t = time * s.speed + s.phase;
      const nx = s.px + Math.cos(t) * s.rx;
      o.setFlipX(Math.sin(t) > 0);
      o.setPosition(nx, s.py + Math.sin(t) * s.ry);
      o.setDepth(o.y);
    });
    this.cats?.forEach((c) => c.setDepth(c.y));
  }

  // They lean in, hold, come apart, and the heart rises out of it. Written as
  // one call so the story beat and the garden's timer play the same thing.
  playKiss() {
    const lean = { duration: 300, yoyo: true, hold: 320, ease: 'Quad.out' };
    this.tweens.add({ targets: this.boy, x: this.boy.x + 16, ...lean });
    this.tweens.add({ targets: this.girl, x: this.girl.x - 16, ...lean });

    // The heart lands as they come apart rather than while they are together,
    // which is what reads as "that just happened" instead of a floating prop.
    this.time.delayedCall(KISS_MS, () => {
      this.kiss.setVisible(true).setAlpha(1).setScale(0.3).setPosition(JI_FX, JI_FY - 22);
      this.fx.sparkleTrail(JI_FX, JI_FY - 22, 0xff8fb0, 10);
      audio.play('heartGet');
      this.tweens.add({
        targets: this.kiss,
        scale: 1,
        y: this.kiss.y - 28,
        alpha: 0,
        duration: 950,
        ease: 'Quad.out',
      });
    });
  }

  // ---- dialogue ----------------------------------------------------------

  say(speaker, text) {
    this.bubble?.destroy();
    const above = speaker.y - 96;
    // Nudge the bubble toward the middle so a wide one never leaves the view.
    const cx = Phaser.Math.Clamp(speaker.x + (speaker === this.boy ? 40 : -40), 150, 330);
    this.bubble = new SpeechBubble(this, cx, above, text, {
      maxChars: WRAP,
      tailX: speaker.x,
      tailY: speaker.y,
      // He speaks lower than she does. It is two notes of difference and it is
      // the only thing making the two sides of the conversation distinguishable
      // with the sound on and the screen looked away from.
      voicePitch: speaker === this.boy ? 0.78 : 1.18,
    });
    this.bubble.type();
  }

  hideBubble() {
    this.bubble?.hide();
    this.bubble = null;
  }

  // One exchange: show it, type it, hold, clear.
  beat(director, speaker, text) {
    return director
      .call(() => this.say(speaker, text))
      .wait(speechDuration(text, WRAP) + BUBBLE_HOLD_MS)
      .call(() => this.hideBubble())
      .wait(280);
  }

  runScript() {
    const director = new CutsceneDirector(this);
    this.director = director;

    director.wait(900);

    this.beat(
      director,
      this.boy,
      'You know Jory, I really love you and I love spending my time with you.',
    );
    this.beat(director, this.boy, 'You mean everything to me.');

    this.beat(director, this.girl, 'I love you too Tharuk!');

    // He grins before he says it.
    director
      .call(() => {
        this.smiley.setVisible(true).setScale(0.3);
        this.tweens.add({ targets: this.smiley, scale: 1, duration: 260, ease: 'Back.out' });
        this.tweens.add({
          targets: this.smiley,
          y: this.smiley.y - 5,
          duration: 520,
          yoyo: true,
          repeat: 2,
          ease: 'Sine.inOut',
        });
      })
      .wait(520);

    this.beat(director, this.boy, 'I want to give this to you...');

    // The key comes out and crosses to her.
    director
      .call(() => {
        this.smiley.setVisible(false);
        this.key.setVisible(true).setScale(0.5).setPosition(this.boy.x, this.boy.y - 4);
        this.tweens.add({ targets: this.key, scale: 1.1, duration: 320, ease: 'Back.out' });
        this.cameras.main.flash(180, 250, 220, 140);
        this.fx.star(this.boy.x, this.boy.y - 4, { tint: 0xffe08a, scale: 0.9 });
        this.fx.sparkleTrail(this.boy.x, this.boy.y - 4, 0xffe08a, 12);
        audio.play('sparkle');
      })
      .wait(380)
      .tween({
        targets: this.key,
        x: this.girl.x,
        y: this.girl.y - 12,
        duration: 640,
        ease: 'Sine.inOut',
      })
      .wait(260);

    this.beat(
      director,
      this.boy,
      'Take this Jory! This is for you, go and open the chest once you see it.',
    );
    this.beat(director, this.boy, "You'll know what I'm talking about.");
    this.beat(director, this.boy, 'Good luck, I love you!');

    // The kiss. KISS_MS is what the two lean tweens take, so the wait here
    // matches the old inline version exactly.
    director.call(() => this.playKiss()).wait(KISS_MS + 800)
      // And she goes, key in hand, out through the gate.
      .call(() => {
        this.girl.setTexture('girl_idle_up');
        this.gate.setTexture('door_open');
        this.tweens.add({ targets: this.gate, scale: 1.12, duration: 220, yoyo: true });
        this.fx.ring(this.gate.x, this.gate.y, { tint: 0xffe08a, to: 1.6, duration: 640 });
        audio.play('doorOpen');
      })
      .wait(300)
      .tweenAsync(() => ({
        targets: [this.girl, this.key],
        x: GATE_X,
        y: JI_VIEW.top + 6,
        duration: 1600,
        ease: 'Sine.inOut',
      }))
      .wait(1500)
      .call(() => this.cameras.main.fadeOut(700, 0, 0, 0))
      .wait(800)
      .call(() => this.finish());

    director.play();
  }

  finish() {
    if (this.done) return;
    this.done = true;
    this.director?.stop();
    this.bubble?.destroy();
    GameState.reset();
    GameState.seenIntro = true;
    // She is armed from the start here — there is no sword lying in the arena,
    // and no time to go looking for one.
    GameState.hasSword = true;
    GameState.hasKey = true;
    this.scene.start('JoryLevel');
    this.scene.launch('HUD');
  }
}

/* ---- js/scenes/HUDScene.js ---- */

// Every scene the pause button can be covering. The HUD only runs alongside one
// of these, and it needs to know which so it can freeze it.
const PLAY_SCENES = ['Level1', 'Level2', 'Level3', 'Return', 'JoryLevel'];

// Runs in parallel with whichever level is active and is never restarted, so the
// countdown cannot be reset by walking through a door.
class HUDScene extends Phaser.Scene {
  constructor() {
    super('HUD');
  }

  create() {
    this.add.rectangle(0, 0, GAME_W, HUD_H, 0x120f1c, 0.94).setOrigin(0, 0).setDepth(880);
    // Two rules under the bar rather than one: a lit hairline over a soft glow,
    // so the strip reads as a lip the play area sits below.
    this.add.rectangle(0, HUD_H - 2, GAME_W, 2, 0x6b5a8a).setOrigin(0, 0).setDepth(881);
    this.add
      .image(GAME_W / 2, HUD_H, 'fx_glow')
      .setTint(0x8f6bb0)
      .setAlpha(0.3)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(879)
      .setScale(5, 0.4);

    // The Jory run has no clock — the top right carries the wave count instead,
    // and the key he gave her sits beside the hearts.
    this.isJory = GameState.difficulty === 'jory';

    if (this.isJory) {
      this.waveLabel = new PixelText(this, GAME_W - 16, 28, 'WAVE 1', {
        scale: 2,
        color: 0xffe08a,
        align: 'right',
      });
      this.waveLabel.setDepth(900);
      this.onWave = (n, total) => this.setWave(n, total);
      this.game.events.on(EV_WAVE_CHANGED, this.onWave);
      // Beside the hearts, not beside the wave label — the label grows leftwards
      // and would sit on top of it.
      this.keyIcon = this.add.image(124, 28, 'key').setDepth(900).setScale(1.1);
    } else {
      this.clock = new PixelText(this, GAME_W - 16, 28, runTimer.format(), {
        scale: 3,
        color: 0xffffff,
        align: 'right',
      });
      this.clock.setDepth(900);
    }

    // Reset on every launch: the scene instance is reused, so a stale value
    // from the previous run would swallow the first tick of this one.
    this.lastTickSecond = null;

    this.hearts = [];
    for (let i = 0; i < PLAYER_MAX_HP; i++) {
      this.hearts.push(this.add.image(26 + i * 30, 28, 'heart_small').setDepth(900).setScale(1.2));
    }

    // Low enough to clear the doorway at the top of the arena and the thumb
    // controls at the bottom.
    this.hint = new PixelText(this, GAME_W / 2, GAME_H - 208, '', { scale: 2, color: 0xffe08a });
    this.hint.setDepth(900).setAlpha(0);

    if (input.isTouch) {
      this.stick = new VirtualJoystick(this, 88, GAME_H - 110);
      this.attackBtn = new TouchButton(this, GAME_W - 78, GAME_H - 110, 'ui_attack');
      input.attachTouchUI(this.stick, this.attackBtn);
    } else {
      input.bindDesktopClick(this);
    }

    this.buildPauseButton();

    this.game.events.on(EV_HEALTH_CHANGED, this.refreshHearts, this);
    this.refreshHearts(GameState.playerHp);

    // A level scene can create before this one and ask for a hint immediately.
    if (this.pendingHint) {
      this.showHint(this.pendingHint.text, this.pendingHint.ms);
      this.pendingHint = null;
    }

    this.events.on('shutdown', () => {
      this.game.events.off(EV_HEALTH_CHANGED, this.refreshHearts, this);
      if (this.onWave) this.game.events.off(EV_WAVE_CHANGED, this.onWave);
      input.detachTouchUI();
    });
  }

  // Middle of the HUD strip. The hearts own the left and the clock or the wave
  // count owns the right, and this is the one part of the bar that is empty in
  // both modes. It also keeps it out of the play area, where a stray thumb
  // during a fight would find it.
  buildPauseButton() {
    this.paused = false;
    this.pauseView = [];

    this.pauseBtn = this.add
      .image(GAME_W / 2, HUD_H / 2, 'ui_pause')
      .setDepth(900)
      .setAlpha(0.72)
      .setInteractive({ useHandCursor: true });
    this.pauseBtn.on('pointerover', () => this.pauseBtn.setAlpha(1));
    this.pauseBtn.on('pointerout', () => this.pauseBtn.setAlpha(0.72));
    this.pauseBtn.on('pointerup', () => {
      audio.play('uiClick');
      this.pauseGame();
    });

    this.input.keyboard.on('keydown-ESC', () => this.togglePause());
    this.input.keyboard.on('keydown-P', () => this.togglePause());
  }

  // Only finds a level that is actually running. Once one is paused Phaser no
  // longer reports it as active, which is why pauseGame holds on to it rather
  // than looking it up again on the way out.
  activeLevel() {
    return PLAY_SCENES.map((k) => this.scene.get(k)).find((s) => s && s.scene.isActive());
  }

  togglePause() {
    if (this.paused) this.resumeGame();
    else this.pauseGame();
  }

  pauseGame() {
    const level = this.activeLevel();
    // Nothing to freeze between rooms, and pausing then would strand the HUD
    // over a scene that is about to start anyway.
    if (this.paused || !level) return;
    this.paused = true;
    this.pausedLevel = level;

    runTimer.pause();
    level.scene.pause();
    audio.holdMusic(0.25);
    this.setControlsEnabled(false);
    this.pauseBtn.setVisible(false);

    const cx = GAME_W / 2;
    const keep = (o) => {
      this.pauseView.push(o);
      return o;
    };

    keep(this.add.rectangle(0, 0, GAME_W, GAME_H, 0x0d0b14, 0.8).setOrigin(0, 0).setDepth(1400));
    keep(new PixelText(this, cx, 250, 'PAUSED', { scale: 4, color: 0xffe08a }).setDepth(1401));
    keep(
      new MenuButton(this, cx, 390, 'RESUME', {
        scale: 3,
        minWidth: 300,
        depth: 1402,
        color: 0x7ed957,
        onPick: () => this.resumeGame(),
      }),
    );
    keep(
      new MenuButton(this, cx, 480, 'MAIN MENU', {
        scale: 2,
        minWidth: 300,
        depth: 1402,
        onPick: () => this.quitToMenu(),
      }),
    );
    // Reachable mid-run without quitting out to the title screen for it.
    keep(new SoundToggle(this, cx, 570, { depth: 1402, size: 30 }));
  }

  resumeGame() {
    if (!this.paused) return;
    this.paused = false;

    this.pauseView.forEach((o) => o.destroy());
    this.pauseView = [];
    this.pauseBtn.setVisible(true).setAlpha(0.72);
    this.setControlsEnabled(true);

    runTimer.resume();
    audio.releaseMusic();
    this.pausedLevel?.scene.resume();
    this.pausedLevel = null;
  }

  quitToMenu() {
    this.paused = false;
    this.pauseView.forEach((o) => o.destroy());
    this.pauseView = [];
    runTimer.stop();
    // The level is only paused, so it has to be stopped by hand — starting the
    // menu from here shuts down the HUD but nothing else.
    this.pausedLevel?.scene.stop();
    this.pausedLevel = null;
    this.scene.start('Menu');
  }

  // Left on screen but deaf, so a thumb resting on the stick cannot steer while
  // paused and a tap on the sword cannot queue a swing for the moment play
  // resumes.
  setControlsEnabled(on) {
    if (this.stick) this.stick.zone.input.enabled = on;
    if (this.attackBtn) this.attackBtn.image.input.enabled = on;
  }

  setWave(n, total) {
    if (!this.waveLabel) return;
    this.waveLabel.setText(typeof n === 'number' ? `WAVE ${n}/${total}` : String(n));
    this.waveLabel.setTint(typeof n === 'number' ? 0xffe08a : 0xff4d6d);
  }

  showHint(text, ms = 2200) {
    if (!this.hint) {
      this.pendingHint = { text, ms };
      return;
    }
    this.hint.setText(text).setAlpha(1);
    this.tweens.killTweensOf(this.hint.container);
    // Drops in from slightly above and settles. A hint that simply appears is
    // easy to miss mid-fight; one that moves is not.
    this.hint.container.setScale(1.3);
    this.tweens.add({
      targets: this.hint.container,
      scale: 1,
      duration: 260,
      ease: 'Back.out',
    });
    this.tweens.add({
      targets: this.hint.container,
      alpha: 0,
      delay: ms,
      duration: 500,
    });
  }

  refreshHearts(hp) {
    this.hearts.forEach((h, i) => {
      const wasFull = h.texture.key === 'heart_small';
      const nowFull = i < hp;
      h.setTexture(nowFull ? 'heart_small' : 'heart_empty');
      if (wasFull === nowFull) return;
      // The heart that changed jumps. Losing one snaps out and shrinks back;
      // gaining one pops in. Either way the eye is pulled to which one moved.
      this.tweens.killTweensOf(h);
      h.setScale(nowFull ? 0.5 : 2);
      this.tweens.add({ targets: h, scale: 1.2, duration: 280, ease: 'Back.out' });
    });
  }

  update() {
    // No clock in the Jory run, so nothing to tick and nothing to expire.
    if (this.isJory) return;
    this.clock.setText(runTimer.format());
    const left = runTimer.getRemainingMs();
    // Turn the clock red as the last minute burns down.
    this.clock.setTint(left < 60000 ? (Math.floor(this.time.now / 250) % 2 ? 0xff4d6d : 0xffffff) : 0xffffff);

    // Audible countdown over the last ten seconds, one tick per second. Driven
    // off the clock's own value rather than a timer, so it cannot drift out of
    // step with the number on screen or keep ticking through a pause.
    const secs = Math.ceil(left / 1000);
    if (left > 0 && secs <= 10 && secs !== this.lastTickSecond) {
      this.lastTickSecond = secs;
      audio.play('tick');
      this.clock.container.setScale(1.25);
      this.tweens.add({ targets: this.clock.container, scale: 1, duration: 220, ease: 'Back.out' });
    }

    if (runTimer.tick()) this.game.events.emit(EV_TIMER_EXPIRED);
  }
}

/* ---- js/scenes/BaseLevelScene.js ---- */

// What each room looks, sounds and lights like. The dungeon is lit only by its
// torches and by whatever the player is carrying; the garden is open daylight.
const ROOM_MOOD = {
  garden: {
    postFX: 'garden',
    // The one recorded track that plays inside a level.
    music: 'flowers',
    ambient: 'garden',
    dust: 0x9ec46a,
    lighting: null,
    rays: true,
  },
  dungeon: {
    postFX: 'dungeon',
    music: 'dungeon',
    ambient: 'dungeon',
    dust: 0x8a6a4a,
    lighting: { color: 0x0a0716, alpha: 0.78 },
    rays: false,
  },
};

// Every playable room shares this: build tiles, spawn the cast, wire combat,
// unlock the door when the room is clear. Levels differ only by their data.
class BaseLevelScene extends Phaser.Scene {
  constructor(key, levelKey) {
    super(key);
    this.levelKey = levelKey;
  }

  // Overridable so a scene can supply its own room without having to register
  // it in LEVELS — levelData cannot import the Jory arena back without making
  // the two modules circular, which the flat bundle would resolve to undefined.
  getLevel() {
    return LEVELS[this.levelKey];
  }

  create() {
    const level = this.getLevel();
    this.level = level;
    this.blobs = [];
    this.finished = false;

    // Phaser keeps one instance per scene key for the life of the page, so any
    // field create() does not reassign is inherited by the next run. All of
    // these are set conditionally further down, so they have to be cleared
    // here or a replay starts holding the previous run's objects.
    this.ghost = null;
    this.boss = null;
    this.door = null;
    this.doorBlock = null;
    this.doorOpen = false;
    this.swordPickup = null;

    // Rebind every level: Key objects belong to the scene that made them and go
    // dead when that scene shuts down.
    input.bindKeyboard(this);

    // Before anything that might want to spawn a particle or hang a shadow off
    // itself — which is every entity below.
    installFx(this);
    this.mood = ROOM_MOOD[level.theme] ?? ROOM_MOOD.dungeon;
    this.stepDustTint = this.mood.dust;

    const room = buildRoom(this, level);
    this.room = room;
    this.physics.world.setBounds(ROOM_X, ROOM_Y, room.width, room.height);

    this.player = new Player(this, room.spawns.player.x, room.spawns.player.y, input);
    this.player.sprite.setCollideWorldBounds(true);
    this.physics.add.collider(this.player.sprite, room.walls);

    this.buildDoor(room.spawns.door);
    this.buildSword(room.spawns.sword);
    this.spawnEnemies(room.spawns);

    if (GameState.isEasy) {
      this.ghost = new GhostCompanion(this, this.player.x, this.player.y);
    }

    this.onBlobDied = (blob) => this.handleBlobDied(blob);
    this.game.events.on(EV_BLOB_DIED, this.onBlobDied);
    this.onTimeUp = () => this.loseToTimer();
    this.game.events.on(EV_TIMER_EXPIRED, this.onTimeUp);

    this.events.on('shutdown', () => {
      this.game.events.off(EV_BLOB_DIED, this.onBlobDied);
      this.game.events.off(EV_TIMER_EXPIRED, this.onTimeUp);
    });

    // One room, one screen: zoom so the whole arena fits below the HUD strip and
    // never scrolls, so the player can always see every blob still alive.
    const cam = this.cameras.main;
    const viewH = GAME_H - HUD_H;
    cam.setViewport(0, HUD_H, GAME_W, viewH);
    cam.setZoom(Math.min(GAME_W / room.width, viewH / room.height));
    cam.centerOn(ROOM_X + room.width / 2, ROOM_Y + room.height / 2);
    cam.fadeIn(400, 0, 0, 0);

    this.dressRoom(room);
    applyPostFX(this, this.mood.postFX);
    audio.music(this.musicTrack());

    this.onCreated?.(room);
  }

  // Overridden by level 3 and the arena, which have their own music.
  musicTrack() {
    return this.mood.music;
  }

  // Everything that is atmosphere rather than mechanism: motes in the air,
  // torchlight, the darkness the torches are cutting through, sun through the
  // hedges. None of it is collidable and none of it is ever read back.
  dressRoom(room) {
    const bounds = { x: ROOM_X, y: ROOM_Y, width: room.width, height: room.height };
    this.fx.ambient(this.mood.ambient, bounds);
    if (this.mood.rays) {
      this.fx.godRays(ROOM_X, ROOM_Y, room.width, room.height, { count: 2, alpha: 0.022 });
    }

    if (this.mood.lighting) {
      this.fx.enableLighting(ROOM_X, ROOM_Y, room.width, room.height, this.mood.lighting);
      // She carries the biggest light in the room, which is what makes moving
      // through a dungeon feel like exploring one.
      this.fx.addLight(this.player.sprite, { size: 300, offsetY: -4 });
      room.torches.forEach((t) => {
        this.fx.torch(t.x, t.y, { tint: 0xffa542, scale: 0.7 });
        this.fx.addLight(t, { flicker: true });
      });
    } else {
      room.torches.forEach((t) => this.fx.torch(t.x, t.y, { tint: 0xffd08a, scale: 0.5 }));
    }
  }

  buildDoor(pos) {
    if (!pos) return;
    this.door = this.add.image(pos.x, pos.y, 'door_locked').setDepth(pos.y - 20);
    this.doorOpen = false;
    // Solid while locked, so she cannot stand inside the doorway early.
    this.doorBlock = this.physics.add.staticImage(pos.x, pos.y, null).setVisible(false);
    this.doorBlock.body.setSize(TILE, TILE);
    this.doorBlock.refreshBody();
    this.physics.add.collider(this.player.sprite, this.doorBlock);
  }

  buildSword(pos) {
    if (!pos || GameState.hasSword) return;
    this.swordPickup = this.add.image(pos.x, pos.y, 'sword').setDepth(pos.y);
    this.tweens.add({
      targets: this.swordPickup,
      y: pos.y - 7,
      duration: 800,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });

    // A halo under it and a slow rain of sparks off it. It is the first thing
    // the player has to find, in the first room, with no text telling them where.
    this.swordGlow = this.add
      .image(pos.x, pos.y + 6, 'fx_glow')
      .setTint(0xfff2c4)
      .setAlpha(0.45)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(pos.y - 1)
      .setScale(0.7);
    this.tweens.add({
      targets: this.swordGlow,
      scale: 1.05,
      alpha: 0.7,
      duration: 900,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
    this.swordSparkle = this.time.addEvent({
      delay: 420,
      loop: true,
      callback: () => {
        if (this.swordPickup) this.fx.sparkleTrail(this.swordPickup.x, this.swordPickup.y, 0xfff2c4, 1);
      },
    });
  }

  spawnEnemies(spawns) {
    spawns.enemies.forEach((e) => this.addBlob(e.x, e.y, e.tier));
    if (spawns.boss) {
      this.boss = new BossBlob(this, spawns.boss.x, spawns.boss.y);
      this.boss.onSpawnMinion = (b) => this.spawnMinion(b);
      this.blobs.push(this.boss);
      this.physics.add.collider(this.boss.sprite, this.room.walls);
      if (this.doorBlock) this.physics.add.collider(this.boss.sprite, this.doorBlock);
    }
  }

  addBlob(x, y, tier, stats = null) {
    const blob = new Blob(this, x, y, tier, stats);
    this.physics.add.collider(blob.sprite, this.room.walls);
    if (this.doorBlock) this.physics.add.collider(blob.sprite, this.doorBlock);
    this.blobs.push(blob);
    return blob;
  }

  spawnMinion(boss) {
    audio.play('summon');
    for (let i = 0; i < 2; i++) {
      const angle = Math.random() * Math.PI * 2;
      const x = boss.x + Math.cos(angle) * 42;
      const y = boss.y + Math.sin(angle) * 42;
      const blob = this.addBlob(x, y, 'easy');
      blob.sprite.setScale(0.4);
      this.tweens.add({ targets: blob.sprite, scale: 1, duration: 300, ease: 'Back.out' });
      this.fx.burst(x, y, { tint: 0x7ed957, scale: 0.8, duration: 300 });
      this.fx.ring(x, y, { tint: 0x7ed957, to: 0.55, duration: 320 });
    }
  }

  get livingBlobs() {
    return this.blobs.filter((b) => !b.dying);
  }

  handleBlobDied() {
    if (this.finished) return;
    // Deferred a frame: the boss emits this from inside its own update.
    this.time.delayedCall(0, () => {
      if (this.livingBlobs.length === 0) this.onRoomCleared();
    });
  }

  onRoomCleared() {
    if (this.doorOpen || !this.door) return;
    this.doorOpen = true;
    this.door.setTexture('door_open');
    if (this.doorBlock) this.doorBlock.body.enable = false;
    this.cameras.main.flash(200, 255, 220, 120);
    this.tweens.add({ targets: this.door, scale: 1.15, duration: 200, yoyo: true });
    this.scene.get('HUD')?.showHint('THE WAY IS OPEN');

    // The exit becomes the brightest thing on screen and stays that way, so a
    // player who cleared the room while looking somewhere else still finds it.
    this.fx.ring(this.door.x, this.door.y, { tint: 0xffe08a, to: 2, duration: 700, alpha: 1 });
    this.fx.sparkleTrail(this.door.x, this.door.y, 0xffe08a, 16);
    this.doorGlow = this.add
      .image(this.door.x, this.door.y + 4, 'fx_glow')
      .setTint(0xffe08a)
      .setAlpha(0)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(this.door.y - 1)
      .setScale(1.1);
    this.tweens.add({
      targets: this.doorGlow,
      alpha: 0.6,
      scale: 1.45,
      duration: 1100,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
    if (this.fx.lightRT) this.fx.addLight(this.door, { size: 260 });
    audio.play('doorOpen');
  }

  update(time) {
    if (this.finished) return;
    this.player.update(time);
    this.blobs.forEach((b) => !b.dying && b.update(time, this.player));
    this.ghost?.update(time, this.player, this.blobs);

    this.checkSwordPickup();
    this.checkCombat(time);
    this.checkDoor();
    this.onUpdate?.(time);
    this.fx.update(time);
  }

  checkSwordPickup() {
    if (!this.swordPickup) return;
    if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.swordPickup.x, this.swordPickup.y) < 26) {
      this.player.equipSword();
      const pickup = this.swordPickup;
      this.tweens.add({
        targets: pickup,
        y: pickup.y - 30,
        alpha: 0,
        duration: 300,
        onComplete: () => pickup.destroy(),
      });
      this.swordPickup = null;
      this.swordSparkle?.remove();
      this.swordSparkle = null;
      this.tweens.add({
        targets: this.swordGlow,
        alpha: 0,
        scale: 2,
        duration: 400,
        onComplete: () => this.swordGlow?.destroy(),
      });
      audio.play('swordGet');
      this.scene.get('HUD')?.showHint(input.isTouch ? 'SWORD! TAP TO SWING' : 'SWORD! SPACE TO SWING');
    }
  }

  // The swing reaches 26px plus half a hitbox, which is far enough to cross a
  // 32px wall tile. Walk the segment between the two and refuse the hit if any
  // wall sits in the way, otherwise blobs pinned on the far side of a hedge are
  // free kills. Sampled at a quarter-tile so a full tile can never be skipped.
  hasLineOfSight(x1, y1, x2, y2) {
    const grid = this.level.grid;
    const dist = Phaser.Math.Distance.Between(x1, y1, x2, y2);
    const steps = Math.ceil(dist / (TILE / 4));
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const col = Math.floor((x1 + (x2 - x1) * t - ROOM_X) / TILE);
      const row = Math.floor((y1 + (y2 - y1) * t - ROOM_Y) / TILE);
      if (grid[row]?.[col] === '#') return false;
    }
    return true;
  }

  checkCombat(time) {
    const swinging = this.player.isSwinging(time);
    const box = swinging ? this.player.getHitbox() : null;

    this.blobs.forEach((blob) => {
      if (blob.dying) return;

      // Shared by the swing and the contact check below, so neither side of the
      // fight can hurt the other through a wall.
      const clear = this.hasLineOfSight(this.player.x, this.player.y, blob.x, blob.y);

      if (swinging && clear && !this.player.hitThisSwing.has(blob)) {
        // Test the physics body, not the sprite rect, so the per-tier hitbox
        // sizes in blobStats actually change how hard something is to land.
        const body = blob.sprite.body;
        const b = new Phaser.Geom.Rectangle(body.x, body.y, body.width, body.height);
        if (Phaser.Geom.Intersects.RectangleToRectangle(box, b)) {
          this.player.hitThisSwing.add(blob);
          blob.takeDamage(this.player.damage, this.player.x, this.player.y, time);
        }
      }

      const contact = Phaser.Math.Distance.Between(blob.x, blob.y, this.player.x, this.player.y);
      const reach = blob === this.boss ? 46 : 24;
      if (contact < reach && clear && blob.canTouch(time)) {
        blob.registerTouch(time);
        const dead = this.player.takeDamage(blob.stats.damage, blob.x, blob.y, time);
        if (dead) this.handlePlayerDown();
      }
    });
  }

  // Running out of hearts costs time, not the run — the clock is the real threat.
  handlePlayerDown() {
    runTimer.penalize(DEATH_TIME_PENALTY_MS);
    this.cameras.main.flash(400, 200, 40, 60);
    this.fx.punch(0.02, 380, 0.03);
    this.fx.ring(this.player.x, this.player.y, { tint: 0xff4d6d, to: 3, duration: 700, alpha: 1 });
    audio.duck(0.3, 900);
    audio.play('down');
    this.player.reviveAt(this.room.spawns.player.x, this.room.spawns.player.y);
    this.fx.burst(this.room.spawns.player.x, this.room.spawns.player.y, {
      tint: 0xffffff,
      scale: 1.2,
      duration: 420,
    });
    this.scene.get('HUD')?.showHint('-30 SECONDS');
  }

  checkDoor() {
    if (!this.doorOpen || !this.door || this.finished) return;
    if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.door.x, this.door.y) < 26) {
      this.finished = true;
      audio.play('uiConfirm');
      this.fx.burst(this.door.x, this.door.y, { tint: 0xffffff, scale: 2.4, duration: 400 });
      this.cameras.main.fadeOut(350, 0, 0, 0);
      this.cameras.main.once('camerafadeoutcomplete', () => {
        GameState.currentLevel += 1;
        this.scene.start(this.level.next);
      });
    }
  }

  loseToTimer() {
    if (this.finished) return;
    this.finished = true;
    audio.stopMusic(400);
    this.scene.stop('HUD');
    this.scene.start('GameOver');
  }
}

/* ---- js/scenes/levels.js ---- */

class Level1Scene extends BaseLevelScene {
  constructor() {
    super('Level1', 1);
  }

  onCreated() {
    const hud = this.scene.get('HUD');
    if (!GameState.isEasy) {
      hud?.showHint('GRAB THE SWORD', 2600);
      return;
    }
    // Explain the ghost before pointing her at the sword, or it just looks like
    // a bug the first time something else lands a hit.
    hud?.showHint('HIS GHOST CAME WITH YOU', 2400);
    this.time.delayedCall(2900, () => hud?.showHint('GRAB THE SWORD', 2600));
  }
}

class Level2Scene extends BaseLevelScene {
  constructor() {
    super('Level2', 2);
  }

  onCreated() {
    this.scene.get('HUD')?.showHint('LEVEL 2', 1600);
  }
}

class Level3Scene extends BaseLevelScene {
  constructor() {
    super('Level3', 3);
  }

  // The one room with something in it worth its own piece of music.
  musicTrack() {
    return 'boss';
  }

  onCreated() {
    // Stale from a previous run this would block the new heart from ever
    // dropping, since onRoomCleared bails when heartDrop is already set.
    this.heartDrop = null;
    this.scene.get('HUD')?.showHint('IT HAS HIS HEART', 2600);
    // Harder corners, hotter bloom and more aberration than the other dungeon
    // rooms, so the room itself reads as the fight.
    gradePostFX(this, 'boss', 1200);
    this.time.delayedCall(700, () => audio.play('roar'));
  }

  // The boss drops the heart where it dies; the exit stays shut until she has it.
  onRoomCleared() {
    if (GameState.heartRecovered || this.heartDrop) return;
    const x = this.boss ? this.boss.x : this.room.spawns.boss.x;
    const y = this.boss ? this.boss.y : this.room.spawns.boss.y;
    this.heartDrop = this.add.image(x, y, 'heart').setDepth(y).setScale(0.4);
    this.tweens.add({ targets: this.heartDrop, scale: 1, duration: 400, ease: 'Back.out' });
    this.tweens.add({
      targets: this.heartDrop,
      y: y - 8,
      duration: 700,
      yoyo: true,
      repeat: -1,
      delay: 400,
      ease: 'Sine.inOut',
    });
    this.scene.get('HUD')?.showHint('TAKE IT BACK');

    // It is the object the entire run is about, so it gets its own light and
    // keeps sparking until she picks it up.
    this.heartGlow = this.add
      .image(x, y, 'fx_glow')
      .setTint(0xff4d6d)
      .setAlpha(0.5)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y - 1)
      .setScale(0.9);
    this.tweens.add({
      targets: this.heartGlow,
      scale: 1.4,
      alpha: 0.8,
      duration: 800,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
    if (this.fx.lightRT) this.fx.addLight(this.heartDrop, { size: 260 });
    this.heartSparkle = this.time.addEvent({
      delay: 380,
      loop: true,
      callback: () => {
        if (this.heartDrop) this.fx.sparkleTrail(this.heartDrop.x, this.heartDrop.y, 0xff8fb0, 1);
      },
    });
    audio.play('sparkle');
  }

  onUpdate() {
    if (!this.heartDrop || GameState.heartRecovered) return;
    if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.heartDrop.x, this.heartDrop.y) < 28) {
      GameState.heartRecovered = true;
      this.game.events.emit(EV_HEART_TAKEN);
      this.fx.star(this.heartDrop.x, this.heartDrop.y, { tint: 0xff8fb0, scale: 1.1 });
      this.fx.sparkleTrail(this.heartDrop.x, this.heartDrop.y, 0xff8fb0, 18);
      this.fx.ring(this.heartDrop.x, this.heartDrop.y, { tint: 0xff4d6d, to: 2.2, duration: 620 });
      this.fx.tint([1, 0.6, 0.72], 0.5, 420);
      this.heartSparkle?.remove();
      this.heartGlow?.destroy();
      this.heartGlow = null;
      this.heartDrop.destroy();
      this.heartDrop = null;
      audio.play('heartGet');
      super.onRoomCleared();
      this.scene.get('HUD')?.showHint('RUN! GET BACK TO HIM');
    }
  }
}

// The final stretch: a short run back to where he fell, with the clock still going.
class ReturnScene extends BaseLevelScene {
  constructor() {
    super('Return', 'return');
  }

  // Nothing left to fight for, only distance to cover.
  musicTrack() {
    return 'chase';
  }

  onCreated(room) {
    // Left true from a previous run, onUpdate returns early forever and the
    // heart can never be delivered again.
    this.delivered = false;

    this.boy = this.add
      .image(room.spawns.boy.x, room.spawns.boy.y, 'boy_limp')
      .setAngle(-90)
      .setDepth(room.spawns.boy.y);

    this.carried = this.add
      .image(this.player.x, this.player.y - 26, 'heart')
      .setDepth(9999)
      .setScale(0.7);

    this.blanketProp = this.add
      .image(room.spawns.boy.x + 6, room.spawns.boy.y + 10, 'blanket')
      .setDepth(room.spawns.boy.y - 40)
      .setAlpha(0.9);

    // She is carrying the only light in the frame that matters. It trails
    // sparks the whole way back, so the run reads as an errand with a deadline.
    this.carriedGlow = this.add
      .image(this.player.x, this.player.y - 26, 'fx_glow')
      .setTint(0xff4d6d)
      .setAlpha(0.55)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(9998)
      .setScale(0.8);
    this.tweens.add({
      targets: this.carriedGlow,
      scale: 1.15,
      alpha: 0.8,
      duration: 620,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });
    this.carryTrail = this.time.addEvent({
      delay: 260,
      loop: true,
      callback: () => {
        if (!this.delivered) this.fx.sparkleTrail(this.carried.x, this.carried.y, 0xff8fb0, 1);
      },
    });

    // He is lying exactly where the intro left him, so mark the spot: a slow
    // pale glow that is visible from anywhere in the room.
    this.boyGlow = this.add
      .image(this.boy.x, this.boy.y, 'fx_glow')
      .setTint(0xbfd8ff)
      .setAlpha(0.24)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(this.boy.depth - 1)
      .setScale(1.4);
    this.tweens.add({
      targets: this.boyGlow,
      alpha: 0.45,
      scale: 1.8,
      duration: 1500,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });

    this.scene.get('HUD')?.showHint('PUT IT BACK', 2600);
  }

  // The door here is the boy himself — no exit to unlock.
  onRoomCleared() {}

  onUpdate() {
    this.carried.setPosition(this.player.x, this.player.y - 26);
    this.carriedGlow?.setPosition(this.player.x, this.player.y - 26);
    if (this.delivered) return;
    if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boy.x, this.boy.y) < 30) {
      this.deliverHeart();
    }
  }

  deliverHeart() {
    this.delivered = true;
    this.finished = true;
    runTimer.stop();
    this.player.freeze();
    this.carryTrail?.remove();
    audio.play('heartGet');

    this.tweens.add({
      targets: [this.carried, this.carriedGlow],
      x: this.boy.x,
      y: this.boy.y,
      scale: 1.4,
      duration: 520,
      ease: 'Quad.in',
      onComplete: () => {
        this.cameras.main.flash(400, 255, 160, 190);
        // The moment the whole run has been for: everything goes off at once.
        this.fx.tint([1, 0.75, 0.85], 0.85, 700);
        this.fx.ring(this.boy.x, this.boy.y, { tint: 0xff8fb0, to: 4, duration: 900, alpha: 1 });
        this.fx.star(this.boy.x, this.boy.y, { tint: 0xffffff, scale: 2 });
        this.fx.sparkleTrail(this.boy.x, this.boy.y, 0xff8fb0, 40);
        this.fx.punch(0.01, 400, 0.02);
        audio.duck(0.25, 1200);
        audio.play('win');
        this.carried.destroy();
        this.carriedGlow?.destroy();
        this.time.delayedCall(500, () => {
          this.scene.stop('HUD');
          this.scene.start('Win');
        });
      },
    });
  }
}

/* ---- js/scenes/JoryLevelScene.js ---- */

const WAVE_GAP_MS = 2200;
const BOSS_GAP_MS = 2600;

// The whole "I love you Jory" run in one room: five waves, then the boss, then
// the chest. No clock and no way to lose — the only exit is through.
class JoryLevelScene extends BaseLevelScene {
  constructor() {
    super('JoryLevel', 'jory');
  }

  getLevel() {
    return { theme: 'dungeon', grid: JORY_ARENA };
  }

  musicTrack() {
    return 'arena';
  }

  // Waves own the spawning, so the room starts empty.
  spawnEnemies() {}

  // No door in here, and nothing to unlock until the boss is down.
  onRoomCleared() {}

  // No clock to punish her with, so going down just costs her position.
  handlePlayerDown() {
    this.cameras.main.flash(400, 200, 40, 60);
    this.fx.punch(0.02, 380, 0.03);
    this.fx.ring(this.player.x, this.player.y, { tint: 0xff4d6d, to: 3, duration: 700, alpha: 1 });
    audio.play('down');
    this.player.reviveAt(this.room.spawns.player.x, this.room.spawns.player.y);
    this.fx.burst(this.room.spawns.player.x, this.room.spawns.player.y, {
      tint: 0xffffff,
      scale: 1.2,
      duration: 420,
    });
    this.scene.get('HUD')?.showHint('GET UP!');
  }

  loseToTimer() {}

  onCreated() {
    GameState.hasSword = true;
    this.player.equipSword();

    this.wave = 0;
    this.waveActive = false;
    this.bossSpawned = false;
    this.finaleStarted = false;
    this.chestOpened = false;
    this.allies = [];
    this.powerUp = null;
    this.chest = null;

    this.shieldRing = this.add.image(this.player.x, this.player.y, 'shield_ring');
    this.shieldRing.setVisible(false).setDepth(9998).setAlpha(0.75).setTint(0x9fd8ff);

    this.powerTimer = this.time.addEvent({
      delay: POWERUP_INTERVAL_MS,
      loop: true,
      callback: () => this.spawnPowerUp(),
    });

    this.scene.get('HUD')?.showHint('FIVE WAVES. THEN THE CHEST.', 2600);
    this.time.delayedCall(2400, () => this.startWave(1));
  }

  // ---- waves -------------------------------------------------------------

  startWave(n) {
    this.wave = n;
    this.waveActive = true;
    this.game.events.emit(EV_WAVE_CHANGED, n, WAVES.length);
    this.scene.get('HUD')?.showHint(`WAVE ${n}`, 1600);
    this.cameras.main.flash(200, 90, 40, 120);
    this.fx.tint([0.6, 0.25, 0.9], 0.35, 400);
    audio.play('waveStart');

    const plan = WAVES[n - 1];
    const spots = Phaser.Utils.Array.Shuffle([...SPAWN_TILES]);
    let i = 0;

    Object.entries(plan).forEach(([tier, count]) => {
      for (let k = 0; k < count; k++) {
        const spot = spots[i % spots.length];
        i += 1;
        // Jitter within the tile so a stack of six does not spawn on one point.
        const world = tileToWorld(spot.col, spot.row);
        const x = world.x + Phaser.Math.Between(-10, 10);
        const y = world.y + Phaser.Math.Between(-10, 10);
        this.time.delayedCall(k * 130, () => {
          if (this.finished) return;
          const blob = this.addBlob(x, y, tier, joryStats(tier));
          blob.sprite.setScale(0.3);
          this.tweens.add({ targets: blob.sprite, scale: 1, duration: 260, ease: 'Back.out' });
          this.fx.burst(x, y, { tint: blob.tint, scale: 0.9, duration: 300 });
          this.fx.ring(x, y, { tint: blob.tint, to: 0.6, duration: 340 });
          audio.play('spawn');
        });
      }
    });
  }

  // Base spawns straight from level data; here every blob needs the buffed
  // stats, so the override threads them through.
  addBlob(x, y, tier, stats = null) {
    const blob = super.addBlob(x, y, tier, stats ?? joryStats(tier));
    return blob;
  }

  handleBlobDied() {
    if (this.finished) return;
    this.time.delayedCall(0, () => {
      // The boss falling ends the fight outright. Anything still on the floor
      // was summoned by it and dies with it, so the light comes down the moment
      // she kills it rather than after a mop-up.
      if (this.bossSpawned && this.boss?.dying && !this.finaleStarted) {
        // Claimed before killing the rest, because each death re-enters here.
        this.finaleStarted = true;
        this.livingBlobs.forEach((b) => {
          if (b !== this.boss) b.die();
        });
        this.beginFinale();
        return;
      }

      if (this.livingBlobs.length > 0) return;
      this.blobs = this.blobs.filter((b) => !b.dying);

      if (!this.waveActive) return;
      this.waveActive = false;

      if (this.wave >= WAVES.length) {
        this.scene.get('HUD')?.showHint('SOMETHING ELSE IS COMING', 2200);
        this.time.delayedCall(BOSS_GAP_MS, () => this.spawnBoss());
      } else {
        this.time.delayedCall(WAVE_GAP_MS, () => this.startWave(this.wave + 1));
      }
    });
  }

  spawnBoss() {
    if (this.finished || this.bossSpawned) return;
    this.bossSpawned = true;

    const spot = tileToWorld(5, 3);
    this.boss = new FinalBoss(this, spot.x, spot.y);
    this.boss.onSpawnMinion = (b, count) => this.spawnBossMinions(b, count);
    this.boss.onSlam = (b, radius) => this.bossSlam(b, radius);
    this.blobs.push(this.boss);
    this.physics.add.collider(this.boss.sprite, this.room.walls);

    this.boss.sprite.setScale(0.2);
    this.tweens.add({ targets: this.boss.sprite, scale: 1, duration: 520, ease: 'Back.out' });
    this.cameras.main.shake(700, 0.014);
    this.cameras.main.flash(400, 160, 30, 90);

    // The room itself darkens around it — the arena stops being a place to
    // fight in and becomes part of the thing you are fighting.
    gradePostFX(this, 'boss', 1400);
    this.fx.lightAlpha = 0.85;
    this.fx.addLight(this.boss.sprite, { size: 260, flicker: true });
    this.fx.ring(spot.x, spot.y, { tint: 0xff2a5c, to: 4, duration: 900, alpha: 1 });
    this.fx.smoke(spot.x, spot.y, 18, 0x33061a);
    this.fx.tint([1, 0.2, 0.4], 0.6, 700);
    audio.duck(0.2, 1600);
    audio.play('roar');

    this.game.events.emit(EV_WAVE_CHANGED, 'BOSS', WAVES.length);
    this.scene.get('HUD')?.showHint('KILL IT', 2200);
  }

  spawnBossMinions(boss, count) {
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const x = boss.x + Math.cos(angle) * 56;
      const y = boss.y + Math.sin(angle) * 56;
      const blob = this.addBlob(x, y, 'medium');
      blob.sprite.setScale(0.3);
      this.tweens.add({ targets: blob.sprite, scale: 1, duration: 280, ease: 'Back.out' });
      this.fx.burst(x, y, { tint: 0x9a5cff, scale: 1, duration: 340 });
      this.fx.ring(x, y, { tint: 0x9a5cff, to: 0.7, duration: 380 });
    }
  }

  // A ring rather than a line: standing still next to it is the mistake.
  bossSlam(boss, radius) {
    this.cameras.main.shake(320, 0.018);
    const ring = this.add.ellipse(boss.x, boss.y + 10, 40, 20, 0xff4d6d, 0);
    ring.setStrokeStyle(4, 0xff4d6d, 0.9).setDepth(boss.y - 1);
    this.tweens.add({
      targets: ring,
      scaleX: (radius * 2) / 40,
      scaleY: (radius * 2) / 40 / 2,
      alpha: 0,
      duration: 420,
      onComplete: () => ring.destroy(),
    });
    // A second, brighter wave over the top of the outline, plus the dust it
    // kicks up, so the reach of the attack is unmissable.
    this.fx.ring(boss.x, boss.y + 10, {
      tint: 0xff9a2a,
      to: (radius * 2) / 192,
      duration: 440,
      alpha: 1,
    });
    this.fx.dust(boss.x, boss.y + 16, 14, 0x8a6a4a);
    this.fx.punch(0.006, 200, 0.014);

    const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, boss.x, boss.y + 10);
    if (dist < radius) {
      const dead = this.player.takeDamage(boss.stats.damage, boss.x, boss.y, this.time.now);
      if (dead) this.handlePlayerDown();
    }
  }

  // ---- power-ups ---------------------------------------------------------

  // One at a time, on open floor, and never dropped in her lap.
  spawnPowerUp() {
    if (this.finished || this.finaleStarted || this.powerUp) return;
    const grid = this.level.grid;
    for (let tries = 0; tries < 40; tries++) {
      const col = Phaser.Math.Between(1, grid[0].length - 2);
      const row = Phaser.Math.Between(1, grid.length - 2);
      if (grid[row][col] === '#') continue;
      const world = tileToWorld(col, row);
      if (Phaser.Math.Distance.Between(world.x, world.y, this.player.x, this.player.y) < 90) continue;
      this.powerUp = new PowerUp(this, world.x, world.y, rollPowerUp());
      return;
    }
  }

  applyPowerUp(def, time) {
    const hud = this.scene.get('HUD');
    const px = this.player.x;
    const py = this.player.y;
    audio.play('pickup');

    switch (def.key) {
      case 'heal':
        GameState.playerHp = PLAYER_MAX_HP;
        this.game.events.emit(EV_HEALTH_CHANGED, GameState.playerHp);
        this.cameras.main.flash(260, 255, 120, 150);
        this.fx.ring(px, py, { tint: 0xff8fb0, to: 1.4, duration: 520, flat: false });
        this.fx.sparkleTrail(px, py, 0xff8fb0, 16);
        audio.play('heal');
        break;

      case 'shield':
        this.player.shieldUntil = time + SHIELD_MS;
        this.cameras.main.flash(260, 140, 220, 255);
        this.fx.ring(px, py, { tint: 0x9fd8ff, to: 1.2, duration: 520, flat: false });
        audio.play('shieldUp');
        break;

      case 'ally':
        for (let i = 0; i < ALLY_COUNT; i++) {
          this.allies.push(new AlliedBlob(this, px, py, i, ALLY_COUNT));
          this.fx.burst(px, py, { tint: 0x4aa8ee, scale: 1.1, duration: 380 });
        }
        this.fx.ring(px, py, { tint: 0x4aa8ee, to: 1.6, duration: 560 });
        audio.play('summon');
        break;

      case 'nuke': {
        // The horde only — the boss is the fight, not part of the crowd.
        const doomed = this.livingBlobs.filter((b) => b !== this.boss);
        this.cameras.main.flash(500, 255, 240, 180);
        this.cameras.main.shake(500, 0.02);
        this.fx.tint([1, 0.96, 0.75], 0.95, 900);
        this.fx.ring(px, py, { tint: 0xfff6d0, to: 6, duration: 900, alpha: 1 });
        this.fx.punch(0.02, 500, 0.04);
        audio.duck(0.2, 1400);
        audio.play('nuke');
        doomed.forEach((b) => b.die());
        break;
      }
    }
    if (def.label) hud?.showHint(def.label, 1800);
  }

  // ---- the chest ---------------------------------------------------------

  // Only ever called from handleBlobDied, which owns the finaleStarted claim.
  beginFinale() {
    this.finaleStarted = true;
    this.powerTimer?.remove();
    this.powerUp?.destroy();
    this.powerUp = null;

    // The fight is over, so the arena stops being a boss room: the darkness
    // lifts, the grade warms back up, and the music changes underneath it.
    gradePostFX(this, 'meadow', 1600);
    this.tweens.add({ targets: this.fx, lightAlpha: 0.22, duration: 1800, ease: 'Sine.inOut' });
    audio.music('flowers');

    const mid = tileToWorld(5, 9);
    this.time.delayedCall(900, () => {
      this.cameras.main.flash(700, 255, 250, 220);
      this.fx.addLight(mid, { size: 320 });
      this.fx.ring(mid.x, mid.y, { tint: 0xfff6d0, to: 4, duration: 1200, alpha: 1 });
      audio.play('chest');

      // A column of light dropped onto the middle of the arena.
      const beam = this.add.rectangle(mid.x, mid.y - 300, 96, 640, 0xfff6d0, 0);
      beam.setDepth(mid.y - 2);
      this.tweens.add({ targets: beam, fillAlpha: 0.35, duration: 700 });
      this.tweens.add({
        targets: beam,
        fillAlpha: 0.16,
        duration: 1400,
        delay: 700,
        yoyo: true,
        repeat: -1,
      });

      // Purple aura under it, breathing.
      this.aura = this.add.ellipse(mid.x, mid.y + 12, 112, 52, 0x8f6bb0, 0.55);
      this.aura.setDepth(mid.y - 1);
      this.tweens.add({
        targets: this.aura,
        scaleX: 1.25,
        scaleY: 1.25,
        alpha: 0.28,
        duration: 1200,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.inOut',
      });

      this.chest = this.add.image(mid.x, mid.y, 'chest_closed').setDepth(mid.y).setScale(0);
      this.tweens.add({ targets: this.chest, scale: 1, duration: 620, ease: 'Back.out' });

      // Motes rising out of the beam for as long as it stands there.
      this.chestMotes = this.add.particles(mid.x, mid.y + 10, 'fx_dot', {
        x: { min: -46, max: 46 },
        speedY: { min: -60, max: -20 },
        speedX: { min: -8, max: 8 },
        lifespan: { min: 1400, max: 2600 },
        scale: { start: 0.24, end: 0 },
        alpha: { start: 0.9, end: 0 },
        tint: [0xfff6d0, 0xffe08a, 0xffffff],
        blendMode: 'ADD',
        frequency: 130,
      });
      this.chestMotes.setDepth(mid.y + 2);

      this.time.delayedCall(700, () => {
        this.scene.get('HUD')?.showHint('USE THE KEY', 3000);
      });
    });
  }

  openChest() {
    this.chestOpened = true;
    this.finished = true;
    // Earned for good. From here the title screen carries an inventory and the
    // book can be read again without fighting through the waves for it.
    GameState.chestOpened = true;
    GameState.saveUnlocks();
    this.player.freeze();
    this.chest.setTexture('chest_open');
    this.cameras.main.flash(600, 255, 245, 210);
    this.fx.tint([1, 0.97, 0.85], 0.8, 900);
    this.fx.ring(this.chest.x, this.chest.y, { tint: 0xfff6d0, to: 5, duration: 1100, alpha: 1 });
    this.fx.star(this.chest.x, this.chest.y - 20, { tint: 0xffffff, scale: 2.2, duration: 900 });
    this.fx.sparkleTrail(this.chest.x, this.chest.y, 0xfff6d0, 40);
    audio.duck(0.2, 1800);
    audio.play('chest');

    // Two things come out, and they part as they rise so neither is hidden
    // behind the other on the way up.
    [
      { key: 'book', dx: -30 },
      { key: 'ring', dx: 30 },
    ].forEach(({ key, dx }, i) => {
      const item = this.add
        .image(this.chest.x, this.chest.y, key)
        .setDepth(this.chest.y + 10)
        .setScale(0.4);
      this.tweens.add({
        targets: item,
        x: this.chest.x + dx,
        y: this.chest.y - 46,
        scale: 1.3,
        duration: 900,
        ease: 'Quad.out',
      });
      // Out of phase, so the pair does not sway as one object.
      this.tweens.add({
        targets: item,
        angle: { from: -4, to: 4 },
        duration: 1400,
        yoyo: true,
        repeat: -1,
        delay: 900 + i * 260,
        ease: 'Sine.inOut',
      });
    });

    this.time.delayedCall(2100, () => {
      this.cameras.main.fadeOut(700, 255, 255, 255);
      this.cameras.main.once('camerafadeoutcomplete', () => {
        this.scene.stop('HUD');
        this.scene.start('Book');
      });
    });
  }

  // ---- per-frame ---------------------------------------------------------

  onUpdate(time) {
    // Shield ring rides along and vanishes with the effect.
    const shielded = this.player.isShielded(time);
    this.shieldRing.setVisible(shielded);
    if (shielded) {
      this.shieldRing
        .setPosition(this.player.x, this.player.y)
        .setDepth(this.player.y + 3)
        .setAlpha(this.player.shieldUntil - time < 3000 && Math.floor(time / 140) % 2 ? 0.25 : 0.75);
    }

    this.allies = this.allies.filter((ally) => {
      if (ally.expired) {
        ally.destroy();
        return false;
      }
      ally.update(time, this.player, this.blobs);
      return true;
    });

    if (this.powerUp) {
      if (this.powerUp.update(time, this.player)) {
        this.powerUp.collect();
        this.applyPowerUp(this.powerUp.def, time);
        this.powerUp = null;
      } else if (this.powerUp.lapsed) {
        this.powerUp.destroy();
        this.powerUp = null;
      }
    }

    if (this.chest && !this.chestOpened) {
      if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.chest.x, this.chest.y) < 34) {
        this.openChest();
      }
    }
  }
}

// How often they kiss when nobody is telling a story.
const KISS_EVERY_MS = 30000;
// Long enough after the fade-in that the meadow gets to be the first thing you
// notice, short enough that you do not sit there wondering if anything happens.
const FIRST_KISS_MS = 4000;

// The same meadow as the "I love you Jory" opening with the script taken out:
// the picnic, the pond, the cats, the weather and the two of them, and nothing
// that asks anything of you. Everything on screen is built by JoryIntroScene —
// this only decides what happens once it is standing.
class GardenScene extends JoryIntroScene {
  constructor() {
    super('Garden');
  }

  // Deliberately does not touch GameState. The Jory opening sets the difficulty
  // because a run follows it; nothing follows this, and a free-roam garden that
  // quietly rewrote the save would be a nasty surprise.
  setupMode() {}

  // Same place the story puts its skip hint, and dimmer — there is no hurry to
  // leave, so it should sit quietly at the bottom of the meadow.
  //
  // The two controls are the only interface the garden has. The camera is
  // zoomed, so "the corners of the screen" are the corners of JI_VIEW rather
  // than of the canvas.
  buildOverlay() {
    this.backHint = new PixelText(this, JI_FX, JI_VIEW.bottom - 24, 'TAP TO GO BACK', {
      scale: 1,
      color: 0xffffff,
    });
    this.backHint.setAlpha(0.45).setDepth(2000);

    this.volumeUI = new VolumeSlider(this, JI_VIEW.left + 12, JI_VIEW.top + 26);
    this.picker = new MusicPicker(this, JI_VIEW.right - 34, JI_VIEW.top + 26);

    // `currentlyOver` is what keeps the controls usable: without it every tap
    // on the slider or the song list would also be a tap on the meadow, and
    // the meadow's job is to leave.
    this.input.on('pointerdown', (pointer, over) => {
      if (over.length) return;
      // An open list eats the first tap outside it, so dismissing the menu
      // never doubles as walking out of the garden.
      if (this.picker?.isOpen) {
        this.picker.close();
        return;
      }
      this.finish();
    });
    this.input.keyboard.once('keydown-ESC', () => this.finish());
    this.input.keyboard.once('keydown-SPACE', () => this.finish());
    this.input.keyboard.once('keydown-ENTER', () => this.finish());
  }

  // One kiss shortly after arriving, then every thirty seconds. The loop is
  // started by the first one rather than run alongside it, so the gap between
  // the first and second is a full interval like every gap after it.
  begin() {
    this.time.delayedCall(FIRST_KISS_MS, () => {
      this.playKiss();
      this.kissLoop = this.time.addEvent({
        delay: KISS_EVERY_MS,
        loop: true,
        callback: () => this.playKiss(),
      });
    });
  }

  // No director and no HUD to shut down here, and nothing to hand off to —
  // this goes back where it came from.
  finish() {
    if (this.done) return;
    this.done = true;
    this.kissLoop?.remove();
    this.picker?.destroy();
    this.volumeUI?.destroy();
    audio.play('uiBack');
    this.cameras.main.fadeOut(400, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Menu'));
  }
}
