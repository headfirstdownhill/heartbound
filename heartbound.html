const FONT_CHARS = Object.keys(GLYPHS);
const FONT_FRAMES = FONT_CHARS.map((c) => GLYPHS[c]);
const FONT_INDEX = Object.fromEntries(FONT_CHARS.map((c, i) => [c, i]));
const GLYPH_W = 5;
const GLYPH_H = 7;

// A real bold, thickened in the glyph grid rather than by drawing the text
// twice at an offset. Faking it on screen needs a fractional scale to stay
// small, and a fractional scale on a pixel font just turns to mush — this
// stays on the pixel grid, so it renders crisp at scale 1.
function embolden(rows) {
  return rows.map((row) => {
    const src = `${row}.`;
    let out = '';
    for (let x = 0; x < src.length; x++) {
      out += src[x] === 'w' || (x > 0 && src[x - 1] === 'w') ? 'w' : '.';
    }
    return out;
  });
}

function upscale2x(rows) {
  const out = [];
  rows.forEach((row) => {
    let wide = '';
    for (const ch of row) wide += ch + ch;
    out.push(wide, wide);
  });
  return out;
}

// Semi-bold, not bold. Thickening the 5x7 grid directly turns a 1-pixel stroke
// into a 2-pixel one — that is double the weight and reads as bulky. Doubling
// the grid first makes the stroke 2 pixels, so the same thickening step lands
// on 3: heavier than regular, well short of bold.
const FONT_FRAMES_SEMI = FONT_FRAMES.map((frame) => embolden(upscale2x(frame)));
const GLYPH_W_SEMI = GLYPH_W * 2 + 1;
const GLYPH_H_SEMI = GLYPH_H * 2;

/* ---- js/gfx/PixelText.js ---- */

const FONT_KEY = 'font';
const FONT_KEY_SEMI = 'font_semi';
const FONT_PX = 2; // pixel size the regular font sheet was generated at
const FONT_PX_SEMI = 1; // the semi-bold grid is already double scale

// Each weight carries its own metrics, because the semi-bold sheet is drawn on
// a doubled grid at half the pixel size — the two end up nearly the same size
// on screen, which is the point.
const WEIGHTS = {
  regular: { key: FONT_KEY, gw: GLYPH_W, gh: GLYPH_H, px: FONT_PX, gap: 1 },
  semibold: { key: FONT_KEY_SEMI, gw: GLYPH_W_SEMI, gh: GLYPH_H_SEMI, px: FONT_PX_SEMI, gap: 2 },
};

// A run of glyph Images kept in a Container, so text can be tinted, scaled and
// tweened as one object and re-set cheaply (the HUD clock rewrites every second).
class PixelText {
  constructor(scene, x, y, text, opts = {}) {
    const { scale = 1, color = 0xffffff, align = 'center', maxWidth = null, bold = false } = opts;
    const weight = WEIGHTS[bold ? 'semibold' : 'regular'];
    const { spacing = weight.gap } = opts;
    this.scene = scene;
    this.scale = scale;
    this.bold = bold;
    this.fontKey = weight.key;
    this.fontPx = weight.px;
    // Long strings shrink to fit rather than running off a phone screen.
    this.maxWidth = maxWidth ?? scene.scale.width - 20;
    this.spacing = spacing;
    this.align = align;
    this.color = color;
    this.glyphW = weight.gw * weight.px;
    this.glyphH = weight.gh * weight.px;
    this.container = scene.add.container(x, y);
    this.pool = [];
    this.setText(text);
  }

  setText(text) {
    const chars = String(text).toUpperCase().split('');
    while (this.pool.length < chars.length) {
      const img = this.scene.add.image(0, 0, this.fontKey, 0).setOrigin(0, 0.5);
      this.container.add(img);
      this.pool.push(img);
    }
    const unit = this.glyphW + this.spacing * this.fontPx;
    const rawWidth = chars.length * unit - this.spacing * this.fontPx;
    const scale = Math.min(this.scale, rawWidth > 0 ? this.maxWidth / rawWidth : this.scale);
    const step = unit * scale;
    const width = rawWidth * scale;
    const startX = this.align === 'center' ? -width / 2 : this.align === 'right' ? -width : 0;

    this.pool.forEach((img, i) => {
      if (i >= chars.length) {
        img.setVisible(false);
        return;
      }
      const frame = FONT_INDEX[chars[i]] ?? FONT_INDEX[' '];
      img.setVisible(true).setFrame(frame).setScale(scale).setTint(this.color);
      img.x = startX + i * step;
      img.y = 0;
    });
    this.width = width;
    this.height = this.glyphH * scale;
    return this;
  }

  setTint(color) {
    this.color = color;
    this.pool.forEach((img) => img.setTint(color));
    return this;
  }

  setPosition(x, y) {
    this.container.setPosition(x, y);
    return this;
  }

  setDepth(d) {
    this.container.setDepth(d);
    return this;
  }

  setAlpha(a) {
    this.container.setAlpha(a);
    return this;
  }

  destroy() {
    this.container.destroy();
  }
}

/* ---- js/systems/Fx.js ---- */

// The juice layer. One of these is built per scene and hung on `scene.fx`, so
// anything in the scene can ask for sparks, shockwaves, dust or a camera punch
// without knowing how any of it is made.
//
// Emitters are created once and reused. Phaser will happily let you spawn a new
// ParticleEmitter for every sword swing, and on a phone that is exactly how you
// end up with a garbage-collection stutter in the middle of a fight.

const SHADOW_ALPHA = 0.45;

// Particles that fade in and back out over their life. Phaser's alpha ramp only
// runs start-to-end, so a mote emitted at full alpha pops into existence; this
// drives it from the particle's own age instead.
function breatheAlpha(peak) {
  return { onUpdate: (particle, key, t) => peak * Math.sin(Math.PI * t) };
}

class SceneFx {
  constructor(scene) {
    this.scene = scene;
    this.pool = {};
    this.shadows = [];
    this.lights = [];
    this.lightRT = null;
    this.lightColor = 0x090612;
    this.lightAlpha = 0.82;
    this.lightOrigin = { x: 0, y: 0 };
    this.nodes = [];
    // Cameras outlive a scene restart, so a zoom cached by a previous run has
    // to be dropped or the first punch of the new one snaps to the old value.
    if (scene.cameras?.main) scene.cameras.main._fxBaseZoom = undefined;
    scene.events.once('shutdown', () => this.destroy());
  }

  // ---- emitter pool -------------------------------------------------------

  emitter(key, texture, config) {
    // A looping scene timer can fire in the same frame the scene is torn down —
    // the title screen's heart sparkle does exactly that on the way out. By
    // then the pool has been emptied, so without this we would ask Phaser for a
    // brand new emitter on a dying scene and it would throw from inside its own
    // renderer. Callers use `?.` so a dead pool is simply a no-op.
    if (this.dead) return null;
    if (this.pool[key]) return this.pool[key];
    const e = this.scene.add.particles(0, 0, texture, { emitting: false, ...config });
    this.pool[key] = e;
    return e;
  }

  // ---- combat -------------------------------------------------------------

  // White-hot sparks off a landed sword hit. Fast, short-lived and additive, so
  // they read as light rather than as debris.
  hitSpark(x, y, tint = 0xfff2c4, count = 7) {
    const e = this.emitter('spark', 'fx_shard', {
      speed: { min: 90, max: 260 },
      lifespan: { min: 140, max: 300 },
      scale: { start: 0.9, end: 0.05 },
      alpha: { start: 1, end: 0 },
      rotate: { min: 0, max: 360 },
      blendMode: 'ADD',
    });
    if (!e) return;
    e.setParticleTint(tint);
    e.setDepth(y + 30);
    e.explode(count, x, y);
    this.burst(x, y, { tint, scale: 0.55, duration: 160, alpha: 0.8 });
  }

  // Wet, heavy, and it falls — the opposite of the sparks, on purpose, so a
  // blob coming apart never looks like metal.
  gooBurst(x, y, tint = 0x7ed957, count = 12) {
    const e = this.emitter('goo', 'fx_dot', {
      speed: { min: 40, max: 190 },
      lifespan: { min: 320, max: 640 },
      scale: { start: 0.7, end: 0.1 },
      alpha: { start: 0.95, end: 0 },
      gravityY: 320,
      angle: { min: 200, max: 340 },
    });
    if (!e) return;
    e.setParticleTint(tint);
    e.setDepth(y + 20);
    e.explode(count, x, y);
  }

  // What a blob leaves behind. Sits under everything and fades on its own.
  splat(x, y, tint = 0x7ed957) {
    const s = this.scene.add
      .image(x, y + 6, 'fx_glow_soft')
      .setDepth(1)
      .setTint(tint)
      .setAlpha(0.5)
      .setScale(0.42, 0.2);
    this.scene.tweens.add({
      targets: s,
      alpha: 0,
      scaleX: 0.55,
      duration: 2600,
      ease: 'Quad.in',
      onComplete: () => s.destroy(),
    });
  }

  // An expanding ring. Every impact in the game gets one; the colour and the
  // speed are what tell them apart. Flat by default, because the game is seen
  // from above and a perfect circle reads as a bubble rather than a shockwave.
  ring(x, y, opts = {}) {
    const {
      tint = 0xffffff,
      from = 0.1,
      to = 1.2,
      duration = 380,
      alpha = 0.9,
      thin = false,
      depth = null,
      flat = true,
    } = opts;
    const r = this.scene.add
      .image(x, y, thin ? 'fx_ring_thin' : 'fx_ring')
      .setTint(tint)
      .setAlpha(alpha)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(depth ?? y + 25);
    r.setScale(from, from * (flat ? 0.45 : 1));
    this.scene.tweens.add({
      targets: r,
      scaleX: to,
      scaleY: to * (flat ? 0.45 : 1),
      alpha: 0,
      duration,
      ease: 'Cubic.out',
      onComplete: () => r.destroy(),
    });
    return r;
  }

  // A brief bloom of light. Used everywhere something appears or dies.
  burst(x, y, opts = {}) {
    const { tint = 0xffffff, scale = 1.2, duration = 320, alpha = 0.9, depth = null } = opts;
    const g = this.scene.add
      .image(x, y, 'fx_glow')
      .setTint(tint)
      .setAlpha(alpha)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(depth ?? y + 26)
      .setScale(scale * 0.3);
    this.scene.tweens.add({
      targets: g,
      scale,
      alpha: 0,
      duration,
      ease: 'Quad.out',
      onComplete: () => g.destroy(),
    });
    return g;
  }

  // Pops open, then closes and spins away.
  star(x, y, opts = {}) {
    const { tint = 0xfff6d0, scale = 0.5, duration = 420, angle = 0 } = opts;
    const s = this.scene.add
      .image(x, y, 'fx_star')
      .setTint(tint)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y + 40)
      .setScale(0)
      .setAngle(angle);
    this.scene.tweens.add({
      targets: s,
      scale,
      duration: duration * 0.35,
      ease: 'Back.out',
      onComplete: () => {
        this.scene.tweens.add({
          targets: s,
          scale: 0,
          angle: angle + 90,
          duration: duration * 0.65,
          ease: 'Quad.in',
          onComplete: () => s.destroy(),
        });
      },
    });
    return s;
  }

  sparkleTrail(x, y, tint = 0xfff6d0, count = 4) {
    const e = this.emitter('sparkle', 'fx_dot', {
      speed: { min: 10, max: 60 },
      lifespan: { min: 400, max: 900 },
      scale: { start: 0.35, end: 0 },
      alpha: { start: 1, end: 0 },
      gravityY: -30,
      blendMode: 'ADD',
    });
    if (!e) return;
    e.setParticleTint(tint);
    e.setDepth(y + 35);
    e.explode(count, x, y);
  }

  // Kicked up under her feet and off anything that lands hard.
  dust(x, y, count = 4, tint = 0xbfae94) {
    const e = this.emitter('dust', 'fx_smoke', {
      speed: { min: 12, max: 46 },
      lifespan: { min: 260, max: 520 },
      scale: { start: 0.18, end: 0.42 },
      alpha: { start: 0.4, end: 0 },
      angle: { min: 200, max: 340 },
    });
    if (!e) return;
    e.setParticleTint(tint);
    e.setDepth(y - 1);
    e.explode(count, x, y);
  }

  smoke(x, y, count = 6, tint = 0x4a3a5c) {
    const e = this.emitter('smoke', 'fx_smoke', {
      speed: { min: 20, max: 70 },
      lifespan: { min: 500, max: 1100 },
      scale: { start: 0.3, end: 0.9 },
      alpha: { start: 0.55, end: 0 },
      angle: { min: 240, max: 300 },
    });
    if (!e) return;
    e.setParticleTint(tint);
    e.setDepth(y + 5);
    e.explode(count, x, y);
  }

  // The crescent that follows the sword through its arc.
  slashArc(x, y, facing, tint = 0xffffff) {
    const angles = { down: 90, up: 270, left: 180, right: 0 };
    const a = angles[facing] ?? 90;
    const arc = this.scene.add
      .image(x, y, 'fx_arc')
      .setTint(tint)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y + 30)
      .setAngle(a - 55)
      .setScale(0.34)
      .setAlpha(0.95);
    this.scene.tweens.add({
      targets: arc,
      angle: a + 55,
      scale: 0.62,
      alpha: 0,
      duration: 190,
      ease: 'Quad.out',
      onComplete: () => arc.destroy(),
    });
    return arc;
  }

  // Small, brief and jittered sideways, so a flurry of hits does not stack four
  // identical numbers on one pixel.
  //
  // Drawn twice: a near-black copy one pixel down-right, then the real one over
  // it. Cream numerals on their own vanish against sunlit grass, and a number
  // you cannot read is worse than no number at all.
  damageNumber(x, y, amount, tint = 0xfff2c4, big = false) {
    const scale = big ? 2 : 1;
    const ox = x + Phaser.Math.Between(-7, 7);
    const label = String(Math.round(amount));
    const shadow = new PixelText(this.scene, ox + scale * 2, y - 12 + scale * 2, label, {
      scale,
      color: 0x1a1420,
    });
    const t = new PixelText(this.scene, ox, y - 12, label, { scale, color: tint });
    shadow.setDepth(9499);
    t.setDepth(9500);
    this.scene.tweens.add({
      targets: [t.container, shadow.container],
      y: y - (big ? 44 : 34),
      alpha: 0,
      duration: big ? 800 : 620,
      ease: 'Quad.out',
      onComplete: () => {
        t.destroy();
        shadow.destroy();
      },
    });
    return t;
  }

  // ---- camera -------------------------------------------------------------

  // Shake plus a momentary zoom-in. The zoom is what makes a hit land; shake on
  // its own just makes the screen noisy.
  punch(intensity = 0.006, ms = 140, zoom = 0.012) {
    const cam = this.scene.cameras.main;
    if (!cam) return;
    cam.shake(ms, intensity);
    if (!zoom) return;
    if (cam._fxBaseZoom === undefined) cam._fxBaseZoom = cam.zoom;
    const base = cam._fxBaseZoom;
    this.scene.tweens.killTweensOf(cam);
    cam.zoom = base * (1 + zoom);
    this.scene.tweens.add({ targets: cam, zoom: base, duration: ms * 1.8, ease: 'Quad.out' });
  }

  // Full-frame colour wash through the post pipeline rather than the camera's
  // own flash, so it sits under the vignette instead of over it. Falls back to
  // the camera flash wherever the pipeline is not available.
  tint(color = [1, 1, 1], amount = 0.45, ms = 220) {
    const pipe = this.scene.postFX;
    if (!pipe) {
      this.scene.cameras.main?.flash(ms, color[0] * 255, color[1] * 255, color[2] * 255);
      return;
    }
    pipe.flashColor = color;
    pipe.flashAmount = amount;
    this.scene.tweens.add({ targets: pipe, flashAmount: 0, duration: ms, ease: 'Quad.out' });
  }

  // ---- shadows ------------------------------------------------------------

  // Every sprite that stands on the floor gets one. They are tracked here and
  // updated in one pass rather than by each entity, so nothing has to remember
  // to clean up after itself.
  attachShadow(sprite, opts = {}) {
    const { scaleX = 0.42, scaleY = 0.42, offsetY = 2, alpha = SHADOW_ALPHA } = opts;
    const img = this.scene.add
      .image(sprite.x, sprite.y + offsetY, 'fx_shadow')
      .setAlpha(alpha)
      .setScale(scaleX, scaleY);
    const entry = { img, sprite, offsetY, scaleX, scaleY, alpha };
    this.shadows.push(entry);
    return entry;
  }

  updateShadows() {
    for (let i = this.shadows.length - 1; i >= 0; i--) {
      const s = this.shadows[i];
      const owner = s.sprite;
      if (!owner || !owner.active || !owner.scene) {
        s.img.destroy();
        this.shadows.splice(i, 1);
        continue;
      }
      // Shrinks as its owner stretches upward, which is the only thing selling
      // a hop as a hop rather than a slide.
      const lift = Phaser.Math.Clamp(owner.scaleY || 1, 0.6, 1.4);
      s.img
        .setPosition(owner.x, owner.y + s.offsetY)
        .setDepth(owner.depth - 1)
        .setScale(s.scaleX * (owner.scaleX || 1) * (2 - lift), s.scaleY * (2 - lift))
        .setAlpha(s.alpha * owner.alpha);
    }
  }

  // ---- lighting -----------------------------------------------------------

  // A dark sheet over the floor with holes punched in it, so lit ground keeps
  // its actual colour instead of washing out to grey.
  //
  // The depth is deliberately just above the floor and below everything that
  // stands on it. Laying it over the whole scene is more physically honest and
  // much worse to play: enemies in an unlit corner disappear, and every glow
  // that is meant to sit behind a sprite has to be lifted in front of it to be
  // visible at all. Darkening the ground carries the whole mood on its own.
  enableLighting(x, y, width, height, opts = {}) {
    const { color = 0x090612, alpha = 0.78, depth = -50 } = opts;
    try {
      this.lightRT = this.scene.add
        .renderTexture(x, y, width, height)
        .setOrigin(0, 0)
        .setDepth(depth);
      this.lightColor = color;
      this.lightAlpha = alpha;
      this.lightOrigin = { x, y };
    } catch {
      // A renderer that will not give us a render texture simply plays the room
      // fully lit. That is a worse-looking game, not a broken one.
      this.lightRT = null;
    }
    return this.lightRT;
  }

  // `ref` is anything with live x/y — a sprite, a player, a plain point. There
  // is no way to scale an erase, so the light sizes are the texture sizes.
  addLight(ref, opts = {}) {
    const { size = 256, flicker = false, offsetY = 0 } = opts;
    const light = { ref, size, flicker, offsetY, phase: Math.random() * 100 };
    this.lights.push(light);
    return light;
  }

  updateLighting(time) {
    const rt = this.lightRT;
    if (!rt) return;
    rt.clear();
    rt.fill(this.lightColor, this.lightAlpha);
    for (const l of this.lights) {
      const x = (l.ref.x ?? 0) - this.lightOrigin.x;
      const y = (l.ref.y ?? 0) - this.lightOrigin.y + l.offsetY;
      rt.erase('fx_light', x - 128, y - 128);
      if (l.size > 256) rt.erase('fx_light', x - 128, y - 128);
      // A second punch on a slow wobble. An erase cannot be scaled, so two
      // stacked ones standing in for one guttering flame is the whole trick.
      if (l.flicker) {
        const f =
          0.5 + 0.5 * Math.sin(time * 0.006 + l.phase) + 0.3 * Math.sin(time * 0.017 + l.phase * 2);
        if (f > 0.6) rt.erase('fx_light', x - 128, y - 128);
      }
    }
  }

  // ---- ambience -----------------------------------------------------------

  // Slow drifting motes across the whole room. The single cheapest thing that
  // stops a static pixel-art room looking like a screenshot.
  ambient(kind, bounds, depth = 950) {
    const { x = 0, y = 0, width = 480, height = 800 } = bounds ?? {};
    const area = new Phaser.Geom.Rectangle(x, y, width, height);
    const made = [];

    const spawn = (texture, cfg, d) => {
      const e = this.scene.add.particles(0, 0, texture, cfg);
      e.setDepth(d);
      this.nodes.push(e);
      made.push(e);
      return e;
    };

    if (kind === 'garden' || kind === 'meadow') {
      spawn(
        'fx_dot',
        {
          speedY: { min: -16, max: -4 },
          speedX: { min: -10, max: 10 },
          lifespan: { min: 3200, max: 6000 },
          scale: { start: 0.1, end: 0.04 },
          alpha: breatheAlpha(0.34),
          tint: [0xfff2c4, 0xd9f2a0, 0xffffff],
          blendMode: 'ADD',
          frequency: 900,
          emitZone: { type: 'random', source: area },
        },
        depth,
      );
      spawn(
        'fx_glow',
        {
          speedY: { min: -14, max: 14 },
          speedX: { min: -18, max: 18 },
          lifespan: { min: 2600, max: 5200 },
          scale: { start: 0.075, end: 0.02 },
          alpha: breatheAlpha(0.6),
          tint: [0xd8ff8a, 0xfff6a0],
          blendMode: 'ADD',
          frequency: 1500,
          emitZone: { type: 'random', source: area },
        },
        depth,
      );
      return made;
    }

    if (kind === 'dungeon') {
      spawn(
        'fx_dot',
        {
          speedY: { min: -34, max: -12 },
          speedX: { min: -14, max: 14 },
          lifespan: { min: 1800, max: 3600 },
          scale: { start: 0.12, end: 0.02 },
          alpha: breatheAlpha(0.6),
          tint: [0xff9a4a, 0xffc46b, 0xff6a3a],
          blendMode: 'ADD',
          frequency: 800,
          emitZone: { type: 'random', source: area },
        },
        depth,
      );
      spawn(
        'fx_smoke',
        {
          speedY: { min: 4, max: 14 },
          speedX: { min: -6, max: 6 },
          lifespan: { min: 4000, max: 7000 },
          scale: { start: 0.12, end: 0.3 },
          alpha: breatheAlpha(0.14),
          tint: 0x9f8fc0,
          frequency: 640,
          emitZone: { type: 'random', source: area },
        },
        depth - 1,
      );
      return made;
    }

    if (kind === 'petals') {
      spawn(
        'fx_petal',
        {
          // Seeded across the whole screen rather than only along the top edge.
          // Falling in from above means the first ten seconds of every menu are
          // spent with an empty lower half, and nobody looks at a title screen
          // for ten seconds.
          emitZone: { type: 'random', source: area },
          speedY: { min: 26, max: 58 },
          speedX: { min: -22, max: 22 },
          lifespan: { min: 6000, max: 11000 },
          scale: { start: 0.5, end: 0.4 },
          alpha: breatheAlpha(0.85),
          rotate: { start: 0, end: 360 },
          tint: [0xffb3d1, 0xff8fb8, 0xff7aa8, 0xffd6e6],
          frequency: 700,
        },
        depth,
      );
      return made;
    }

    return made;
  }

  // Tilted bars of light with a slow drift. Sold entirely by the post-process
  // bloom picking them up.
  godRays(x, y, width, height, opts = {}) {
    const { count = 4, tint = 0xfff4c0, alpha = 0.07, depth = 940, angle = 22 } = opts;
    const rays = [];
    for (let i = 0; i < count; i++) {
      const rx = x + (width / (count + 1)) * (i + 1);
      const r = this.scene.add
        .rectangle(rx, y + height / 2, 26 + i * 9, height * 1.9, tint, alpha)
        .setAngle(angle)
        .setBlendMode(Phaser.BlendModes.ADD)
        .setDepth(depth);
      this.scene.tweens.add({
        targets: r,
        x: rx + 26,
        alpha: alpha * 0.45,
        duration: 5200 + i * 900,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.inOut',
      });
      rays.push(r);
      this.nodes.push(r);
    }
    return rays;
  }

  // A guttering torch: a bracket on the wall, a warm glow that breathes, and a
  // thin flame of particles above it. The lighting pass punches its hole
  // separately, so this is only what the torch looks like, not what it lights.
  torch(x, y, opts = {}) {
    const { tint = 0xffa542, scale = 0.75 } = opts;
    // Something physical under the flame, or the light reads as floating.
    const bracket = this.scene.add.image(x, y + 7, 'torch').setDepth(y - 11);
    const glow = this.scene.add
      .image(x, y, 'fx_glow')
      .setTint(tint)
      .setAlpha(0.5)
      .setBlendMode(Phaser.BlendModes.ADD)
      .setDepth(y - 10)
      .setScale(scale);
    this.scene.tweens.add({
      targets: glow,
      scale: scale * 1.18,
      alpha: 0.68,
      duration: 420 + Math.random() * 260,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });

    const flame = this.scene.add.particles(x, y - 2, 'fx_dot', {
      speedY: { min: -46, max: -22 },
      speedX: { min: -9, max: 9 },
      lifespan: { min: 420, max: 760 },
      scale: { start: 0.28, end: 0 },
      alpha: { start: 0.85, end: 0 },
      tint: [0xffe08a, 0xffa542, 0xff6a2a],
      blendMode: 'ADD',
      frequency: 90,
    });
    flame.setDepth(y - 9);

    this.nodes.push(bracket, glow, flame);
    return { bracket, glow, flame };
  }

  // ---- per-frame ----------------------------------------------------------

  update(time) {
    this.updateShadows();
    this.updateLighting(time);
  }

  destroy() {
    this.dead = true;
    this.shadows.forEach((s) => s.img.destroy());
    this.shadows = [];
    this.lights = [];
    this.lightRT = null;
    this.nodes = [];
    this.pool = {};
  }
}

// Convenience: build the layer and hang it on the scene.
function installFx(scene) {
  scene.fx = new SceneFx(scene);
  return scene.fx;
}

const LEGS_FRONT_B = ['.....ss..sss....', '....vv....vvv...'];

const build = (head, body, legs) => [...head, ...body, ...legs];

const walkCycle = (head, body, a, b, idle) => [

// Picnic blanket: a checked prop, generated so the weave stays square.
function makeBlanket(w = 32, h = 24, check = 4) {
  const rows = [];
  for (let y = 0; y < h; y++) {
    let row = '';
    for (let x = 0; x < w; x++) {
      const edge = x === 0 || y === 0 || x === w - 1 || y === h - 1;
      if (edge) row += 'o';
      else row += (Math.floor(x / check) + Math.floor(y / check)) % 2 ? 'Q' : 'q';
    }
    rows.push(row);
  }
  return rows;
}

/* ---- js/gfx/sprites/tiles.js ---- */

// Tiles are generated rather than hand-authored so every row stays exactly
// square. A tiny deterministic LCG keeps the speckle pattern stable between runs.
//
// These are the only art in the game that is on screen every single frame, so
// they carry more tones than anything else: a floor built from two colours reads
// as noise, and four or five reads as ground.
function lcg(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// Stable 2D value hash, so scattered decor looks random but never re-rolls
// between frames or runs. Plain modulo on x/y just produces stripes.
function hash2(x, y) {
  let h = (Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const SIZE = 16;

function blank(fill) {
  return Array.from({ length: SIZE }, () => Array.from({ length: SIZE }, () => fill));
}

function done(grid) {
  return grid.map((r) => r.join(''));
}

// Scatter n cells of `ch`, optionally only where the cell already matches.
function scatter(grid, rand, ch, n, onlyOver = null) {
  for (let i = 0; i < n; i++) {
    const x = Math.floor(rand() * SIZE);
    const y = Math.floor(rand() * SIZE);
    if (onlyOver && grid[y][x] !== onlyOver) continue;
    grid[y][x] = ch;
  }
}

// Soft round patch. Used for the clumps that break up flat grass and for the
// leaf masses in a hedge — both look wrong as rectangles.
function blot(grid, cx, cy, r, ch) {
  for (let y = Math.max(0, Math.floor(cy - r)); y <= Math.min(SIZE - 1, Math.ceil(cy + r)); y++) {
    for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(SIZE - 1, Math.ceil(cx + r)); x++) {
      const dx = x - cx;
      const dy = (y - cy) * 1.35; // squashed, so patches read as seen from above
      if (dx * dx + dy * dy <= r * r) grid[y][x] = ch;
    }
  }
}

// Grass: a few darker clumps, sunlit blade tips standing up out of them, and a
// sparse scatter of deep shadow so the mat has some depth to it.
function grassTile(seed = 7) {
  const rand = lcg(seed);
  const grid = blank('f');

  for (let i = 0; i < 3; i++) {
    blot(grid, rand() * SIZE, rand() * SIZE, 2 + rand() * 2.2, 'F');
  }
  scatter(grid, rand, 'F', 14);

  // Blades: two-cell vertical runs, brighter at the tip.
  for (let i = 0; i < 13; i++) {
    const x = Math.floor(rand() * SIZE);
    const y = Math.floor(rand() * (SIZE - 2)) + 1;
    grid[y][x] = '4';
    if (rand() < 0.55) grid[y - 1][x] = '4';
  }
  scatter(grid, rand, '5', 7, 'F');
  scatter(grid, rand, '5', 4, 'f');
  return done(grid);
}

// One flagstone per tile: dark mortar along the top and left, a lit bevel just
// inside it, shade along the bottom and right, and a cracked, speckled face.
function floorTile(seed = 11) {
  const rand = lcg(seed);
  const grid = blank('t');

  scatter(grid, rand, 'T', 20);
  scatter(grid, rand, '0', 8);

  for (let i = 0; i < SIZE; i++) {
    grid[0][i] = '9';
    grid[i][0] = '9';
    grid[1][i] = grid[1][i] === '9' ? '9' : '6';
    grid[i][1] = grid[i][1] === '9' ? '9' : '6';
    grid[SIZE - 1][i] = 'T';
    grid[i][SIZE - 1] = 'T';
  }

  // One crack per stone, walked from a random edge cell inward, so no two
  // stones break the same way.
  let cx = 2 + Math.floor(rand() * (SIZE - 4));
  let cy = 2 + Math.floor(rand() * (SIZE - 4));
  const steps = 4 + Math.floor(rand() * 5);
  for (let i = 0; i < steps; i++) {
    if (cx < 2 || cy < 2 || cx > SIZE - 3 || cy > SIZE - 3) break;
    grid[cy][cx] = '7';
    cx += rand() < 0.5 ? 1 : rand() < 0.5 ? -1 : 0;
    cy += rand() < 0.6 ? 1 : 0;
  }
  return done(grid);
}

// Beaten earth: no stones, no mortar, just packed dirt with grit in it.
function pathTile(seed = 23) {
  const rand = lcg(seed);
  const grid = blank('T');
  for (let i = 0; i < 3; i++) blot(grid, rand() * SIZE, rand() * SIZE, 1.6 + rand() * 2, 't');
  scatter(grid, rand, 't', 18);
  scatter(grid, rand, '0', 12);
  scatter(grid, rand, '7', 5);
  return done(grid);
}

// Stone brickwork with a purple cap along the top. Courses are offset so the
// vertical seams do not line up into a column when the tile repeats.
function wallTile(seed = 3) {
  const rand = lcg(seed);
  const grid = blank('u');

  scatter(grid, rand, 'U', 16);
  scatter(grid, rand, '8', 12);

  // Two brick courses, seams at rows 2 and 9.
  const courses = [
    { top: 2, bottom: 8, offset: 0 },
    { top: 9, bottom: 15, offset: 8 },
  ];
  courses.forEach(({ top, bottom, offset }) => {
    for (let x = 0; x < SIZE; x++) {
      grid[top][x] = '9';
      // Lit top edge of each brick, immediately under its mortar line.
      if (top + 1 <= bottom) grid[top + 1][x] = '8';
      // Shaded bottom edge.
      if (bottom >= 0) grid[bottom][x] = 'U';
    }
    for (let y = top; y <= bottom; y++) {
      grid[y][(offset + SIZE) % SIZE] = '9';
    }
  });

  // The cap: two rows of trim with a highlight along the very top.
  for (let x = 0; x < SIZE; x++) {
    grid[0][x] = '8';
    grid[1][x] = 'c';
  }
  scatter(grid, rand, '9', 6, 'U');
  return done(grid);
}

// Dense leaf noise with no straight edges, so tiled hedges read as one mass of
// foliage rather than a grid of blocks.
function hedgeTile(seed = 31) {
  const rand = lcg(seed);
  const grid = blank('i');

  for (let i = 0; i < 5; i++) blot(grid, rand() * SIZE, rand() * SIZE, 1.8 + rand() * 2.4, 'I');
  scatter(grid, rand, 'I', 26);

  // Leaves catching the light, in little clusters rather than evenly spread.
  for (let i = 0; i < 9; i++) {
    const x = Math.floor(rand() * SIZE);
    const y = Math.floor(rand() * SIZE);
    grid[y][x] = 'L';
    if (rand() < 0.5 && x + 1 < SIZE) grid[y][x + 1] = 'L';
    if (rand() < 0.4 && y + 1 < SIZE) grid[y + 1][x] = 'L';
  }
  scatter(grid, rand, '5', 10, 'I');
  return done(grid);
}

// Touch controls are drawn as pixel grids too, so they sit in the same visual
// world as the game rather than looking like web UI pasted on top.
function circleGrid(size, opts = {}) {
  const { fill = null, edge = 'w', inner = null, innerRadius = 0 } = opts;
  const c = (size - 1) / 2;
  const r = size / 2;
  const rows = [];
  for (let y = 0; y < size; y++) {
    let row = '';
    for (let x = 0; x < size; x++) {
      const d = Math.hypot(x - c, y - c);
      if (d > r - 0.5) row += '.';
      else if (d > r - 2.5) row += edge;
      else if (inner && d < innerRadius) row += inner;
      else row += fill ?? '.';
    }
    rows.push(row);
  }
  return rows;
}

function stickBase(size = 36) {
  return circleGrid(size, { edge: 'w', fill: null });
}

function stickKnob(size = 18) {
  return circleGrid(size, { edge: 'w', fill: 'W' });
}

function attackButton(size = 32) {
  const rows = circleGrid(size, { edge: 'w', fill: 'W' }).map((r) => r.split(''));
  // Stamp a blade in the middle so the button reads as "swing" at a glance.
  const blade = [
    '....m....',
    '...mmm...',
    '...mMm...',
    '...mMm...',
    '...mMm...',
    '...mMm...',
    '...mMm...',
    '...mMm...',
    '.kkkkkkk.',
    '....n....',
    '....n....',
    '....n....',
    '...kkk...',
  ];
  const ox = Math.floor((size - blade[0].length) / 2);
  const oy = Math.floor((size - blade.length) / 2);
  blade.forEach((line, y) =>
    line.split('').forEach((ch, x) => {
      if (ch !== '.') rows[oy + y][ox + x] = ch;
    }),
  );
  return rows.map((r) => r.join(''));
}

// The HUD's pause control, built on the same disc as the attack button so the
// two read as one set of controls rather than a game button and a web icon.
function pauseIcon(size = 16) {
  const rows = circleGrid(size, { edge: 'w', fill: 'W' }).map((r) => r.split(''));
  const barW = 3;
  const barH = 8;
  const gap = 2;
  const x0 = Math.round((size - (barW * 2 + gap)) / 2);
  const y0 = Math.round((size - barH) / 2);
  for (let y = y0; y < y0 + barH; y++) {
    for (let i = 0; i < barW; i++) {
      rows[y][x0 + i] = 'o';
      rows[y][x0 + barW + gap + i] = 'o';
    }
  }
  return rows.map((r) => r.join(''));
}

// ---- power-up bubbles ------------------------------------------------------
// The first pass was a hollow white ring with a glyph floating in the middle,
// which is the one thing in this game that did not look like it belonged in it:
// no dark outline, no fill, no shading, and all four identical apart from the
// glyph. These are glass orbs instead — outlined like every other sprite, lit
// down the top left, deepening toward the bottom right, with a specular arc on
// the glass in front of whatever is suspended inside.
//
// The body is 'g'/'G'/'l', the same overridable trio the blob tiers use, so
// each power-up gets its own colour of glass out of one grid (see BUBBLE_GLASS).
const BUBBLE_SIZE = 16;
// Icons are kept inside this radius and the glint outside it, so the highlight
// can never take a bite out of a glyph.
const BUBBLE_ICON_R = 5.4;

function bubbleShell(icon) {
  const c = (BUBBLE_SIZE - 1) / 2;
  const r = BUBBLE_SIZE / 2;
  const rows = [];

  for (let y = 0; y < BUBBLE_SIZE; y++) {
    const row = [];
    for (let x = 0; x < BUBBLE_SIZE; x++) {
      const dx = x - c;
      const dy = y - c;
      const d = Math.hypot(dx, dy);
      if (d > r) row.push('.');
      else if (d > r - 1) row.push('o');
      // Rim: lit where the light is, dark round the back.
      else if (d > r - 2) row.push(dx + dy < 0 ? 'l' : 'G');
      // Body, shading off along the same diagonal.
      else row.push(dx + dy > 3.5 ? 'G' : 'g');
    }
    rows.push(row);
  }

  const ox = Math.floor((BUBBLE_SIZE - icon[0].length) / 2);
  const oy = Math.floor((BUBBLE_SIZE - icon.length) / 2);
  icon.forEach((line, y) =>
    line.split('').forEach((ch, x) => {
      if (ch !== '.') rows[oy + y][ox + x] = ch;
    }),
  );

  // Specular last, so it sits on the glass in front of the icon. An arc up the
  // top-left rather than a couple of loose pixels — that is what makes it read
  // as a sphere rather than a disc.
  for (let y = 0; y < BUBBLE_SIZE; y++) {
    for (let x = 0; x < BUBBLE_SIZE; x++) {
      const dx = x - c;
      const dy = y - c;
      const d = Math.hypot(dx, dy);
      if (d <= BUBBLE_ICON_R || d > r - 0.9) continue;
      const a = (Math.atan2(dy, dx) * 180) / Math.PI;
      const off = Math.abs(((a + 135 + 540) % 360) - 180);
      if (off > 26) continue;
      rows[y][x] = off < 13 ? 'w' : 'W';
    }
  }

  return rows.map((row) => row.join(''));
}

// The radiation sign: a hub with three blades at 120 degrees. Generated because
// by hand at this size the three blades never come out the same weight, and an
// uneven trefoil stops reading as the symbol at a glance.
function trefoilIcon(size = 12, ink = 'o') {
  const c = (size - 1) / 2;
  const HUB = 1.8;
  const INNER = 2.9;
  const OUTER = 5.2;
  const HALF_ARC = 30;
  const AXES = [-90, 30, 150]; // up, lower right, lower left

  const rows = [];
  for (let y = 0; y < size; y++) {
    let row = '';
    for (let x = 0; x < size; x++) {
      const dx = x - c;
      const dy = y - c;
      const d = Math.hypot(dx, dy);
      if (d <= HUB) {
        row += ink;
      } else if (d < INNER || d > OUTER) {
        row += '.';
      } else {
        const a = (Math.atan2(dy, dx) * 180) / Math.PI;
        const on = AXES.some((axis) => Math.abs(((a - axis + 540) % 360) - 180) <= HALF_ARC);
        row += on ? ink : '.';
      }
    }
    rows.push(row);
  }
  return rows;
}

// One continuous run of hedge rather than separate clumps. Overlapping outlined
// blobs read as a pile of rubble; a single mass with a gently scalloped top and
// leaf speckle reads as a hedge. Only the top edge is outlined — the sides and
// base are where it meets its neighbours and the ground.
function hedgeBand(w, h = 22, seed = 3) {
  const grid = Array.from({ length: h }, () => Array.from({ length: w }, () => '.'));

  // Two slow waves and one fast one: an uneven but calm skyline, no spikes.
  const topAt = (x) =>
    Math.round(
      4 +
        Math.sin(x * 0.09 + seed) * 1.9 +
        Math.sin(x * 0.21 + seed * 2.3) * 1.2 +
        Math.sin(x * 0.53 + seed) * 0.55,
    );

  for (let x = 0; x < w; x++) {
    const top = Math.max(0, topAt(x));
    for (let y = top; y < h; y++) {
      const depth = y - top;
      if (y >= h - 4) grid[y][x] = 'I'; // grounded in shadow
      else if (depth === 0) grid[y][x] = 'o'; // thin lit-side outline on top
      else if (depth < 3 && hash2(x * 3 + seed, y) < 0.5) grid[y][x] = 'L';
      else if (hash2(x * 5, y * 7 + seed) < 0.12) grid[y][x] = 'I';
      else if (hash2(x * 11, y * 3 + seed) < 0.14) grid[y][x] = 'L';
      else grid[y][x] = 'i';
    }
  }

  return grid.map((row) => row.join(''));
}

// Rasterised ellipse, so the pond has hard pixel edges like everything else
// rather than the smooth curve a Graphics circle would give.
function pondGrid(w = 46, h = 26) {
  const cx = (w - 1) / 2;
  const cy = (h - 1) / 2;
  const rows = [];
  for (let y = 0; y < h; y++) {
    let row = '';
    for (let x = 0; x < w; x++) {
      const d = ((x - cx) / (w / 2)) ** 2 + ((y - cy) / (h / 2)) ** 2;
      if (d > 1) row += '.';
      else if (d > 0.84) row += 'Z';
      else row += hash2(x * 3, y * 5) < 0.07 ? 'A' : 'a';
    }
    rows.push(row);
  }
  return rows;
}

// Ring drawn around her while a shield is up. Hollow so she stays readable.
function shieldRing(size = 26) {
  const c = (size - 1) / 2;
  const r = size / 2;
  const rows = [];
  for (let y = 0; y < size; y++) {
    let row = '';
    for (let x = 0; x < size; x++) {
      const d = Math.hypot(x - c, y - c);
      row += d > r - 0.5 || d < r - 2.5 ? '.' : 'm';
    }
    rows.push(row);
  }
  return rows;
}
