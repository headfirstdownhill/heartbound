// Rebuilds every texture the player character appears in, from the chosen look.
// Called once at boot with the defaults and again on each change in the
// customiser — the texture keys never change, so everything downstream (player,
// intros, endings) picks up the new art with no other wiring.
const DIRS = ['down', 'up', 'side'];

// Paints a hair fall into the transparent margin around the body. Writing only
// into empty pixels means a long style can never eat into the dress or the
// arms, whatever outfit it is combined with.
function applySpill(body, spill) {
  if (!spill) return body;
  return body.map((row, i) => {
    const mask = spill[i];
    if (!mask) return row;
    return row
      .split('')
      .map((ch, x) => (ch === '.' && mask[x] && mask[x] !== '.' ? mask[x] : ch))
      .join('');
  });
}

function buildGirlTextures(scene, look) {
  const style = HAIR_STYLES[look.hair] ?? HAIR_STYLES[0];
  const outfit = OUTFITS[look.outfit] ?? OUTFITS[0];
  const overrides = lookOverrides(look);

  DIRS.forEach((dir) => {
    const head = style.heads[dir];
    const sideOn = dir === 'side';
    const spill = sideOn ? style.spillSide : style.spillFront;
    const body = applySpill(sideOn ? outfit.side : outfit.front, spill);
    const legs = sideOn ? outfit.legsSide : outfit.legsFront;

    const idleKey = `girl_idle_${dir}`;
    const walkKey = `girl_walk_${dir}`;

    // Animations hold references into the texture, so they have to go before
    // the texture underneath them is replaced.
    scene.anims.remove(idleKey);
    scene.anims.remove(walkKey);

    makeSheet(scene, idleKey, [build(head, body, legs.idle)], { overrides });
    makeSheet(scene, walkKey, walkCycle(head, body, legs.a, legs.b, legs.idle), { overrides });
    makeAnim(scene, idleKey, idleKey, 1, { frameRate: 2 });
    makeAnim(scene, walkKey, walkKey, 4, { frameRate: 10 });
  });

  // Story poses share her colours but are drawn separately.
  makeTexture(scene, 'girl_sit', GIRL.sit, { overrides });
  makeTexture(scene, 'girl_cheer', GIRL.cheer, { overrides });
}

/* ---- js/core/GameState.js ---- */

const SAVE_KEY = 'heartbound.unlocks';

// Plain module singleton: one page, one game instance, and every scene needs the
// same handful of facts to survive scene restarts.
const GameState = {
  hasSword: false,
  heartRecovered: false,
  currentLevel: 1,
  playerHp: PLAYER_MAX_HP,
  seenIntro: false,

  // Chosen once in the menus and kept for the whole session, so "play again"
  // replays the run you picked rather than dumping you back at the title.
  playerName: '',
  difficulty: 'hard',
  hasKey: false,

  // How she looks, chosen in the customiser and kept for the whole session.
  look: { ...DEFAULT_LOOK },

  // The one thing that outlives the session: whether the chest has ever been
  // opened. It is what puts the inventory on the title screen, so it has to
  // survive the tab closing — otherwise she would have to win the book back
  // every time she wanted to read it, which is the whole thing the inventory
  // exists to avoid.
  chestOpened: false,

  loadUnlocks() {
    try {
      const raw = window.localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      this.chestOpened = !!saved.chestOpened;
      // Carried too, so the inventory can still greet her by name in a session
      // where she has not typed it in.
      if (typeof saved.playerName === 'string') this.playerName = saved.playerName;
    } catch {
      // Storage is refused outright in private windows and on some file://
      // setups. The game plays fine without it; only the inventory is lost, so
      // this must never be allowed to take the boot down with it.
    }
  },

  saveUnlocks() {
    try {
      window.localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({ chestOpened: this.chestOpened, playerName: this.playerName }),
      );
    } catch {
      // As above.
    }
  },

  // Deliberately leaves playerName and difficulty alone — this resets a run,
  // not the session.
  reset() {
    this.hasSword = false;
    this.heartRecovered = false;
    this.currentLevel = 1;
    this.playerHp = PLAYER_MAX_HP;
  },

  get isEasy() {
    return this.difficulty === 'easy';
  },
};

const RUN_TIME = RUN_DURATION_MS;

/* ---- js/core/Timer.js ---- */

// Wall-clock based on purpose: a Phaser TimerEvent belongs to a scene and would
// be destroyed every time the player walks through a door.
class GlobalTimer {
  constructor(durationMs = RUN_DURATION_MS) {
    this.durationMs = durationMs;
    this.startTime = null;
    this.penaltyMs = 0;
    this.expired = false;
    this.running = false;
    this.paused = false;
    this.pausedAt = 0;
  }

  start() {
    this.startTime = performance.now();
    this.penaltyMs = 0;
    this.expired = false;
    this.running = true;
    this.paused = false;
  }

  stop() {
    this.running = false;
    this.paused = false;
  }

  penalize(ms) {
    this.penaltyMs += ms;
  }

  // Being wall-clock is what makes this survive walking through a door, and it
  // is also why pausing has to be handled here: the game freezing does nothing
  // to performance.now(), so without this the clock would keep burning while
  // the player is looking at a pause screen.
  pause() {
    if (!this.running || this.paused) return;
    this.paused = true;
    this.pausedAt = performance.now();
  }

  resume() {
    if (!this.paused) return;
    this.paused = false;
    // Hand back the time spent paused by winding the penalty the other way.
    this.penaltyMs -= performance.now() - this.pausedAt;
  }

  getRemainingMs() {
    if (this.startTime === null) return this.durationMs;
    const now = this.paused ? this.pausedAt : performance.now();
    const elapsed = now - this.startTime + this.penaltyMs;
    return Math.max(0, this.durationMs - elapsed);
  }

  // Returns true on the single frame the clock runs out.
  tick() {
    if (!this.running || this.expired) return false;
    if (this.getRemainingMs() <= 0) {
      this.expired = true;
      this.running = false;
      return true;
    }
    return false;
  }

  format() {
    const total = Math.ceil(this.getRemainingMs() / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }
}

const runTimer = new GlobalTimer();

/* ---- js/core/InputController.js ---- */

// One interface for both control schemes, so Player never asks how the input
// arrived. Touch UI objects are created by the HUD scene and handed in here.
class InputController {
  constructor() {
    this.isTouch = InputController.detectTouch();
    this.keys = null;
    this.joystick = null;
    this.attackButton = null;
    this.clickQueued = false;
  }

  static detectTouch() {
    return (
      typeof window !== 'undefined' &&
      ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0)
    );
  }

  bindKeyboard(scene) {
    this.keys = scene.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D,
      up2: Phaser.Input.Keyboard.KeyCodes.UP,
      down2: Phaser.Input.Keyboard.KeyCodes.DOWN,
      left2: Phaser.Input.Keyboard.KeyCodes.LEFT,
      right2: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      attack: Phaser.Input.Keyboard.KeyCodes.SPACE,
      attack2: Phaser.Input.Keyboard.KeyCodes.J,
    });
  }

  bindDesktopClick(scene) {
    if (this.isTouch) return;
    scene.input.on('pointerdown', () => {
      this.clickQueued = true;
    });
  }

  attachTouchUI(joystick, attackButton) {
    this.joystick = joystick;
    this.attackButton = attackButton;
  }

  detachTouchUI() {
    this.joystick = null;
    this.attackButton = null;
  }

  getMoveVector() {
    if (this.isTouch && this.joystick) return this.joystick.getVector();
    if (!this.keys) return { x: 0, y: 0 };
    const k = this.keys;
    const x = (k.right.isDown || k.right2.isDown ? 1 : 0) - (k.left.isDown || k.left2.isDown ? 1 : 0);
    const y = (k.down.isDown || k.down2.isDown ? 1 : 0) - (k.up.isDown || k.up2.isDown ? 1 : 0);
    if (x === 0 && y === 0) return { x: 0, y: 0 };
    const len = Math.hypot(x, y);
    return { x: x / len, y: y / len };
  }

  isAttackPressed() {
    if (this.attackButton && this.attackButton.consumePress()) return true;
    if (this.clickQueued) {
      this.clickQueued = false;
      return true;
    }
    if (!this.keys) return false;
    return (
      Phaser.Input.Keyboard.JustDown(this.keys.attack) ||
      Phaser.Input.Keyboard.JustDown(this.keys.attack2)
    );
  }

  // Any-input check, used by the title / ending screens.
  isAnyPressed(scene) {
    return scene.input.activePointer.isDown || (this.keys && this.keys.attack.isDown);
  }
}

const input = new InputController();

/* ---- js/ui/VirtualJoystick.js ---- */

class VirtualJoystick {
  constructor(scene, x, y, radius = 56) {
    this.scene = scene;
    this.origin = { x, y };
    this.radius = radius;
    this.vector = { x: 0, y: 0 };
    this.pointerId = null;

    this.base = scene.add.image(x, y, 'ui_stick_base').setScrollFactor(0).setAlpha(0.35);
    this.knob = scene.add.image(x, y, 'ui_stick_knob').setScrollFactor(0).setAlpha(0.55);
    this.base.setDepth(1000);
    this.knob.setDepth(1001);

    // The whole lower-left quadrant grabs the stick, not just the drawn circle —
    // thumbs rarely land exactly on target.
    this.zone = scene.add
      .zone(0, scene.scale.height - 300, scene.scale.width * 0.62, 300)
      .setOrigin(0, 0)
      .setScrollFactor(0)
      .setInteractive();

    this.zone.on('pointerdown', (p) => this.onDown(p));
    scene.input.on('pointermove', (p) => this.onMove(p));
    scene.input.on('pointerup', (p) => this.onUp(p));
    scene.input.on('pointerupoutside', (p) => this.onUp(p));
  }

  onDown(pointer) {
    if (this.pointerId !== null) return;
    this.pointerId = pointer.id;
    this.origin = { x: pointer.x, y: pointer.y };
    this.base.setPosition(pointer.x, pointer.y).setAlpha(0.5);
    this.knob.setPosition(pointer.x, pointer.y).setAlpha(0.85);
    this.update(pointer);
  }

  onMove(pointer) {
    if (pointer.id !== this.pointerId) return;
    this.update(pointer);
  }

  onUp(pointer) {
    if (pointer.id !== this.pointerId) return;
    this.pointerId = null;
    this.vector = { x: 0, y: 0 };
    this.knob.setPosition(this.origin.x, this.origin.y).setAlpha(0.55);
    this.base.setAlpha(0.35);
  }

  update(pointer) {
    const dx = pointer.x - this.origin.x;
    const dy = pointer.y - this.origin.y;
    const dist = Math.hypot(dx, dy);
    const clamped = Math.min(dist, this.radius);
    const angle = Math.atan2(dy, dx);
    this.knob.setPosition(
      this.origin.x + Math.cos(angle) * clamped,
      this.origin.y + Math.sin(angle) * clamped,
    );
    // Small deadzone so resting thumbs don't drift the player.
    if (dist < 10) {
      this.vector = { x: 0, y: 0 };
    } else {
      const mag = clamped / this.radius;
      this.vector = { x: Math.cos(angle) * mag, y: Math.sin(angle) * mag };
    }
  }

  getVector() {
    return this.vector;
  }
}

/* ---- js/ui/TouchButton.js ---- */

class TouchButton {
  constructor(scene, x, y, textureKey, radius = 52) {
    this.pressed = false;
    this.image = scene.add
      .image(x, y, textureKey)
      .setScrollFactor(0)
      .setDepth(1000)
      .setAlpha(0.72)
      .setInteractive(new Phaser.Geom.Circle(radius, radius, radius + 16), Phaser.Geom.Circle.Contains);

    this.image.on('pointerdown', () => {
      this.pressed = true;
      this.image.setAlpha(0.95).setScale(0.9);
    });
    const release = () => this.image.setAlpha(0.72).setScale(1);
    this.image.on('pointerup', release);
    this.image.on('pointerout', release);
  }

  // Edge-triggered, matching keyboard JustDown semantics.
  consumePress() {
    if (!this.pressed) return false;
    this.pressed = false;
    return true;
  }
}

/* ---- js/ui/MenuWidgets.js ---- */

// Chunky arcade buttons: a thick dark outline with notched corners, a coloured
// body, a lit top-left bevel and a shaded bottom-right one. Drawn rather than
// spritesheeted so a button can be any size and any colour.
const BTN_OUTLINE = 0x0a2a3d;
const BTN_BODY = 0xffc20e;
const BTN_DEAD_BODY = 0x6c6a72;
const BTN_DEAD_TEXT = 0x36343d;
const KEY_BODY = 0xd8cfba;

// The one button that is for a person rather than a difficulty.
const GRAND_FRAME = 0xffc20e;
const GRAND_LABEL = 0xfff2c4;
const GRAND_SHADOW = 0x4a0f2e;
const GRAND_GLOW = 0xff8fc0;
const GRAND_SPARK = 0xfff6d0;

const NOTCH = 4; // corner squares left empty, which is what rounds the corners
const EDGE = 4; // outline thickness
const BEVEL = 4; // lit/shaded inner band

function shade(hex, factor) {
  const r = Math.min(255, Math.round(((hex >> 16) & 255) * factor));
  const g = Math.min(255, Math.round(((hex >> 8) & 255) * factor));
  const b = Math.min(255, Math.round((hex & 255) * factor));
  return (r << 16) | (g << 8) | b;
}

// Two overlapping rectangles make a plus shape, and a plus shape is a rectangle
// with its four corner squares missing — the pixel-art rounded corner.
function plus(g, left, top, w, h, notch) {
  g.fillRect(left + notch, top, w - notch * 2, h);
  g.fillRect(left, top + notch, w, h - notch * 2);
}

function drawChunkyPanel(g, cx, cy, w, h, body, opts = {}) {
  const {
    pressed = false,
    hover = false,
    edge = EDGE,
    notch = NOTCH,
    bevel = BEVEL,
    frame = null,
    frameWidth = 3,
  } = opts;
  const left = Math.round(cx - w / 2);
  const top = Math.round(cy - h / 2);
  const tone = hover ? shade(body, 1.12) : body;

  g.clear();

  g.fillStyle(BTN_OUTLINE, 1);
  plus(g, left, top, w, h, notch);

  let inX = left + edge;
  let inY = top + edge;
  let inW = w - edge * 2;
  let inH = h - edge * 2;

  // Optional band between the outline and the face — the gold frame.
  if (frame !== null) {
    g.fillStyle(frame, 1);
    plus(g, inX, inY, inW, inH, notch);
    inX += frameWidth;
    inY += frameWidth;
    inW -= frameWidth * 2;
    inH -= frameWidth * 2;
  }

  g.fillStyle(tone, 1);
  plus(g, inX, inY, inW, inH, notch);

  // Pressed swaps which edges are lit, so the face reads as pushed in.
  const lit = pressed ? shade(tone, 0.72) : shade(tone, 1.3);
  const dim = pressed ? shade(tone, 1.3) : shade(tone, 0.72);

  g.fillStyle(lit, 1);
  g.fillRect(inX + notch, inY, inW - notch * 2, bevel);
  g.fillRect(inX, inY + notch, bevel, inH - notch * 2);

  g.fillStyle(dim, 1);
  g.fillRect(inX + notch, inY + inH - bevel, inW - notch * 2, bevel);
  g.fillRect(inX + inW - bevel, inY + notch, bevel, inH - notch * 2);
}

// The front-end screens share the game's meadow so the menus feel like the same
// world rather than a separate web page bolted on the front. It also carries the
// weather and the post-process grade, so every menu screen gets the same look
// from one call rather than four screens each remembering to ask.
const MEADOW_TILES = ['tile_grass', 'tile_grass2', 'tile_grass3', 'tile_grass4'];

function meadowBackdrop(scene, veilAlpha = 0.68, opts = {}) {
  const { petals = true, rays = true, preset = 'menu' } = opts;
  if (!scene.fx) installFx(scene);

  const rt = scene.add.renderTexture(0, 0, GAME_W, GAME_H).setOrigin(0, 0).setDepth(-100);
  for (let y = 0; y < GAME_H; y += TILE) {
    for (let x = 0; x < GAME_W; x += TILE) {
      const roll = hash2(x, y);
      rt.draw(MEADOW_TILES[(x / TILE + y / TILE + Math.floor(roll * 4)) % MEADOW_TILES.length], x, y);
      if (roll < 0.14) rt.draw('flower', x + 3 + roll * 110, y + 4 + hash2(y, x) * 20);
    }
  }
  scene.add.rectangle(0, 0, GAME_W, GAME_H, 0x0d0b14, veilAlpha).setOrigin(0, 0).setDepth(-90);

  // Behind the interface, in front of the veil: the drifting layer has to be
  // lit by the scene rather than dimmed along with the ground under it.
  scene.fx.ambient('meadow', { x: 0, y: 0, width: GAME_W, height: GAME_H }, -80);
  if (petals) scene.fx.ambient('petals', { x: 0, y: 0, width: GAME_W, height: GAME_H }, 300);
  if (rays) scene.fx.godRays(0, 0, GAME_W, GAME_H, { count: 5, alpha: 0.05, depth: -70 });
  applyPostFX(scene, preset);

  return rt;
}

// `color` is the button's body colour; the label is always the dark outline
// colour, which is what makes the arcade look work.
class MenuButton {
  constructor(scene, x, y, label, opts = {}) {
    const {
      scale = 3,
      color = BTN_BODY,
      padX = 26,
      padY = 16,
      minWidth = 0,
      depth = 500,
      onPick = null,
      grand = false,
      // Either can be set to null to silence it. The book's page arrows do
      // that for the click, because the turn itself is the sound there and an
      // interface blip on top of it just steps on the paper.
      hoverSound = 'uiHover',
      clickSound = 'uiClick',
    } = opts;

    this.scene = scene;
    this.onPick = onPick;
    this.hoverSound = hoverSound;
    this.clickSound = clickSound;
    this.enabled = true;
    this.pressed = false;
    this.hover = false;
    this.body = color;
    this.cx = x;
    this.cy = y;
    this.grand = grand;
    this.frame = grand ? GRAND_FRAME : null;

    // The grand button carries a cream label over a dark drop shadow instead of
    // the flat dark one, so it reads as lit rather than stamped.
    const labelColor = grand ? GRAND_LABEL : BTN_OUTLINE;
    if (grand) {
      this.shadowText = new PixelText(scene, x + 2, y + 3, label, { scale, color: GRAND_SHADOW });
    }
    this.text = new PixelText(scene, x, y, label, { scale, color: labelColor });
    this.w = Math.round(Math.max(this.text.width + padX * 2, minWidth));
    this.h = Math.round(this.text.height + padY * 2);

    this.gfx = scene.add.graphics().setDepth(depth);
    this.shadowText?.setDepth(depth + 1);
    this.text.setDepth(depth + 2);

    if (grand) this.decorate(depth);

    this.hit = scene.add
      .zone(x, y, this.w, this.h)
      .setDepth(depth)
      .setInteractive({ useHandCursor: true });

    this.hit.on('pointerover', () => {
      if (this.enabled && !this.hover && this.hoverSound) audio.play(this.hoverSound);
      this.setHover(true);
    });
    this.hit.on('pointerout', () => {
      this.setHover(false);
      this.setPressed(false);
    });
    this.hit.on('pointerdown', () => {
      if (this.enabled && this.clickSound) audio.play(this.clickSound);
      this.setPressed(true);
    });
    this.hit.on('pointerup', () => {
      const wasPressed = this.pressed;
      this.setPressed(false);
      if (this.enabled && wasPressed) this.onPick?.();
    });

    this.redraw();
  }

  // Halo, shimmer and sparkles. Only the grand button gets these — it is the
  // one that is meant to be for somebody.
  decorate(depth) {
    const scene = this.scene;
    const { w, h } = this;

    // Layered rounded rects fake a soft halo without needing a blur. It has to
    // be additive: pink at low alpha over the dark meadow just reads as a grey
    // slab, whereas added light reads as glow.
    this.glow = scene.add.graphics().setDepth(depth - 1).setPosition(this.cx, this.cy);
    this.glow.setBlendMode(Phaser.BlendModes.ADD);
    // Ellipses rather than rects: a stacked rectangle halo shows its outermost
    // straight edge as a band across the screen, an elliptical one falls off.
    for (let i = 6; i >= 1; i--) {
      this.glow.fillStyle(GRAND_GLOW, 0.05);
      this.glow.fillEllipse(0, 0, w + i * 9, h + i * 9);
    }
    scene.tweens.add({
      targets: this.glow,
      scaleX: 1.05,
      scaleY: 1.1,
      alpha: 0.5,
      duration: 1500,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.inOut',
    });

    // A lit band that sweeps across the face every few seconds, clipped to the
    // face so it never spills over the frame.
    const mask = scene.make.graphics();
    mask.fillStyle(0xffffff, 1);
    plus(mask, this.cx - w / 2 + EDGE, this.cy - h / 2 + EDGE, w - EDGE * 2, h - EDGE * 2, NOTCH);

    this.shine = scene.add.graphics().setDepth(depth + 3);
    this.shine.setBlendMode(Phaser.BlendModes.ADD);
    this.shine.fillStyle(0xffffff, 0.22);
    this.shine.fillRect(-11, -h, 22, h * 2);
    this.shine.setPosition(this.cx - w / 2 - 30, this.cy).setAngle(16);
    this.shine.setMask(mask.createGeometryMask());
    scene.tweens.add({
      targets: this.shine,
      x: this.cx + w / 2 + 30,
      duration: 1300,
      ease: 'Sine.inOut',
      repeat: -1,
      repeatDelay: 2400,
    });

    // Twinkles around the rim, each on its own clock.
    this.sparkles = [
      [-w / 2 - 6, -h / 2 - 4],
      [w / 2 + 6, -h / 2 - 2],
      [-w / 2 + 24, h / 2 + 8],
      [w / 2 - 30, h / 2 + 6],
      [-w / 2 - 10, h / 2 - 10],
      [w / 2 + 10, -h / 2 + 12],
    ].map(([ox, oy], i) => {
      const s = scene.add.graphics().setDepth(depth + 4);
      s.setBlendMode(Phaser.BlendModes.ADD);
      s.fillStyle(GRAND_SPARK, 1);
      // Four-point twinkle: long thin cross with a brighter core.
      s.fillRect(-1, -6, 2, 12);
      s.fillRect(-6, -1, 12, 2);
      s.fillRect(-2, -2, 4, 4);
      s.setPosition(this.cx + ox, this.cy + oy).setAlpha(0);
      scene.tweens.add({
        targets: s,
        alpha: { from: 0, to: 1 },
        scaleX: { from: 0.3, to: 1 },
        scaleY: { from: 0.3, to: 1 },
        duration: 620,
        yoyo: true,
        repeat: -1,
        delay: i * 430,
        repeatDelay: 1500,
        ease: 'Quad.out',
      });
      return s;
    });
  }

  redraw() {
    drawChunkyPanel(this.gfx, this.cx, this.cy, this.w, this.h, this.enabled ? this.body : BTN_DEAD_BODY, {
      pressed: this.pressed,
      hover: this.hover && this.enabled,
      frame: this.enabled ? this.frame : null,
    });
    if (!this.grand) this.text.setTint(this.enabled ? BTN_OUTLINE : BTN_DEAD_TEXT);
    // Shove the label into the face while held.
    const drop = this.pressed ? 2 : 0;
    this.text.setPosition(this.cx, this.cy + drop);
    this.shadowText?.setPosition(this.cx + 2, this.cy + 3 + drop);
  }

  setHover(on) {
    if (this.hover === on) return;
    this.hover = on;
    this.redraw();
  }

  setPressed(on) {
    if (this.pressed === on) return;
    this.pressed = on && this.enabled;
    this.redraw();
  }

  setEnabled(on) {
    this.enabled = on;
    this.pressed = false;
    this.redraw();
  }

  setAlpha(a) {
    this.gfx.setAlpha(a);
    this.text.setAlpha(a);
    this.shadowText?.setAlpha(a);
    this.glow?.setAlpha(a);
    this.shine?.setAlpha(a);
    this.sparkles?.forEach((s) => s.setAlpha(a));
    return this;
  }

  // A button owns half a dozen loose objects, so a screen that swaps out its
  // contents without leaving a dead hit zone behind needs this.
  destroy() {
    this.gfx.destroy();
    this.text.destroy();
    this.hit.destroy();
    this.shadowText?.destroy();
    this.glow?.destroy();
    this.shine?.destroy();
    this.sparkles?.forEach((s) => s.destroy());
  }
}

// Sound on/off. Drawn rather than spritesheeted because it is two states of one
// shape and the difference between them is a single stroke.
class SoundToggle {
  constructor(scene, x, y, opts = {}) {
    const { depth = 900, size = 24 } = opts;
    this.scene = scene;
    this.cx = x;
    this.cy = y;
    this.size = size;

    this.gfx = scene.add.graphics().setDepth(depth).setAlpha(0.7);
    this.hit = scene.add
      .zone(x, y, size + 16, size + 16)
      .setDepth(depth)
      .setInteractive({ useHandCursor: true });

    this.hit.on('pointerover', () => this.gfx.setAlpha(1));
    this.hit.on('pointerout', () => this.gfx.setAlpha(0.7));
    this.hit.on('pointerup', () => {
      audio.toggleMute();
      this.redraw();
      // Only audible when turning it back on, which is the confirmation the
      // player actually needs.
      audio.play('uiClick');
    });

    this.redraw();
  }

  redraw() {
    const g = this.gfx;
    const s = this.size;
    const x = this.cx;
    const y = this.cy;
    g.clear();
    g.fillStyle(0xfff2c4, 1);
    // Speaker: a small box with a triangular cone off the right of it.
    g.fillRect(x - s * 0.42, y - s * 0.18, s * 0.26, s * 0.36);
    g.beginPath();
    g.moveTo(x - s * 0.16, y - s * 0.18);
    g.lineTo(x + s * 0.08, y - s * 0.42);
    g.lineTo(x + s * 0.08, y + s * 0.42);
    g.lineTo(x - s * 0.16, y + s * 0.18);
    g.closePath();
    g.fillPath();

    if (audio.muted) {
      // A cross through it, in the warning colour.
      g.lineStyle(3, 0xff4d6d, 1);
      g.beginPath();
      g.moveTo(x + s * 0.2, y - s * 0.28);
      g.lineTo(x + s * 0.56, y + s * 0.28);
      g.moveTo(x + s * 0.56, y - s * 0.28);
      g.lineTo(x + s * 0.2, y + s * 0.28);
      g.strokePath();
      return;
    }

    // Two arcs of sound coming out of it.
    g.lineStyle(3, 0xfff2c4, 1);
    [0.26, 0.46].forEach((r, i) => {
      g.beginPath();
      g.arc(x + s * 0.1, y, s * (0.3 + r), -0.9, 0.9);
      g.strokePath();
      void i;
    });
  }

  setDepth(d) {
    this.gfx.setDepth(d);
    this.hit.setDepth(d);
    return this;
  }

  destroy() {
    this.gfx.destroy();
    this.hit.destroy();
  }
}

// Small square key for the name-entry keypad, in the same style but muted —
// thirty-odd bright yellow caps would shout down the rest of the screen.
class KeyCap {
  constructor(scene, x, y, label, onPick, size = 40) {
    this.scene = scene;
    this.label = label;
    this.cx = x;
    this.cy = y;
    this.size = size;
    this.pressed = false;
    this.hover = false;

    this.gfx = scene.add.graphics().setDepth(500);
    this.text = new PixelText(scene, x, y, label, { scale: 2, color: BTN_OUTLINE });
    this.text.setDepth(501);

    this.hit = scene.add
      .zone(x, y, size, size)
      .setDepth(500)
      .setInteractive({ useHandCursor: true });

    this.hit.on('pointerover', () => {
      this.hover = true;
      this.redraw();
    });
    this.hit.on('pointerout', () => {
      this.hover = false;
      this.pressed = false;
      this.redraw();
    });
    this.hit.on('pointerdown', () => {
      this.pressed = true;
      this.redraw();
    });
    this.hit.on('pointerup', () => {
      const was = this.pressed;
      this.pressed = false;
      this.redraw();
      if (was) {
        audio.play('key');
        onPick(label);
      }
    });

    this.redraw();
  }

  redraw() {
    drawChunkyPanel(this.gfx, this.cx, this.cy, this.size, this.size, KEY_BODY, {
      pressed: this.pressed,
      hover: this.hover,
      edge: 3,
      notch: 3,
      bevel: 3,
    });
    this.text.setPosition(this.cx, this.cy + (this.pressed ? 2 : 0));
  }
}

/* ---- js/ui/MiniPlayer.js ---- */

// A thin now-playing strip for the title screen. It is a display first and a
// control second: the song name is the whole point, and the two arrows are
// small enough that nobody hunting for PLAY will hit one by accident.
//
// Titles are drawn at scale 1 and never shrunk to fit. Letting PixelText scale
// a long name down lands on a fractional pixel size, which on a sheet this
// small turns to mush — so anything too wide for the window scrolls instead,
// which is what a real player of this size does anyway.
const MINI_PANEL = 0x1d2b3a;
const MINI_LABEL = 0xfff2c4;
const MINI_LABEL_IDLE = 0x8fa3b5; // before the first tap, when nothing can play yet
const MINI_ARROW = 0xffc20e;
const MINI_ARROW_HOT = 0xfff2c4;

const TITLE_SCALE = 1;
const SCROLL_MS_PER_PX = 22;
const SCROLL_HOLD = 1400;

class MiniPlayer {
  constructor(scene, x, y, opts = {}) {
    const { width = 372, height = 30, depth = 900 } = opts;
    this.scene = scene;
    this.cx = x;
    this.cy = y;
    this.w = width;
    this.h = height;

    this.index = Math.max(0, PLAYLIST.indexOf(audio.menuTrack));

    this.gfx = scene.add.graphics().setDepth(depth);
    drawChunkyPanel(this.gfx, x, y, width, height, MINI_PANEL, {
      edge: 3,
      notch: 3,
      bevel: 2,
    });

    const left = x - width / 2;
    const right = x + width / 2;

    // The note doubles as the playing light: lit while sound is actually
    // coming out, dim while the browser is still waiting for a gesture.
    this.noteX = left + 42;
    this.note = scene.add.graphics().setDepth(depth + 1);

    this.prev = this.arrow(left + 20, y, '<', -1, depth);
    this.next = this.arrow(right - 20, y, '>', 1, depth);

    // Everything between the note and the right arrow belongs to the title.
    this.winL = this.noteX + 12;
    this.winR = right - 38;
    this.winW = this.winR - this.winL;
    this.winX = (this.winL + this.winR) / 2;

    this.window = scene.add.container(this.winX, y).setDepth(depth + 2);
    const shape = scene.make.graphics();
    shape.fillStyle(0xffffff, 1);
    shape.fillRect(this.winL, y - height / 2, this.winW, height);
    this.window.setMask(shape.createGeometryMask());
    this.maskShape = shape;

    this.title = new PixelText(scene, 0, 0, '', {
      scale: TITLE_SCALE,
      color: MINI_LABEL,
      align: 'left',
      maxWidth: 99999, // never shrink; overflow scrolls instead
    });
    // Re-parent the text into the masked window so it clips at the edges.
    this.window.add(this.title.container);

    this.setTitle(trackTitle(this.currentName()));

    // Cheaper than a per-frame update, and the state it watches only changes
    // when the browser decides to let audio through.
    this.watch = scene.time.addEvent({
      delay: 200,
      loop: true,
      callback: () => this.refreshState(),
    });
    this.refreshState();

    // The mask shape is not on the display list, so scene shutdown does not
    // take it with everything else. Coming back to the title screen after an
    // ending would otherwise strand one of these every time.
    scene.events.once('shutdown', () => this.destroy());
  }

  currentName() {
    return PLAYLIST[this.index];
  }

  // Short names sit still and centred; long ones track back and forth so the
  // whole title is readable without ever being squashed.
  setTitle(text) {
    this.scroll?.remove();
    this.scroll = null;
    this.title.setText(text);

    const overflow = this.title.width - this.winW;
    if (overflow <= 0) {
      this.title.container.x = -this.title.width / 2;
      return;
    }

    this.title.container.x = -this.winW / 2;
    this.scroll = this.scene.tweens.add({
      targets: this.title.container,
      x: -this.winW / 2 - overflow,
      duration: Math.round(overflow * SCROLL_MS_PER_PX),
      ease: 'Linear',
      yoyo: true,
      repeat: -1,
      hold: SCROLL_HOLD,
      repeatDelay: SCROLL_HOLD,
    });
  }

  arrow(x, y, glyph, dir, depth) {
    const scene = this.scene;
    const text = new PixelText(scene, x, y, glyph, { scale: 2, color: MINI_ARROW });
    text.setDepth(depth + 3);

    const hit = scene.add
      .zone(x, y, 34, this.h)
      .setDepth(depth + 3)
      .setInteractive({ useHandCursor: true });

    hit.on('pointerover', () => {
      text.setTint(MINI_ARROW_HOT);
      audio.play('uiHover');
    });
    hit.on('pointerout', () => text.setTint(MINI_ARROW));
    hit.on('pointerdown', () => text.setPosition(x, y + 2));
    hit.on('pointerup', () => {
      text.setPosition(x, y);
      this.step(dir);
    });

    return { text, hit };
  }

  // Wraps in both directions, so with two songs either arrow is a toggle.
  step(dir) {
    this.index = (this.index + dir + PLAYLIST.length) % PLAYLIST.length;
    const name = this.currentName();
    audio.menuTrack = name;
    audio.savePrefs();
    audio.play('uiClick');
    audio.music(name, { fade: 600 });
    this.setTitle(trackTitle(name));
    this.refreshState();
  }

  // Lit note and a bright label once the track is genuinely running; muted
  // colours while it is still queued behind the browser's autoplay gate.
  refreshState() {
    const live = !!audio.el && !audio.el.paused && !audio.muted;
    this.title.setTint(live ? MINI_LABEL : MINI_LABEL_IDLE);

    const g = this.note;
    const x = this.noteX;
    const y = this.cy;
    g.clear();
    g.fillStyle(live ? MINI_ARROW : MINI_LABEL_IDLE, 1);
    g.fillRect(x + 3, y - 8, 2, 10); // stem
    g.fillRect(x + 5, y - 8, 4, 2); // flag
    g.fillRect(x - 2, y + 1, 6, 4); // head
  }

  // Safe to call twice: the shutdown hook fires after the display list has
  // already taken most of this with it.
  destroy() {
    if (this.dead) return;
    this.dead = true;
    this.scroll?.remove();
    this.watch?.remove();
    this.gfx.destroy();
    this.note.destroy();
    this.window.destroy(); // takes the title container with it
    this.maskShape.destroy();
    this.prev.text.destroy();
    this.prev.hit.destroy();
    this.next.text.destroy();
    this.next.hit.destroy();
  }
}

/* ---- js/ui/VolumeSlider.js ---- */

// Speaker plus a track. The speaker is a mute toggle in its own right, so this
// one control covers both "quieter" and "off" — which matters in the garden,
// where there is no other way to shut the game up.
const TRACK_BG = 0x1d2b3a;
const TRACK_FILL = 0xffc20e;
const TRACK_MUTED = 0x6c6a72;
const ICON = 0xfff2c4;
const OUTLINE = 0x0a2a3d;

class VolumeSlider {
  constructor(scene, x, y, opts = {}) {
    const { width = 104, depth = 2000 } = opts;
    this.scene = scene;
    this.x = x;
    this.y = y;
    this.w = width;

    this.icon = scene.add.graphics().setDepth(depth + 1);
    this.bar = scene.add.graphics().setDepth(depth);

    // The speaker sits left of the track; the track runs from `left` to `right`.
    this.iconX = x + 10;
    this.left = x + 26;
    this.right = x + width;

    this.iconHit = scene.add
      .zone(this.iconX, y, 26, 26)
      .setDepth(depth + 2)
      .setInteractive({ useHandCursor: true });
    this.iconHit.on('pointerup', () => {
      audio.toggleMute();
      audio.play('uiClick');
      this.redraw();
    });

    // The whole track is grabbable, and a tap anywhere on it jumps there —
    // hunting for a small knob with a thumb is miserable.
    this.barHit = scene.add
      .zone((this.left + this.right) / 2, y, this.right - this.left + 16, 30)
      .setDepth(depth + 2)
      .setInteractive({ useHandCursor: true, draggable: true });

    const set = (pointer) => {
      const v = (pointer.worldX - this.left) / (this.right - this.left);
      // Touching the slider is a clear statement that sound is wanted.
      if (audio.muted) audio.setMuted(false);
      audio.setVolume(v);
      this.redraw();
    };
    this.barHit.on('pointerdown', (p) => set(p));
    this.barHit.on('drag', (p) => set(p));

    this.redraw();
  }

  redraw() {
    const v = audio.muted ? 0 : audio.volume;
    const g = this.bar;
    const y = this.y;
    const span = this.right - this.left;
    const fill = this.left + span * v;

    g.clear();
    // Track: a thin dark bed with the filled part drawn over it.
    g.fillStyle(OUTLINE, 1);
    g.fillRect(this.left - 2, y - 5, span + 4, 10);
    g.fillStyle(TRACK_BG, 1);
    g.fillRect(this.left, y - 3, span, 6);
    g.fillStyle(audio.muted ? TRACK_MUTED : TRACK_FILL, 1);
    g.fillRect(this.left, y - 3, Math.max(0, fill - this.left), 6);
    // Knob.
    g.fillStyle(OUTLINE, 1);
    g.fillRect(fill - 4, y - 9, 8, 18);
    g.fillStyle(audio.muted ? TRACK_MUTED : ICON, 1);
    g.fillRect(fill - 2, y - 7, 4, 14);

    this.drawIcon();
  }

  // Same speaker shape the title screen uses, drawn small.
  drawIcon() {
    const g = this.icon;
    const x = this.iconX;
    const y = this.y;
    const s = 20;
    g.clear();
    g.fillStyle(audio.muted ? TRACK_MUTED : ICON, 1);
    g.fillRect(x - s * 0.42, y - s * 0.18, s * 0.26, s * 0.36);
    g.beginPath();
    g.moveTo(x - s * 0.16, y - s * 0.18);
    g.lineTo(x + s * 0.08, y - s * 0.42);
    g.lineTo(x + s * 0.08, y + s * 0.42);
    g.lineTo(x - s * 0.16, y + s * 0.18);
    g.closePath();
    g.fillPath();

    if (audio.muted) {
      g.lineStyle(2, 0xff4d6d, 1);
      g.beginPath();
      g.moveTo(x + s * 0.2, y - s * 0.26);
      g.lineTo(x + s * 0.5, y + s * 0.26);
      g.moveTo(x + s * 0.5, y - s * 0.26);
      g.lineTo(x + s * 0.2, y + s * 0.26);
      g.strokePath();
    }
  }

  destroy() {
    this.icon.destroy();
    this.bar.destroy();
    this.iconHit.destroy();
    this.barHit.destroy();
  }
}

/* ---- js/ui/MusicPicker.js ---- */

// A note button that drops a list of songs under it. Built for the garden,
// where picking the music is the whole point of the mode rather than a setting.
const PICK_PANEL = 0x1d2b3a;
const PICK_ROW_HOT = 0x2b4054;
const PICK_LABEL = 0xfff2c4;
const PICK_LABEL_DIM = 0x8fa3b5;
const PICK_ACCENT = 0xffc20e;

const PICK_ROW_H = 34;
const PICK_PANEL_W = 280;
const PICK_WRAP_CHARS = 20;

// Titles are long enough to need two lines at a readable size, and wrapping
// beats either shrinking them to mush or scrolling every row.
function pickWrapTitle(text, maxChars) {
  if (text.length <= maxChars) return [text];
  const lines = [''];
  text.split(' ').forEach((word) => {
    const cur = lines[lines.length - 1];
    const next = cur ? `${cur} ${word}` : word;
    if (!cur || next.length <= maxChars) lines[lines.length - 1] = next;
    else lines.push(word);
  });
  return lines;
}

class MusicPicker {
  constructor(scene, x, y, opts = {}) {
    const { depth = 2000 } = opts;
    this.scene = scene;
    this.x = x;
    this.y = y;
    this.depth = depth;
    this.open = false;
    this.rows = [];

    this.btnW = 44;
    this.btnH = 30;

    this.btn = scene.add.graphics().setDepth(depth);
    this.note = scene.add.graphics().setDepth(depth + 1);
    this.btnHit = scene.add
      .zone(x, y, this.btnW + 8, this.btnH + 8)
      .setDepth(depth + 2)
      .setInteractive({ useHandCursor: true });

    this.btnHit.on('pointerover', () => {
      this.hover = true;
      this.redrawButton();
      audio.play('uiHover');
    });
    this.btnHit.on('pointerout', () => {
      this.hover = false;
      this.redrawButton();
    });
    this.btnHit.on('pointerup', () => this.toggle());

    this.redrawButton();
  }

  get isOpen() {
    return this.open;
  }

  toggle() {
    audio.play('uiClick');
    if (this.open) this.close();
    else this.show();
  }

  redrawButton() {
    drawChunkyPanel(this.btn, this.x, this.y, this.btnW, this.btnH, PICK_PANEL, {
      edge: 3,
      notch: 3,
      bevel: 2,
      hover: this.hover,
      pressed: this.open,
    });

    // Two-note glyph, drawn rather than spritesheeted like the rest of the
    // interface icons.
    const g = this.note;
    const x = this.x;
    const y = this.y + (this.open ? 1 : 0);
    g.clear();
    g.fillStyle(PICK_ACCENT, 1);
    g.fillRect(x - 7, y - 8, 2, 12); // left stem
    g.fillRect(x + 5, y - 8, 2, 12); // right stem
    g.fillRect(x - 7, y - 8, 14, 2); // beam
    g.fillRect(x - 11, y + 2, 6, 4); // left head
    g.fillRect(x + 1, y + 2, 6, 4); // right head
  }

  show() {
    if (this.open) return;
    this.open = true;

    const rows = PLAYLIST.length;
    const h = rows * PICK_ROW_H + 12;
    const right = this.x + this.btnW / 2;
    const left = right - PICK_PANEL_W;
    const top = this.y + this.btnH / 2 + 6;
    const cx = (left + right) / 2;
    const cy = top + h / 2;

    this.panel = this.scene.add.graphics().setDepth(this.depth + 3);
    drawChunkyPanel(this.panel, cx, cy, PICK_PANEL_W, h, PICK_PANEL, {
      edge: 3,
      notch: 3,
      bevel: 2,
    });

    this.rows = PLAYLIST.map((name, i) => {
      const rowY = top + 6 + i * PICK_ROW_H + PICK_ROW_H / 2;
      const playing = audio.fileName === name;

      const highlight = this.scene.add.graphics().setDepth(this.depth + 4);
      const lines = pickWrapTitle(trackTitle(name), PICK_WRAP_CHARS);
      const texts = lines.map((line, li) => {
        const ly = rowY + (li - (lines.length - 1) / 2) * 13;
        const t = new PixelText(this.scene, left + 24, ly, line, {
          scale: 1,
          color: playing ? PICK_LABEL : PICK_LABEL_DIM,
          align: 'left',
          maxWidth: PICK_PANEL_W - 40,
        });
        t.setDepth(this.depth + 5);
        return t;
      });

      // A filled dot marks whichever song is actually coming out of the
      // speakers, so the list doubles as the now-playing display.
      const dot = this.scene.add.graphics().setDepth(this.depth + 5);
      dot.fillStyle(playing ? PICK_ACCENT : PICK_LABEL_DIM, playing ? 1 : 0.45);
      dot.fillRect(left + 12, rowY - 3, 6, 6);

      const hit = this.scene.add
        .zone(cx, rowY, PICK_PANEL_W - 12, PICK_ROW_H - 2)
        .setDepth(this.depth + 6)
        .setInteractive({ useHandCursor: true });

      const paint = (on) => {
        highlight.clear();
        if (!on) return;
        highlight.fillStyle(PICK_ROW_HOT, 1);
        highlight.fillRect(left + 6, rowY - PICK_ROW_H / 2 + 2, PICK_PANEL_W - 12, PICK_ROW_H - 4);
      };

      hit.on('pointerover', () => {
        paint(true);
        audio.play('uiHover');
      });
      hit.on('pointerout', () => paint(false));
      hit.on('pointerup', () => this.pick(name));

      return { highlight, texts, dot, hit };
    });
  }

  pick(name) {
    audio.play('uiConfirm');
    audio.music(name, { fade: 700 });
    // Remembered the same way the title screen's strip remembers it, so the
    // choice carries between the two.
    audio.menuTrack = name;
    audio.savePrefs();
    this.close();
  }

  close() {
    if (!this.open) return;
    this.open = false;
    this.panel?.destroy();
    this.panel = null;
    this.rows.forEach((r) => {
      r.highlight.destroy();
      r.texts.forEach((t) => t.destroy());
      r.dot.destroy();
      r.hit.destroy();
    });
    this.rows = [];
    this.redrawButton();
  }

  destroy() {
    this.close();
    this.btn.destroy();
    this.note.destroy();
    this.btnHit.destroy();
  }
}

/* ---- js/ui/SpeechBubble.js ---- */

// A compact pixel speech bubble that types its line out. Sized once from the
// wrapped text and then filled in, so the box never grows mid-sentence.
const INK = 0x241f2e;
const PAPER = 0xf6f2e8;
// Two steps each way rather than one hard band, so the face rolls off instead
// of stepping straight from white to paper.
const PAPER_LIT = [0xffffff, 0xfbf8f1];
const PAPER_DIM = [0xe7e0d1, 0xcfc7b4];
// The drop shadow is two-tone for the same reason.
const DROP_NEAR = 0x8ea6d2;
const DROP_FAR = 0xb9c9e9;
const SB_NOTCH = 4; // corner squares left out, which rounds the corners
const SB_EDGE = 3; // outline thickness
const SB_BEVEL = 2;
const PAD_X = 8;
const PAD_Y = 7;
const LINE_H = 15;
// Whole number on purpose. A fractional scale resamples the glyphs unevenly
// and the text goes soft, which is exactly what it did at 0.85.
const TEXT_SCALE = 1;

const MS_PER_CHAR = 45;
const BUBBLE_HOLD_MS = 1000;

// Greedy word wrap. Long words are left alone rather than broken.
function wrapText(text, maxChars) {
  const words = String(text).toUpperCase().split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach((word) => {
    const candidate = line ? `${line} ${word}` : word;
    if (candidate.length > maxChars && line) {
      lines.push(line);
      line = word;
    } else {
      line = candidate;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function speechDuration(text, maxChars) {
  return wrapText(text, maxChars).join('').length * MS_PER_CHAR;
}

function sbPlus(g, left, top, w, h, notch) {
  g.fillRect(left + notch, top, w - notch * 2, h);
  g.fillRect(left, top + notch, w, h - notch * 2);
}

class SpeechBubble {
  // `tailX`/`tailY` is the point the tail reaches toward — the speaker's head.
  constructor(scene, cx, cy, text, opts = {}) {
    const { maxChars = 24, depth = 1500, tailX = cx, tailY = cy + 40, voicePitch = 1 } = opts;

    this.scene = scene;
    this.lines = wrapText(text, maxChars);
    this.depth = depth;
    this.voicePitch = voicePitch;

    // The bold font sheet at scale 1: whole pixels, so it stays sharp.
    this.texts = this.lines.map(
      (line) =>
        new PixelText(scene, 0, 0, line, {
          scale: TEXT_SCALE,
          color: INK,
          align: 'left',
          maxWidth: 9999,
          bold: true,
        }),
    );
    const textW = Math.max(...this.texts.map((t) => t.width));
    this.w = Math.round(textW + PAD_X * 2);
    this.h = Math.round(this.lines.length * LINE_H + PAD_Y * 2);
    this.cx = cx;
    this.cy = cy;

    this.gfx = scene.add.graphics().setDepth(depth);
    this.draw(tailX, tailY);

    const left = cx - this.w / 2 + PAD_X;
    const top = cy - this.h / 2 + PAD_Y + 6;
    this.texts.forEach((t, i) => {
      t.setDepth(depth + 2);
      t.setPosition(left, top + i * LINE_H);
      t.setText('');
    });

    this.container = [this.gfx, ...this.texts.map((t) => t.container)];
    this.setAlpha(0);
    scene.tweens.add({ targets: this.container, alpha: 1, duration: 160 });
  }

  draw(tailX, tailY) {
    const g = this.gfx;
    const left = Math.round(this.cx - this.w / 2);
    const top = Math.round(this.cy - this.h / 2);

    // Shadow first, offset down-right, in two steps.
    g.fillStyle(DROP_FAR, 1);
    sbPlus(g, left + 5, top + 5, this.w, this.h, SB_NOTCH);
    g.fillStyle(DROP_NEAR, 1);
    sbPlus(g, left + 3, top + 3, this.w, this.h, SB_NOTCH);

    g.fillStyle(INK, 1);
    sbPlus(g, left, top, this.w, this.h, SB_NOTCH);

    const inX = left + SB_EDGE;
    const inY = top + SB_EDGE;
    const inW = this.w - SB_EDGE * 2;
    const inH = this.h - SB_EDGE * 2;

    g.fillStyle(PAPER, 1);
    sbPlus(g, inX, inY, inW, inH, SB_NOTCH);

    // Lit along the top-left, shaded along the bottom-right, so the face reads
    // as a raised panel rather than a flat cut-out. Each side is graded over
    // two one-pixel steps.
    PAPER_LIT.forEach((tone, i) => {
      g.fillStyle(tone, 1);
      g.fillRect(inX + SB_NOTCH, inY + i, inW - SB_NOTCH * 2, 1);
      g.fillRect(inX + i, inY + SB_NOTCH, 1, inH - SB_NOTCH * 2);
    });

    PAPER_DIM.forEach((tone, i) => {
      g.fillStyle(tone, 1);
      g.fillRect(inX + SB_NOTCH, inY + inH - 1 - i, inW - SB_NOTCH * 2, 1);
      g.fillRect(inX + inW - 1 - i, inY + SB_NOTCH, 1, inH - SB_NOTCH * 2);
    });

    // Stepped tail, drawn toward the speaker and always from the bubble's
    // bottom edge — every speaker in this scene sits below their bubble.
    const dir = tailX < this.cx ? -1 : 1;
    const baseX = Math.round(this.cx + dir * Math.min(this.w / 2 - 22, 34));
    const baseY = top + this.h;
    const steps = 3;
    for (let i = 0; i < steps; i++) {
      const stepW = 14 - i * 4;
      const x = baseX + dir * i * 4;
      g.fillStyle(INK, 1);
      g.fillRect(x - stepW / 2, baseY - SB_EDGE + i * 4, stepW, 4 + SB_EDGE);
      g.fillStyle(PAPER, 1);
      g.fillRect(x - stepW / 2 + SB_EDGE, baseY - SB_EDGE + i * 4, stepW - SB_EDGE * 2, 4);
    }
    void tailY;
  }

  // Reveals the text one character at a time, line by line.
  type(onDone) {
    let line = 0;
    let chars = 0;
    this.typer = this.scene.time.addEvent({
      delay: MS_PER_CHAR,
      loop: true,
      callback: () => {
        if (line >= this.lines.length) {
          this.typer.remove();
          onDone?.();
          return;
        }
        chars += 1;
        this.texts[line].setText(this.lines[line].slice(0, chars));
        // Every other character, not every one: at 45ms a blip per letter is a
        // machine gun. The pitch is set per speaker so the two of them sound
        // like two different people talking.
        if (chars % 2 === 0) audio.play('blip', { pitch: this.voicePitch ?? 1 });
        if (chars >= this.lines[line].length) {
          line += 1;
          chars = 0;
        }
      },
    });
    return this;
  }

  // Skip straight to the finished line, for when the player taps through.
  reveal() {
    this.typer?.remove();
    this.texts.forEach((t, i) => t.setText(this.lines[i]));
  }

  setAlpha(a) {
    this.gfx.setAlpha(a);
    this.texts.forEach((t) => t.setAlpha(a));
  }

  hide(onDone) {
    this.typer?.remove();
    this.scene.tweens.add({
      targets: this.container,
      alpha: 0,
      duration: 180,
      onComplete: () => {
        this.destroy();
        onDone?.();
      },
    });
  }

  destroy() {
    this.typer?.remove();
    this.gfx.destroy();
    this.texts.forEach((t) => t.destroy());
  }
}

// `label` is optional. The ally pickup deliberately has none: three blue blobs
// appearing around her says it better than a line of text does, and the hint
// only got in the way of watching them arrive.
const POWERUPS = [
